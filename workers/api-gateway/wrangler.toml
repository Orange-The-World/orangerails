name = "api-orangerails"
main = "src/index.ts"
compatibility_date = "2026-05-31"
workers_dev = true

[vars]
OR_SUPABASE_URL = "https://lcdicqalreskibdfxkzb.supabase.co"

# Staging deploys to a workers.dev URL for verification. The custom
# domain `api.orangerails.dev` is bound separately (one time, via the
# Cloudflare dashboard Custom Domains tab on this Worker, or a scoped
# API call). Wrangler's auto route binding requires a token with Zone
# scope on the orangerails.dev zone, and we keep the deploy token
# narrower than that. The dev gateway then proxies to OR DEV Supabase
# (fzwmnzmtqidumdqjdddz) so dev traffic never touches prod data.
# Must match the dev arm of supabase-deploy.yml's "Pick Supabase target"
# step; if you change one, change the other.
[env.staging]
name = "api-orangerails-staging"
workers_dev = true

[env.staging.vars]
OR_SUPABASE_URL = "https://fzwmnzmtqidumdqjdddz.supabase.co"

# Production deploys to its workers.dev URL too. The api.orangerails.com
# route is bound once in the CF dashboard pointing at this script name;
# subsequent code deploys then ship to that route automatically. See
# the Roadmap (Step 3 — DNS flip) for the one-time binding.
[env.production]
name = "api-orangerails-production"
workers_dev = true

[env.production.vars]
OR_SUPABASE_URL = "https://lcdicqalreskibdfxkzb.supabase.co"
