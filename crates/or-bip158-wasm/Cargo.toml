[package]
name = "or-bip158-wasm"
version = "0.1.0"
edition = "2021"
description = "BIP158 compact-block-filter matcher compiled to WebAssembly for Orange Rails Stealth Sync."
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
bitcoin = { version = "0.32", default-features = false, features = ["secp-lowmemory"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
