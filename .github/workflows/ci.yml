name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project is managed with Bun (bun.lock, bunfig.toml).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        # Don't fail the whole CI on lint warnings yet -- the codebase
        # is young, warnings are noise, and a false-red CI trains
        # everyone to ignore the signal.
        continue-on-error: true

      - name: Build
        run: bun run build

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Runs against the already-deployed dev site. Two separate things deploy
    # that site, and neither of them is this workflow:
    #   frontend      -> Cloudflare Pages, from its own git integration, on
    #                    every push (branch dev is the production env of the
    #                    orangerails-dev project; feature branches get previews).
    #   edge functions -> supabase-deploy.yml, on every push to dev and prod.
    # Migrations are NOT deployed by either: they are applied by hand (the DBA
    # on dev, two party on prod) or by an explicit dispatch of supabase-deploy
    # with apply_migrations checked.
    #
    # A PR run therefore exercises the PR's tests against the currently-deployed
    # site; once the PR merges, the next run exercises the PR's own UI changes
    # after deploy.
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Fail loud if any connector-identity secret is missing.
      # The test suite has a test.skip() guard that fires when these are absent,
      # which Playwright counts as passing. A skip is not a pass: this step
      # ensures a misconfigured run is a hard failure, not a silent green.
      - name: Require connector-identity secrets
        env:
          OR_API_BASE_URL: ${{ secrets.OR_API_BASE_URL }}
          ACCOUNT_A: ${{ secrets.ACCOUNT_A }}
          ACCOUNT_B: ${{ secrets.ACCOUNT_B }}
          OR_TEST_PLATFORM_API_KEY: ${{ secrets.OR_TEST_PLATFORM_API_KEY }}
          OR_TEST_PLATFORM_SLUG: ${{ secrets.OR_TEST_PLATFORM_SLUG }}
        run: |
          missing=()
          [ -z "$OR_API_BASE_URL" ]          && missing+=(OR_API_BASE_URL)
          [ -z "$ACCOUNT_A" ]                && missing+=(ACCOUNT_A)
          [ -z "$ACCOUNT_B" ]                && missing+=(ACCOUNT_B)
          [ -z "$OR_TEST_PLATFORM_API_KEY" ] && missing+=(OR_TEST_PLATFORM_API_KEY)
          [ -z "$OR_TEST_PLATFORM_SLUG" ]    && missing+=(OR_TEST_PLATFORM_SLUG)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required GitHub repository secrets: ${missing[*]}"
            echo "These must be set on the repo before connector-identity tests can run."
            exit 1
          fi
          echo "All 5 connector-identity secrets present."

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://orangerails.dev' }}
          OR_API_BASE_URL: ${{ secrets.OR_API_BASE_URL }}
          ACCOUNT_A: ${{ secrets.ACCOUNT_A }}
          ACCOUNT_B: ${{ secrets.ACCOUNT_B }}
          OR_TEST_PLATFORM_API_KEY: ${{ secrets.OR_TEST_PLATFORM_API_KEY }}
          OR_TEST_PLATFORM_SLUG: ${{ secrets.OR_TEST_PLATFORM_SLUG }}
        run: bunx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore
