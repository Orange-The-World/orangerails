name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project is managed with Bun (bun.lockb, bunfig.toml).
      # The older workflow used `npm ci` which broke on every dep add
      # because Lovable only updates bun.lockb, not package-lock.json.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        # Don't fail the whole CI on lint warnings yet — the codebase
        # is young, warnings are noise, and a false-red CI trains
        # everyone to ignore the signal.
        continue-on-error: true

      - name: Build
        run: bun run build
