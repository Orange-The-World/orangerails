name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The project is managed with Bun (bun.lock, bunfig.toml).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        # Don't fail the whole CI on lint warnings yet , the codebase
        # is young, warnings are noise, and a false-red CI trains
        # everyone to ignore the signal.
        continue-on-error: true

      - name: Build
        run: bun run build

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Runs against the already-deployed dev site by default. The pages-deploy
    # workflow refreshes dev on every push to `dev`. PR runs exercise the
    # PR's tests against the currently-deployed site; once a PR merges, the
    # next workflow run will exercise the PR's own UI changes after deploy.
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://orangerails.dev' }}
        run: bunx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore
