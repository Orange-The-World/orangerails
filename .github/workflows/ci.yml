name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project is managed with Bun (bun.lock, bunfig.toml).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (advisory, not a gate)
        run: bun run lint
        # The linter currently reports errors (not warnings) -- run 29531126957
        # logged 8,873 prettier/prettier errors. continue-on-error: true means
        # this step cannot fail today and must not be read as a passing gate.
        # A ratchet to drive the error count to zero, lane by lane, is tracked
        # separately and will remove this flag when each lane is clean.
        continue-on-error: true

      - name: Public-auth declaration check
        # A real gate, deliberately WITHOUT continue-on-error, unlike the lint step above.
        # Asserts supabase/functions/public-auth.json and supabase/config.toml agree in both
        # directions: nothing is exposed without declaring its own auth, and nothing declares
        # itself public while the gateway check is still on. See the script header for why this
        # is a declaration rather than a code scan.
        run: node scripts/check-public-auth.mjs

      - name: Anon RPC grant self-test
        # The parser IS the control, so it is tested here rather than trusted. Runs before the
        # check itself so a broken parser fails as a broken parser, not as a silent pass over
        # every migration.
        run: node scripts/check-anon-rpc-grants.mjs --selftest

      - name: Anon RPC grant check
        # A real gate, no continue-on-error. Replays the migrations in order and fails if any
        # function in the public schema is left executable by anon without being declared in
        # supabase/anon-executable-rpcs.json with a reason. Source scan only: a grant typed
        # straight into a SQL console never reaches a migration and is not visible here. See
        # the script header for that boundary in full.
        run: node scripts/check-anon-rpc-grants.mjs

      - name: Anon ACL snapshot self-test
        # The other half of the same control, and the half that reads a real database rather
        # than our SQL. No credential lives in CI, so the check itself runs against a catalog
        # snapshot outside this workflow. What runs here is its parser test, because a parser
        # nobody exercises reports green whether it works or not. It pins the two cases a role
        # name match gets wrong: an empty grantee (=X/postgres), which is how Postgres writes
        # PUBLIC, and a NULL acl, which means the built in default stands and PUBLIC holds
        # EXECUTE. Needs nothing but node, so it is unconditional.
        run: node scripts/check-anon-acl-snapshot.mjs --selftest

      - name: Build
        run: bun run build

  deno-typecheck:
    name: Typecheck edge functions (Deno)
    runs-on: ubuntu-latest
    # Why this job exists: until 2026-07-26 CI never looked at supabase/functions
    # at all. `bun run lint` carries continue-on-error (see the note on it above)
    # and `bun run build` only builds the Vite frontend, so every one of the 37
    # edge functions could stop compiling with CI still green. The open Strike
    # attribution pull request showed 9 of 9 checks green on a tree that
    # `deno check` rejected with 19 errors, one of them a real
    # Map<string, string> vs Map<string, {...}> mismatch on the Strike drain
    # path. (No PR number here on purpose: scripts/pre-publish-scan.sh flags
    # bare #NNNN references in shipping files as dead PR refs.)
    #
    # Gate design -- read this before changing it. This is a RATCHET, not a
    # wall: it fails only when the error count goes ABOVE the recorded
    # baseline. A plain `deno check` gate would go red on day one and block
    # every open PR in the repo; a `continue-on-error: true` advisory would
    # reproduce the exact blindness this job exists to end. The ratchet does
    # neither -- new type errors cannot land, the existing backlog is printed
    # in the job summary on every run, and the number only moves down.
    #
    # Making this check REQUIRED in the branch ruleset is a FOUNDER DECISION
    # and has deliberately NOT been done here. Nothing in this PR touches
    # branch protection.
    env:
      # Errors present on dev when this job was added, measured 2026-07-26 with
      # the pinned Deno below. Lower it in the same PR that fixes errors -- the
      # job prints the new value when the count drops. At 0, delete the ratchet
      # and let `deno check` fail on its own.
      DENO_CHECK_BASELINE: '14'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned, not `latest`. These functions run on Supabase's edge
          # runtime, which the Supabase CLI provisions as edge-runtime v1.74.2
          # == deno 2.1.4; typecheck with the tsc the runtime actually ships.
          # Floating on latest would also move the number for reasons unrelated
          # to our code: the orangerails tree reports 15 errors on 2.1.4 and 21
          # on 2.9.4, purely from the newer bundled tsc.
          deno-version: v2.1.4

      - name: Restore Deno module cache
        id: deno-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deno-dir
          key: deno-v2.1.4-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: deno-v2.1.4-

      - name: Populate Deno cache and write lock
        env:
          DENO_DIR: ${{ runner.temp }}/deno-dir
          NO_COLOR: '1'
        run: |
          mapfile -t FILES < <(find supabase/functions -name '*.ts' -type f | sort)
          deno cache --lock=deno.lock --node-modules-dir=auto "${FILES[@]}"

      - name: deno check supabase/functions
        shell: bash
        env:
          DENO_DIR: ${{ runner.temp }}/deno-dir
          # Deno colourises its diagnostics even when stdout+stderr are
          # redirected to a file on the runner. The first version of this step
          # counted "[ERROR]" fine but its per-class breakdown grepped for
          # 'TS1234 [ERROR]' and matched nothing, because the real bytes are
          # 'TS1234 <ESC>[0m[ERROR]'. Under `-e -o pipefail` that zero-match
          # grep killed the step, so the job went red while reporting exactly
          # the baseline count. NO_COLOR removes the escapes at the source; the
          # sed below strips them anyway, because a parser that only works when
          # the output happens to be plain is the same class of unreliable
          # control this job exists to replace.
          NO_COLOR: '1'
        run: |
          set -u

          # Scoped to the edge functions only. The rest of the repo is
          # Bun/Vite and is covered by the lint-and-build job.
          mapfile -t FILES < <(find supabase/functions -name '*.ts' -type f | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No .ts files found under supabase/functions -- this job is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi
          echo "Checking ${#FILES[@]} file(s) with $(deno --version | head -1)"

          # --node-modules-dir=auto: the repo has a root package.json, so Deno
          # otherwise refuses npm: specifiers with "run deno install first".
          RC=0
          deno check --lock=deno.lock --node-modules-dir=auto "${FILES[@]}" > "$RUNNER_TEMP/deno-check.raw" 2>&1 || RC=$?
          sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deno-check.raw" > "$RUNNER_TEMP/deno-check.log"
          cat "$RUNNER_TEMP/deno-check.log"

          # One "[ERROR]" marker per diagnostic (the last is additionally
          # prefixed "error: "). Counting markers is stable; Deno's
          # "Found N errors." line is not printed when N == 1.
          ERRORS=$(grep -c '\[ERROR\]' "$RUNNER_TEMP/deno-check.log" || true)

          # A non-zero exit with no diagnostics means the check itself broke
          # (network, unresolvable import, bad flag). That must never be scored
          # as "0 errors, under baseline, pass" -- a check that silently stops
          # checking is the precise failure this job exists to eliminate.
          if [ "$RC" -ne 0 ] && [ "$ERRORS" -eq 0 ]; then
            echo "::error::deno check exited $RC without reporting any type diagnostic. The check is broken, not passing."
            exit 1
          fi

          {
            echo "## Deno typecheck: supabase/functions"
            echo
            echo "**${ERRORS} error(s)** across ${#FILES[@]} file(s) (ratchet baseline: ${DENO_CHECK_BASELINE})"
            if [ "$ERRORS" -gt 0 ]; then
              echo
              echo "By error class:"
              echo '```'
              grep -oE 'TS[0-9]+ \[ERROR\]' "$RUNNER_TEMP/deno-check.log" | sort | uniq -c | sort -rn || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "deno check: ${ERRORS} error(s); ratchet baseline ${DENO_CHECK_BASELINE}"

          if [ "$ERRORS" -gt "$DENO_CHECK_BASELINE" ]; then
            echo "::error::Edge-function type errors went UP: ${ERRORS} > baseline ${DENO_CHECK_BASELINE}. Fix the new errors listed above. Do not raise the baseline."
            exit 1
          fi

          if [ "$ERRORS" -lt "$DENO_CHECK_BASELINE" ]; then
            echo "::notice::Error count dropped to ${ERRORS}. Lower DENO_CHECK_BASELINE to ${ERRORS} in .github/workflows/ci.yml in this PR so the ratchet holds the ground you just took."
          fi

      - name: Upload deno.lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deno-lock
          path: deno.lock
          retention-days: 7

  deno-test:
    name: Test edge functions (Deno)
    runs-on: ubuntu-latest
    # Why this job exists: the repo has carried edge-function tests since long
    # before this job, and not one of them has ever run. `deno check` above
    # typechecks supabase/functions but never executes it, vitest's include is
    # scoped to `src/**/*.test.ts`, and no workflow invoked `deno test` at all.
    # Nine test files, zero enforcement.
    #
    # That is not a theoretical gap. When these were first executed, one had
    # rotted into asserting the opposite of the shipped behaviour: a Strike
    # test pinned "callers must uppercase currency before calling
    # resolveInvoiceWallet" after normalization had already been moved inside
    # computeWalletFingerprint. It was corrected in the same change that added
    # this job. A test nobody runs does not decay into useless, it decays into
    # wrong, and then it blocks whoever finally turns it on.
    #
    # --no-check is deliberate and matches the header of every test file here.
    # Typechecking is the ratchet job above, which tolerates a known baseline;
    # duplicating it here would make the test job fail for reasons that have
    # nothing to do with any assertion.
    #
    # As with the ratchet job: making this check REQUIRED in the branch ruleset
    # is a FOUNDER DECISION and has deliberately NOT been done here. Nothing in
    # this change touches branch protection.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Same pin and same reason as the typecheck job above: the Supabase
          # edge runtime is deno 2.1.4, so tests run on the runtime that ships.
          deno-version: v2.1.4

      - name: deno test supabase/functions
        shell: bash
        env:
          # The baseline is the number of test files actually present on the
          # branch this job is running against, and it is PER BRANCH because
          # the two branches genuinely differ.
          #
          # MEASURED 2026-08-03 with this job's own find pattern:
          #   dev  16 files
          #   prod  9 files
          #
          # The value shipped when this guard landed was 3, which was the count
          # of test-file DIRECTORIES someone eyeballed rather than the count of
          # files the pattern collects. A baseline of 3 against a real 15 means
          # twelve test files can disappear and this job still reports green,
          # which is the exact failure DL-0459 was opened to stop. The guard was
          # correct; only its number was wrong.
          #
          # Why this is an expression and not one number: prod's tree has 9,
          # so a single hardcoded 15 promoted from dev to prod turns this job
          # red on prod the moment it lands, on a count that is correct for
          # prod. Selecting on the branch lets the same file be true on both.
          #
          # When you add or remove a test file, change the number for that
          # branch in the same PR, and say why in the message if it goes down.
          DENO_TEST_FILE_BASELINE: ${{ (github.base_ref == 'prod' || github.ref_name == 'prod') && '9' || '16' }}
        run: |
          set -euo pipefail

          mapfile -t TEST_FILES < <(find supabase/functions \( -name '*_test.ts' -o -name '*.test.ts' \) | sort)
          FILE_COUNT="${#TEST_FILES[@]}"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No test files found -- deno test is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi

          if [ "$FILE_COUNT" -lt "$DENO_TEST_FILE_BASELINE" ]; then
            echo "::error::Test file count dropped to ${FILE_COUNT} (baseline: ${DENO_TEST_FILE_BASELINE}). Restore missing files or lower the baseline with justification."
            printf '%s\n' "${TEST_FILES[@]}" | sed 's/^/  collected: /'
            exit 1
          fi

          # Print the collected list, not only the count. A count that matches
          # the baseline can still be the wrong fifteen files, and the list is
          # what makes that visible in the log without a rerun.
          printf '%s\n' "${TEST_FILES[@]}" | sed 's/^/  collected: /'
          echo "Found ${FILE_COUNT} test file(s) (baseline: ${DENO_TEST_FILE_BASELINE})"
          deno test --no-check --allow-all supabase/functions/

  vitest:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    # Why this job exists: src/**/*.test.ts carries discriminating tests for the
    # stealth/sync orchestrator: birthday height rejection and the stored-cursor
    # short-circuit requirement. Without this job those tests sit in the tree
    # and never gate a merge. Runner note: bun test cannot run this suite
    # because vitest uses vi.stubGlobal, which bun's runner does not implement.
    # It fails every case for a tooling reason unrelated to the code. npx vitest
    # run matches the test script in package.json and is the correct runner for
    # this repo. No PR number here on purpose: pre-publish-scan.sh flags bare
    # NNNN references in shipping files as dead PR refs.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run vitest
        run: npx vitest run

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Runs against the already-deployed dev site. Two separate things deploy
    # that site, and neither of them is this workflow:
    #   frontend      -> Cloudflare Pages, from its own git integration, on
    #                    every push (branch dev is the production env of the
    #                    orangerails-dev project; feature branches get previews).
    #   edge functions -> supabase-deploy.yml, on every push to dev and prod.
    # Migrations are NOT deployed by either: they are applied by hand (the DBA
    # on dev, two party on prod) or by an explicit dispatch of supabase-deploy
    # with apply_migrations checked.
    #
    # A PR run therefore exercises the PR's tests against the currently-deployed
    # site; once the PR merges, the next run exercises the PR's own UI changes
    # after deploy.
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Gate: all five secrets required by connector-identity.spec.ts must be
      # present before Playwright starts. If any are missing, the suite's
      # test.skip() guard would fire, all cases would skip, and the job would
      # exit 0 -- a green tick that proves nothing. Failing loudly here
      # instead, so a misconfigured CI is never mistaken for a passing suite.
      - name: Require connector-identity secrets
        env:
          OR_API_BASE_URL: ${{ secrets.OR_API_BASE_URL }}
          ACCOUNT_A: ${{ secrets.ACCOUNT_A }}
          ACCOUNT_B: ${{ secrets.ACCOUNT_B }}
          OR_TEST_PLATFORM_API_KEY: ${{ secrets.OR_TEST_PLATFORM_API_KEY }}
          OR_TEST_PLATFORM_SLUG: ${{ secrets.OR_TEST_PLATFORM_SLUG }}
        run: |
          missing=""
          [ -z "$OR_API_BASE_URL" ]          && missing="$missing OR_API_BASE_URL"
          [ -z "$ACCOUNT_A" ]                && missing="$missing ACCOUNT_A"
          [ -z "$ACCOUNT_B" ]                && missing="$missing ACCOUNT_B"
          [ -z "$OR_TEST_PLATFORM_API_KEY" ] && missing="$missing OR_TEST_PLATFORM_API_KEY"
          [ -z "$OR_TEST_PLATFORM_SLUG" ]    && missing="$missing OR_TEST_PLATFORM_SLUG"
          if [ -n "$missing" ]; then
            echo "ERROR: connector-identity suite cannot run: missing secrets$missing"
            echo "A skipped suite must not report pass. Fix the repo secrets and retry."
            exit 1
          fi

      - name: Resolve Playwright base URL
        # On pull_request: build the Cloudflare Pages branch-preview URL from
        # the head ref so Playwright tests against the actual branch build.
        # On push to dev/prod: keep the static deployment URL unchanged.
        # CF Pages branch-alias slug rules: lowercase, non-alphanumeric to
        # hyphen, collapse consecutive hyphens, strip trailing hyphens,
        # truncate at 28 chars.
        run: |
          # dev and prod branches have no Cloudflare branch preview; their
          # builds go to the static host. Only feature-branch PRs get
          # a per-branch preview URL.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" != "dev" ] && [ "$GITHUB_HEAD_REF" != "prod" ]; then
            SLUG=$(echo "$GITHUB_HEAD_REF" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9]/-/g' \
              | sed 's/-\+/-/g' \
              | cut -c1-28 \
              | sed 's/-$//')
            echo "PLAYWRIGHT_BASE_URL=https://${SLUG}.orangerails-dev.pages.dev" >> "$GITHUB_ENV"
          else
            echo "PLAYWRIGHT_BASE_URL=https://dev.orangerails.com" >> "$GITHUB_ENV"
          fi

      - name: Run Playwright
        env:
          OR_API_BASE_URL: ${{ secrets.OR_API_BASE_URL }}
          ACCOUNT_A: ${{ secrets.ACCOUNT_A }}
          ACCOUNT_B: ${{ secrets.ACCOUNT_B }}
          OR_TEST_PLATFORM_API_KEY: ${{ secrets.OR_TEST_PLATFORM_API_KEY }}
          OR_TEST_PLATFORM_SLUG: ${{ secrets.OR_TEST_PLATFORM_SLUG }}
        # --forbid-only: fail if any test.only() was left in a committed spec.
        # Same failure shape as the skip problem: .only() causes all other
        # tests to skip and the job exits 0. --forbid-only makes that loud too.
        run: bunx playwright test --forbid-only

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore

  playwright-stealth-cursor:
    name: Playwright stealth cursor-write proof (DL-0649)
    runs-on: ubuntu-latest
    needs: lint-and-build
    # Explicit, because the reporting step below is the ONLY way the assertion
    # output leaves this runner. Without this block the job inherits the
    # repository default token scope, and if that default is read-only then
    # `gh pr comment` is refused and the failure text is trapped in the run log.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Start vite before either leg. playwright.config.ts has
      # reuseExistingServer: true, so both Leg 2 and Leg 1 reuse this process
      # rather than starting their own. A server Playwright did NOT start is
      # not killed when Playwright exits -- so the Leg 2 guard-throw exit
      # cannot kill the server that Leg 1 needs. Previous order (Leg 2 first)
      # let Playwright start and kill vite before this step could restart it,
      # causing a racy cold-restart that timed out on slow CI runners.
      # VITE_OR_STEALTH_ALLOWED_ORIGINS must match the parent-page origin
      # (http://localhost:8080) so the widget accepts the postMessage.
      - name: Start vite dev server
        env:
          VITE_SUPABASE_URL: https://fzwmnzmtqidumdqjdddz.supabase.co
          VITE_SUPABASE_PROJECT_ID: fzwmnzmtqidumdqjdddz
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_OR_STEALTH_ALLOWED_ORIGINS: http://localhost:8080
        run: |
          bun run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080 -o /dev/null && echo "Vite ready after ${i}s" && break
            sleep 1
          done
          curl -sf http://localhost:8080 -o /dev/null || {
            echo "::error::Vite dev server did not start within 60s"
            exit 1
          }

      # Leg 2: run with PLAYWRIGHT_WITH_VITE_DEV=1 but no credentials.
      # The module-level guard in stealth-cursor-write.spec.ts throws at
      # eval time, so Playwright exits non-zero immediately. With vite already
      # running above, reuseExistingServer: true means Playwright finds port
      # 5173 up and does not start a second server -- so the guard-throw exit
      # does not kill the server Leg 1 needs.
      # If it exits 0 the guard is broken and we fail loudly.
      - name: Guard proof (leg 2 -- guard throws without credentials)
        run: |
          if PLAYWRIGHT_WITH_VITE_DEV=1 bunx playwright test --grep 'stealth cursor write' 2>&1; then
            echo "::error::Guard did not throw -- test exited 0 without credentials. The module-level guard is broken."
            exit 1
          fi
          echo "Leg 2 PASS: guard threw as expected (non-zero exit confirmed)"

      # Leg 1: full test run with vite dev server and real credentials.
      # Route intercepts handle or-stealth-envelope-fetch (mock response);
      # or-stealth-envelope-update is proxied through Node.js with
      # OR_TEST_PLATFORM_API_KEY so the real DB row is written and verified.
      # Expected result: 1 passed, 0 skipped.
      - name: Stealth cursor-write proof (leg 1 -- 1 passed, 0 skipped)
        env:
          PLAYWRIGHT_WITH_VITE_DEV: '1'
          OR_API_BASE_URL: ${{ secrets.OR_API_BASE_URL }}
          OR_TEST_PLATFORM_API_KEY: ${{ secrets.OR_TEST_PLATFORM_API_KEY }}
        run: |
          bunx playwright test --grep 'stealth cursor write' 2>&1 | tee /tmp/pw-leg1.log
          exit ${PIPESTATUS[0]}

      - name: Report Leg 1 failure as PR comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ] || [ "$PR" = "0" ]; then
            echo "Not a PR run -- skipping comment"
            exit 0
          fi
          if [ -f /tmp/pw-leg1.log ]; then
            LINES=$(grep -E '(Error:|Expected|Received|AssertionError|FAILED)' \
              /tmp/pw-leg1.log | head -40 || true)
          else
            LINES="(leg 1 log not found -- see playwright-stealth-cursor-report artifact)"
          fi
          {
            echo "**CI: stealth cursor-write proof -- Leg 1 failure (run ${{ github.run_id }})**"
            echo ""
            echo "Assertion output (error lines only, no credentials):"
            printf '```\n'
            echo "${LINES}"
            printf '```\n'
            echo ""
            echo "Full report: playwright-stealth-cursor-report artifact on run ${{ github.run_id }}."
          } > /tmp/pr-body.md
          # Print it locally FIRST. A post that gets refused must not also lose
          # the evidence: stdout and the job summary are written before the
          # network call, so the text exists in three places or at worst two.
          cat /tmp/pr-body.md
          cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"
          if ! gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-body.md; then
            echo "::error::gh pr comment was refused. Token scope or API. The assertion output printed above is the same text that would have been posted."
            exit 1
          fi

      - name: Upload stealth cursor-write report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-stealth-cursor-report
          path: playwright-report/
          retention-days: 14
