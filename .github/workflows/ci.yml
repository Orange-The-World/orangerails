name: CI
# noop: synchronize trigger (DL-0696)

on:
  pull_request:
  push:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project is managed with Bun (bun.lock, bunfig.toml).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # pinned: floating bun-version made CI non-reproducible (DL-0446).
          # Update deliberately when bumping Bun.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (advisory, not a gate)
        run: bun run lint
        # The linter currently reports errors (not warnings) -- run 29531126957
        # logged 8,873 prettier/prettier errors. continue-on-error: true means
        # this step cannot fail today and must not be read as a passing gate.
        # A ratchet to drive the error count to zero, lane by lane, is tracked
        # separately and will remove this flag when each lane is clean.
        continue-on-error: true

      - name: Public-auth declaration check
        # A real gate, deliberately WITHOUT continue-on-error, unlike the lint step above.
        # Asserts supabase/functions/public-auth.json and supabase/config.toml agree in both
        # directions: nothing is exposed without declaring its own auth, and nothing declares
        # itself public while the gateway check is still on. See the script header for why this
        # is a declaration rather than a code scan.
        run: node scripts/check-public-auth.mjs

      - name: Auth-marker check
        # A real gate, no continue-on-error. Closes the gap the check above does not cover:
        # that check proves the manifest and config.toml agree with EACH OTHER, this one proves
        # the mode a function DECLARES matches a marker call in the code it actually ships
        # (requireCallerAuth for a caller-auth mode, no such call for "none"). Pre-existing
        # non-conforming functions are carried as dated known exceptions inside the script,
        # tracked by OR-T1039 and OR-T1040, not exempted from this workflow. See the script
        # header for why this is a marker search and not an analysis of whether the auth is
        # correct.
        run: node scripts/check-auth-marker.mjs

      - name: Anon RPC grant self-test
        # The parser IS the control, so it is tested here rather than trusted. Runs before the
        # check itself so a broken parser fails as a broken parser, not as a silent pass over
        # every migration.
        run: node scripts/check-anon-rpc-grants.mjs --selftest

      - name: Anon RPC grant check
        # A real gate, no continue-on-error. Replays the migrations in order and fails if any
        # function in the public schema is left executable by anon without being declared in
        # supabase/anon-executable-rpcs.json with a reason. Source scan only: a grant typed
        # straight into a SQL console never reaches a migration and is not visible here. See
        # the script header for that boundary in full.
        run: node scripts/check-anon-rpc-grants.mjs

      - name: Anon ACL snapshot self-test
        # The other half of the same control, and the half that reads a real database rather
        # than our SQL. No credential lives in CI, so the check itself runs against a catalog
        # snapshot outside this workflow. What runs here is its parser test, because a parser
        # nobody exercises reports green whether it works or not. It pins the two cases a role
        # name match gets wrong: an empty grantee (=X/postgres), which is how Postgres writes
        # PUBLIC, and a NULL acl, which means the built in default stands and PUBLIC holds
        # EXECUTE. Needs nothing but node, so it is unconditional.
        run: node scripts/check-anon-acl-snapshot.mjs --selftest

      - name: Build
        run: bun run build

  deno-typecheck:
    name: Typecheck edge functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Why this job exists: until 2026-07-26 CI never looked at supabase/functions
    # at all. `bun run lint` carries continue-on-error (see the note on it above)
    # and `bun run build` only builds the Vite frontend, so every one of the 37
    # edge functions could stop compiling with CI still green. The open Strike
    # attribution pull request showed 9 of 9 checks green on a tree that
    # `deno check` rejected with 19 errors, one of them a real
    # Map<string, string> vs Map<string, {...}> mismatch on the Strike drain
    # path. (No PR number here on purpose: scripts/pre-publish-scan.sh flags
    # bare #NNNN references in shipping files as dead PR refs.)
    #
    # Gate design -- read this before changing it. This is a RATCHET, not a
    # wall: it fails only when the error count goes ABOVE the recorded
    # baseline. A plain `deno check` gate would go red on day one and block
    # every open PR in the repo; a `continue-on-error: true` advisory would
    # reproduce the exact blindness this job exists to end. The ratchet does
    # neither -- new type errors cannot land, the existing backlog is printed
    # in the job summary on every run, and the number only moves down.
    #
    # Making this check REQUIRED in the branch ruleset is a FOUNDER DECISION
    # and has deliberately NOT been done here. Nothing in this PR touches
    # branch protection.
    env:
      # Errors present on dev when this job was added, measured 2026-07-26 with
      # the pinned Deno below. Lower it in the same PR that fixes errors -- the
      # job prints the new value when the count drops. At 0, delete the ratchet
      # and let `deno check` fail on its own.
      DENO_CHECK_BASELINE: '14'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned, not `latest`. These functions run on Supabase's edge
          # runtime, which the Supabase CLI provisions as edge-runtime v1.74.2
          # == deno 2.1.4; typecheck with the tsc the runtime actually ships.
          # Floating on latest would also move the number for reasons unrelated
          # to our code: the orangerails tree reports 15 errors on 2.1.4 and 21
          # on 2.9.4, purely from the newer bundled tsc.
          deno-version: v2.1.4

      - name: Restore Deno module cache
        id: deno-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deno-dir
          key: deno-v2.1.4-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: deno-v2.1.4-

      - name: Populate Deno cache and write lock
        env:
          DENO_DIR: ${{ runner.temp }}/deno-dir
          NO_COLOR: '1'
        run: |
          mapfile -t FILES < <(find supabase/functions -name '*.ts' -type f | sort)
          deno cache --lock=deno.lock --node-modules-dir=auto "${FILES[@]}"

      - name: deno check supabase/functions
        shell: bash
        env:
          DENO_DIR: ${{ runner.temp }}/deno-dir
          # Deno colourises its diagnostics even when stdout+stderr are
          # redirected to a file on the runner. The first version of this step
          # counted "[ERROR]" fine but its per-class breakdown grepped for
          # 'TS1234 [ERROR]' and matched nothing, because the real bytes are
          # 'TS1234 <ESC>[0m[ERROR]'. Under `-e -o pipefail` that zero-match
          # grep killed the step, so the job went red while reporting exactly
          # the baseline count. NO_COLOR removes the escapes at the source; the
          # sed below strips them anyway, because a parser that only works when
          # the output happens to be plain is the same class of unreliable
          # control this job exists to replace.
          NO_COLOR: '1'
        run: |
          set -u

          # Scoped to the edge functions only. The rest of the repo is
          # Bun/Vite and is covered by the lint-and-build job.
          mapfile -t FILES < <(find supabase/functions -name '*.ts' -type f | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No .ts files found under supabase/functions -- this job is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi
          echo "Checking ${#FILES[@]} file(s) with $(deno --version | head -1)"

          # --node-modules-dir=auto: the repo has a root package.json, so Deno
          # otherwise refuses npm: specifiers with "run deno install first".
          RC=0
          deno check --lock=deno.lock --node-modules-dir=auto "${FILES[@]}" > "$RUNNER_TEMP/deno-check.raw" 2>&1 || RC=$?
          sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deno-check.raw" > "$RUNNER_TEMP/deno-check.log"
          cat "$RUNNER_TEMP/deno-check.log"

          # One "[ERROR]" marker per diagnostic (the last is additionally
          # prefixed "error: "). Counting markers is stable; Deno's
          # "Found N errors." line is not printed when N == 1.
          ERRORS=$(grep -c '\[ERROR\]' "$RUNNER_TEMP/deno-check.log" || true)

          # A non-zero exit with no diagnostics means the check itself broke
          # (network, unresolvable import, bad flag). That must never be scored
          # as "0 errors, under baseline, pass" -- a check that silently stops
          # checking is the precise failure this job exists to eliminate.
          if [ "$RC" -ne 0 ] && [ "$ERRORS" -eq 0 ]; then
            echo "::error::deno check exited $RC without reporting any type diagnostic. The check is broken, not passing."
            exit 1
          fi

          {
            echo "## Deno typecheck: supabase/functions"
            echo
            echo "**${ERRORS} error(s)** across ${#FILES[@]} file(s) (ratchet baseline: ${DENO_CHECK_BASELINE})"
            if [ "$ERRORS" -gt 0 ]; then
              echo
              echo "By error class:"
              echo '```'
              grep -oE 'TS[0-9]+ \[ERROR\]' "$RUNNER_TEMP/deno-check.log" | sort | uniq -c | sort -rn || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "deno check: ${ERRORS} error(s); ratchet baseline ${DENO_CHECK_BASELINE}"

          if [ "$ERRORS" -gt "$DENO_CHECK_BASELINE" ]; then
            echo "::error::Edge-function type errors went UP: ${ERRORS} > baseline ${DENO_CHECK_BASELINE}. Fix the new errors listed above. Do not raise the baseline."
            exit 1
          fi

          if [ "$ERRORS" -lt "$DENO_CHECK_BASELINE" ]; then
            echo "::notice::Error count dropped to ${ERRORS}. Lower DENO_CHECK_BASELINE to ${ERRORS} in .github/workflows/ci.yml in this PR so the ratchet holds the ground you just took."
          fi

      - name: Upload deno.lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deno-lock
          path: deno.lock
          retention-days: 7

  deno-test:
    name: Test edge functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Why this job exists: the repo has carried edge-function tests since long
    # before this job, and not one of them has ever run. `deno check` above
    # typechecks supabase/functions but never executes it, vitest's include is
    # scoped to `src/**/*.test.ts`, and no workflow invoked `deno test` at all.
    # Nine test files, zero enforcement.
    #
    # That is not a theoretical gap. When these were first executed, one had
    # rotted into asserting the opposite of the shipped behaviour: a Strike
    # test pinned "callers must uppercase currency before calling
    # resolveInvoiceWallet" after normalization had already been moved inside
    # computeWalletFingerprint. It was corrected in the same change that added
    # this job. A test nobody runs does not decay into useless, it decays into
    # wrong, and then it blocks whoever finally turns it on.
    #
    # --no-check is deliberate and matches the header of every test file here.
    # Typechecking is the ratchet job above, which tolerates a known baseline;
    # duplicating it here would make the test job fail for reasons that have
    # nothing to do with any assertion.
    #
    # As with the ratchet job: making this check REQUIRED in the branch ruleset
    # is a FOUNDER DECISION and has deliberately NOT been done here. Nothing in
    # this change touches branch protection.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Same pin and same reason as the typecheck job above: the Supabase
          # edge runtime is deno 2.1.4, so tests run on the runtime that ships.
          deno-version: v2.1.4

      - name: deno test supabase/functions
        shell: bash
        env:
          # The baseline is the number of test files actually present on the
          # branch this job is running against, and it is PER BRANCH because
          # the two branches genuinely differ.
          #
          # MEASURED 2026-08-03 with this job's own find pattern:
          #   dev  16 files
          #   prod  9 files
          #
          # The value shipped when this guard landed was 3, which was the count
          # of test-file DIRECTORIES someone eyeballed rather than the count of
          # files the pattern collects. A baseline of 3 against a real 15 means
          # twelve test files can disappear and this job still reports green,
          # which is the exact failure DL-0459 was opened to stop. The guard was
          # correct; only its number was wrong.
          #
          # Why this is an expression and not one number: prod's tree has 9,
          # so a single hardcoded 15 promoted from dev to prod turns this job
          # red on prod the moment it lands, on a count that is correct for
          # prod. Selecting on the branch lets the same file be true on both.
          #
          # When you add or remove a test file, change the number for that
          # branch in the same PR, and say why in the message if it goes down.
          # dev raised 17 -> 18 by DEV-0270, which adds
          # supabase/functions/_shared/error-redaction.test.ts.
          # dev raised 18 -> 19 by OR-T1203, which adds
          # supabase/functions/or-stealth-connection-create/envelope_replace.test.ts.
          DENO_TEST_FILE_BASELINE: ${{ (github.base_ref == 'prod' || github.ref_name == 'prod') && '9' || '19' }}
        run: |
          set -euo pipefail

          # Guard: find must not fail silently. A non-zero exit (missing dir,
          # permission error) must not collapse to count=0 and must not read
          # as OK. Exit 2 means "find failed", separate from exit 1 ("no files
          # found" or "count too low"). The || prevents set -e from aborting
          # before we can emit a useful error message.
          find_exit=0
          find_out=$(find supabase/functions \( -name '*_test.ts' -o -name '*.test.ts' \) | sort) || find_exit=$?
          if [ "$find_exit" -ne 0 ]; then
            echo "::error::find command failed (exit ${find_exit}) -- cannot enumerate test files. Check that supabase/functions exists and is readable."
            exit 2
          fi

          if [[ -n "$find_out" ]]; then
            mapfile -t TEST_FILES <<< "$find_out"
          else
            TEST_FILES=()
          fi
          FILE_COUNT="${#TEST_FILES[@]}"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No test files found -- deno test is checking nothing. Fix the path rather than let it report green."
            exit 1
          fi

          if [ "$FILE_COUNT" -lt "$DENO_TEST_FILE_BASELINE" ]; then
            echo "::error::Test file count dropped to ${FILE_COUNT} (baseline: ${DENO_TEST_FILE_BASELINE}). Restore missing files or lower the baseline with justification."
            printf '%s\n' "${TEST_FILES[@]}" | sed 's/^/  collected: /'
            exit 1
          fi

          # Print the collected list, not only the count. A count that matches
          # the baseline can still be the wrong fifteen files, and the list is
          # what makes that visible in the log without a rerun.
          printf '%s\n' "${TEST_FILES[@]}" | sed 's/^/  collected: /'
          echo "Found ${FILE_COUNT} test file(s) (baseline: ${DENO_TEST_FILE_BASELINE})"
          deno test --no-check --allow-all supabase/functions/

  vitest:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Why this job exists: src/**/*.test.ts carries discriminating tests for the
    # stealth/sync orchestrator: birthday height rejection and the stored-cursor
    # short-circuit requirement. Without this job those tests sit in the tree
    # and never gate a merge. Runner note: bun test cannot run this suite
    # because vitest uses vi.stubGlobal, which bun's runner does not implement.
    # It fails every case for a tooling reason unrelated to the code. npx vitest
    # run matches the test script in package.json and is the correct runner for
    # this repo. No PR number here on purpose: pre-publish-scan.sh flags bare
    # NNNN references in shipping files as dead PR refs.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # pinned: floating bun-version made CI non-reproducible (DL-0446).
          # Update deliberately when bumping Bun.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run vitest
        run: npx vitest run

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs against the already-deployed dev site. Two separate things deploy
    # that site, and neither of them is this workflow:
    #   frontend      -> Cloudflare Pages, from its own git integration, on
    #                    every push (branch dev is the production env of the
    #                    orangerails-dev project; feature branches get previews).
    #   edge functions -> supabase-deploy.yml, on every push to dev and prod.
    # Migrations are NOT deployed by either: they are applied by hand (the DBA
    # on dev, two party on prod) or by an explicit dispatch of supabase-deploy
    # with apply_migrations checked.
    #
    # A PR run therefore exercises the PR's tests against the currently-deployed
    # site; once the PR merges, the next run exercises the PR's own UI changes
    # after deploy.
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # pinned: floating bun-version made CI non-reproducible (DL-0446).
          # Update deliberately when bumping Bun.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Gate: all five secrets required by connector-identity.spec.ts must be
      # present before Playwright starts. If any are missing, the suite's
      # test.skip() guard would fire, all cases would skip, and the job would
      # exit 0 -- a green tick that proves nothing. Failing loudly here
      # instead, so a misconfigured CI is never mistaken for a passing suite.
      - name: Require connector-identity secrets
        env:
          OR_API_BASE_URL: ${{ secrets.OR_API_BASE_URL }}
          ACCOUNT_A: ${{ secrets.ACCOUNT_A }}
          ACCOUNT_B: ${{ secrets.ACCOUNT_B }}
          OR_TEST_PLATFORM_API_KEY: ${{ secrets.OR_TEST_PLATFORM_API_KEY }}
          OR_TEST_PLATFORM_SLUG: ${{ secrets.OR_TEST_PLATFORM_SLUG }}
        run: |
          missing=""
          [ -z "$OR_API_BASE_URL" ]          && missing="$missing OR_API_BASE_URL"
          [ -z "$ACCOUNT_A" ]                && missing="$missing ACCOUNT_A"
          [ -z "$ACCOUNT_B" ]                && missing="$missing ACCOUNT_B"
          [ -z "$OR_TEST_PLATFORM_API_KEY" ] && missing="$missing OR_TEST_PLATFORM_API_KEY"
          [ -z "$OR_TEST_PLATFORM_SLUG" ]    && missing="$missing OR_TEST_PLATFORM_SLUG"
          if [ -n "$missing" ]; then
            echo "ERROR: connector-identity suite cannot run: missing secrets$missing"
            echo "A skipped suite must not report pass. Fix the repo secrets and retry."
            exit 1
          fi

      - name: Resolve Playwright base URL
        # On pull_request: build the Cloudflare Pages branch-preview URL from
        # the head ref so Playwright tests against the actual branch build.
        # On push to dev/prod: keep the static deployment URL unchanged.
        # CF Pages branch-alias slug rules: lowercase, non-alphanumeric to
        # hyphen, collapse consecutive hyphens, strip trailing hyphens,
        # truncate at 28 chars.
        run: |
          # dev and prod branches have no Cloudflare branch preview; their
          # builds go to the static host. Only feature-branch PRs get
          # a per-branch preview URL.
          #
          # A release/* head belongs with dev and prod here, not with the feature
          # branches (OR-T0990). A promotion into prod is now opened from a
          # release branch cut at a sha that is already on dev, rather than from
          # dev itself, because a promotion whose head is dev loses its approval
          # every time anything merges into dev. Such a branch is a snapshot of
          # dev, so the surface to smoke it against is the deployed dev site,
          # exactly as it was when the head was dev. Sending it down the preview
          # path instead would aim these tests at a Pages build that may never
          # have been made, and turn the promotion red for a reason that has
          # nothing to do with the code.
          IS_FEATURE_BRANCH=1
          case "$GITHUB_HEAD_REF" in
            dev|prod|release/*) IS_FEATURE_BRANCH=0 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$IS_FEATURE_BRANCH" = "1" ]; then
            SLUG=$(echo "$GITHUB_HEAD_REF" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9]/-/g' \
              | sed 's/-\+/-/g' \
              | cut -c1-28 \
              | sed 's/-$//')
            echo "PLAYWRIGHT_BASE_URL=https://${SLUG}.orangerails-dev.pages.dev" >> "$GITHUB_ENV"
          else
            echo "PLAYWRIGHT_BASE_URL=https://dev.orangerails.com" >> "$GITHUB_ENV"
          fi

      - name: Run Playwright
        env:
          OR_API_BASE_URL: ${{ secrets.OR_API_BASE_URL }}
          ACCOUNT_A: ${{ secrets.ACCOUNT_A }}
          ACCOUNT_B: ${{ secrets.ACCOUNT_B }}
          OR_TEST_PLATFORM_API_KEY: ${{ secrets.OR_TEST_PLATFORM_API_KEY }}
          OR_TEST_PLATFORM_SLUG: ${{ secrets.OR_TEST_PLATFORM_SLUG }}
        # --forbid-only: fail if any test.only() was left in a committed spec.
        # Same failure shape as the skip problem: .only() causes all other
        # tests to skip and the job exits 0. --forbid-only makes that loud too.
        #
        # sparrow-host-routing.spec.ts targets live prod hosts. Exclude it
        # here so dev-PR runs do not fail; it runs in the playwright-prod-smoke
        # job. Its env-var guard is a beforeAll, so deselecting the suite skips
        # it cleanly. A module-level throw would instead crash THIS job at
        # collection, because Playwright imports every spec to enumerate tests.
        # 'Connect protocol compatibility' is excluded for the same reason as
        # the Sparrow suite: it targets a specific artifact, not this job's base
        # URL. It builds and serves its own bundle in the connect-protocol-compat
        # job below, and its beforeAll guard throws when CONNECT_COMPAT_BASE_URL
        # is unset, which is correct there and would be noise here.
        run: bunx playwright test --forbid-only --grep-invert 'Sparrow host-routing smoke|Connect protocol compatibility'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore

  playwright-prod-smoke:
    name: Playwright prod smoke -- Sparrow host routing (DL-0439)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-build
    # Only meaningful where the live hosts are the target. PR preview URLs are
    # not the production hosts, so this never runs on pull_request.
    #
    # workflow_dispatch is included so a change to the prod smoke can be PROVEN
    # before it merges. Without it this job is unrunnable on a branch, which
    # means a PR that edits this spec can only ever show it as skipped, and
    # "15 checks green" says nothing about the file the PR changed.
    #
    # The spec's beforeAll guard throws when the vars are unset, so a
    # misconfigured run here fails loudly rather than silently skipping.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # DL-0439: wait for the bundle this push produces before asserting on it.
      #
      # Measured on the 710 promotion (2026-08-18): this job's last assertion
      # logged 06:24:09.7Z and the Cloudflare deploy finished 06:24:34.7Z, so
      # the smoke tested the bundle the push was replacing and failed exactly
      # the tests an old bundle fails. A dispatch re-run on the identical
      # commit passed. Without this wait that race repeats on every promotion,
      # and a real regression is indistinguishable from the false one.
      #
      # Only on prod: a dev push deploys a different Pages project, and a
      # manual dispatch usually targets a commit that is already live.
      - name: Wait for the Cloudflare Pages deploy
        if: github.ref_name == 'prod'
        uses: ./.github/actions/wait-for-pages-deploy
        with:
          project: orangerails-prod
          commit_sha: ${{ github.sha }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run Sparrow host-routing smoke
        env:
          # Public production URLs -- not secrets, hardcoded intentionally.
          # The spec's beforeAll throws if either is empty, so a typo or an
          # accidental blank here fails the job rather than silently skipping.
          SMOKE_PROD_CONNECT_URL: https://connect.orangerails.com/sparrow
          SMOKE_PROD_MAIN_URL: https://orangerails.com/connect/sparrow
        run: bunx playwright test tests/e2e/sparrow-host-routing.spec.ts --forbid-only

      - name: Upload prod-smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-prod-smoke-report
          path: playwright-report/
          retention-days: 14

  playwright-stealth-cursor:
    name: Playwright stealth cursor-write proof (DL-0649)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-build
    # Explicit, because the reporting step below is the ONLY way the assertion
    # output leaves this runner. Without this block the job inherits the
    # repository default token scope, and if that default is read-only then
    # `gh pr comment` is refused and the failure text is trapped in the run log.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Start vite before either leg. playwright.config.ts has
      # reuseExistingServer: true, so both Leg 2 and Leg 1 reuse this process
      # rather than starting their own. A server Playwright did NOT start is
      # not killed when Playwright exits -- so the Leg 2 guard-throw exit
      # cannot kill the server that Leg 1 needs. Previous order (Leg 2 first)
      # let Playwright start and kill vite before this step could restart it,
      # causing a racy cold-restart that timed out on slow CI runners.
      # VITE_OR_STEALTH_ALLOWED_ORIGINS must match the parent-page origin
      # (http://localhost:8080) so the widget accepts the postMessage.
      - name: Start vite dev server
        env:
          VITE_SUPABASE_URL: https://fzwmnzmtqidumdqjdddz.supabase.co
          VITE_SUPABASE_PROJECT_ID: fzwmnzmtqidumdqjdddz
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_OR_STEALTH_ALLOWED_ORIGINS: http://localhost:8080
        run: |
          bun run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080 -o /dev/null && echo "Vite ready after ${i}s" && break
            sleep 1
          done
          curl -sf http://localhost:8080 -o /dev/null || {
            echo "::error::Vite dev server did not start within 60s"
            exit 1
          }

      # Leg 2: run with PLAYWRIGHT_WITH_VITE_DEV=1 but no credentials.
      # The module-level guard in stealth-cursor-write.spec.ts throws at
      # eval time, so Playwright exits non-zero immediately. With vite already
      # running above, reuseExistingServer: true means Playwright finds port
      # 5173 up and does not start a second server -- so the guard-throw exit
      # does not kill the server Leg 1 needs.
      # If it exits 0 the guard is broken and we fail loudly.
      - name: Guard proof (leg 2 -- guard throws without credentials)
        run: |
          if PLAYWRIGHT_WITH_VITE_DEV=1 bunx playwright test --grep 'stealth cursor write' 2>&1; then
            echo "::error::Guard did not throw -- test exited 0 without credentials. The module-level guard is broken."
            exit 1
          fi
          echo "Leg 2 PASS: guard threw as expected (non-zero exit confirmed)"

      # Leg 1: full test run with vite dev server and real credentials.
      # Route intercepts handle or-stealth-envelope-fetch (mock response);
      # or-stealth-envelope-update is proxied through Node.js with
      # OR_TEST_PLATFORM_API_KEY so the real DB row is written and verified.
      # Expected result: 1 passed, 0 skipped.
      - name: Stealth cursor-write proof (leg 1 -- 1 passed, 0 skipped)
        env:
          PLAYWRIGHT_WITH_VITE_DEV: '1'
          OR_API_BASE_URL: ${{ secrets.OR_API_BASE_URL }}
          OR_TEST_PLATFORM_API_KEY: ${{ secrets.OR_TEST_PLATFORM_API_KEY }}
        run: |
          bunx playwright test --grep 'stealth cursor write' 2>&1 | tee /tmp/pw-leg1.log
          exit ${PIPESTATUS[0]}

      - name: Report Leg 1 failure as PR comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ] || [ "$PR" = "0" ]; then
            echo "Not a PR run -- skipping comment"
            exit 0
          fi
          if [ -f /tmp/pw-leg1.log ]; then
            LINES=$(grep -E '(Error:|Expected|Received|AssertionError|FAILED)' \
              /tmp/pw-leg1.log | head -40 || true)
          else
            LINES="(leg 1 log not found -- see playwright-stealth-cursor-report artifact)"
          fi
          {
            echo "**CI: stealth cursor-write proof -- Leg 1 failure (run ${{ github.run_id }})**"
            echo ""
            echo "Assertion output (error lines only, no credentials):"
            printf '```\n'
            echo "${LINES}"
            printf '```\n'
            echo ""
            echo "Full report: playwright-stealth-cursor-report artifact on run ${{ github.run_id }}."
          } > /tmp/pr-body.md
          # Print it locally FIRST. A post that gets refused must not also lose
          # the evidence: stdout and the job summary are written before the
          # network call, so the text exists in three places or at worst two.
          cat /tmp/pr-body.md
          cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"
          if ! gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-body.md; then
            echo "::error::gh pr comment was refused. Token scope or API. The assertion output printed above is the same text that would have been posted."
            exit 1
          fi

      - name: Upload stealth cursor-write report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-stealth-cursor-report
          path: playwright-report/
          retention-days: 14

  connect-protocol-compat:
    name: Connect previous-version handshake gate (DL-1809)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Why this job exists: connect.orangerails.com is a hosted surface with no
    # version pin. On 2026-06-19 an integrator's connect flow hung on the
    # Stealth Sync screen because the widget had shipped a new handshake and
    # the integrator was still on the old one. The ruling that followed is that
    # the deployed widget speaks a SET of versions, current N and previous N-1,
    # with a 90 day window before N-1 is removed.
    #
    # A supported set is a promise. This job is what makes it true of the
    # artifact rather than true of a document.
    #
    # NOT REQUIRED BY THIS CHANGE. Adding this check to the branch ruleset is a
    # separate, deliberate act, and nothing here touches branch protection.
    # Until that is done this job reports and does not block, and it must not be
    # described as enforcing anything. That sentence is here so nobody reads the
    # job name and assumes the gate is armed.
    #
    # Deliberately NOT `needs: lint-and-build`. It builds its own artifact, and
    # keeping it independent means its answer arrives even when an unrelated
    # part of the pipeline is red.
    env:
      CONNECT_COMPAT_PORT: '4178'
      CONNECT_COMPAT_VERDICT_PATH: connect-compat-verdict.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # pinned: floating bun-version made CI non-reproducible (DL-0446).
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # THE BUILT ARTIFACT, not the dev server. The gate has to measure what we
      # would ship: a production build is tree-shaken and minified, and a dev
      # server can behave differently from it in exactly the places that matter.
      - name: Build the artifact
        run: bun run build

      - name: Serve the built artifact
        run: |
          set -uo pipefail
          bun run preview -- --port "$CONNECT_COMPAT_PORT" --strictPort &
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${CONNECT_COMPAT_PORT}/" -o /dev/null; then
              echo "preview server up after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf "http://localhost:${CONNECT_COMPAT_PORT}/" -o /dev/null; then
            echo "::error::The preview server did not start within 60s, so the gate has"
            echo "::error::nothing to measure. This is an UNKNOWN, not a passing protocol check."
            exit 1
          fi

      # THE NEGATIVE CONTROL, AND IT RUNS EVERY TIME.
      #
      # A check nobody has watched go red is untested, and a one-off
      # demonstration recorded in a ticket decays the moment somebody edits the
      # harness. So the gate is run with its assertion set to a code the widget
      # can never send. The whole machinery runs for real, against the real
      # artifact, with a real handshake behind it, and the assertion is false.
      # If that exits ZERO the harness is asserting nothing and every green run
      # after it would be worthless, so the job fails here.
      - name: Negative control (the gate must be able to go red)
        env:
          CONNECT_COMPAT_BASE_URL: http://localhost:4178
          CONNECT_COMPAT_NEGATIVE_CONTROL: '1'
        run: |
          set -uo pipefail
          if bunx playwright test tests/e2e/connect-protocol-compat.spec.ts \
               --forbid-only --retries=0 --reporter=list; then
            echo "::error::NEGATIVE CONTROL FAILED: the gate exited 0 while asserting something"
            echo "::error::that cannot be true. It is not measuring the handshake. Every green"
            echo "::error::run of this job is worthless until this is fixed."
            exit 1
          fi
          echo "Negative control PASS: the gate exited non-zero on a false assertion."

      # The negative control wrote its own verdict file. Remove it so the real
      # run below cannot inherit a stale verdict if it dies before writing one.
      # Without this, a crashed real run would be scored on the control's file.
      - name: Clear the negative control's verdict
        run: rm -f "$CONNECT_COMPAT_VERDICT_PATH"

      - name: Previous-version handshake gate
        env:
          CONNECT_COMPAT_BASE_URL: http://localhost:4178
        run: |
          bunx playwright test tests/e2e/connect-protocol-compat.spec.ts \
            --forbid-only --retries=1 --reporter=list

      # THE VERDICT IS READ FROM A FILE, NOT INFERRED FROM AN EXIT CODE.
      #
      # Today exactly one protocol version is live, so the previous-version
      # comparison has nothing to drive. A Playwright test.skip() there would
      # render green and keep rendering green for as long as that stays true,
      # which is the precise failure this gate exists to end. The suite instead
      # writes what it actually concluded, and this step reports it.
      #
      # A MISSING verdict file is a FAILURE. A check that did not report is not
      # a check that passed.
      - name: Report the verdict
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f "$CONNECT_COMPAT_VERDICT_PATH" ]; then
            echo "::error::The gate wrote no verdict. It did not reach a conclusion, so this is"
            echo "::error::an UNKNOWN and not a pass. Read the Playwright output above."
            {
              echo "## :grey_question: Connect previous-version gate: NO VERDICT"
              echo
              echo "The suite wrote no verdict file, so it did not reach a conclusion."
              echo "This is **not** a report that the previous version is fine."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          cat "$CONNECT_COMPAT_VERDICT_PATH"
          STATUS=$(jq -r '.status' "$CONNECT_COMPAT_VERDICT_PATH")
          DETAIL=$(jq -r '.detail' "$CONNECT_COMPAT_VERDICT_PATH")
          SUPPORTED=$(jq -r '(.supported // []) | join(", ")' "$CONNECT_COMPAT_VERDICT_PATH")

          case "$STATUS" in
            RAN_PASS)
              {
                echo "## :check: Connect previous-version gate: PASS"
                echo
                echo "Supported versions advertised by the built artifact: \`${SUPPORTED}\`"
                echo
                echo "${DETAIL}"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "PASS: ${DETAIL}"
              ;;
            SKIPPED)
              # Loud on purpose. This is the state we are in today and it must
              # never be mistaken for a pass by anyone reading a green tick.
              echo "::warning::CONNECT PREVIOUS-VERSION GATE SKIPPED. ${DETAIL} This is NOT a pass: the previous-version handshake was not exercised because there is no previous version yet."
              {
                echo "## :warning: Connect previous-version gate: SKIPPED, not passed"
                echo
                echo "Supported versions advertised by the built artifact: \`${SUPPORTED}\`"
                echo
                echo "${DETAIL}"
                echo
                echo "**Nothing about previous-version compatibility was proven by this run.**"
                echo "The liveness half of the gate DID run: an unsupported version was refused"
                echo "with a typed terminal error, and the negative control confirmed the gate"
                echo "can go red. What did not run is the comparison, because there is only one"
                echo "live version to compare."
                echo
                echo "This skip stops being legal the moment the supported set grows. The suite"
                echo "asserts that, so it will turn red on its own rather than waiting to be"
                echo "noticed."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Connect previous-version gate: ${STATUS}. ${DETAIL}"
              {
                echo "## :x: Connect previous-version gate: ${STATUS}"
                echo
                echo "${DETAIL}"
                echo
                jq -r '(.divergences // []) | .[] | "- " + .' "$CONNECT_COMPAT_VERDICT_PATH"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      - name: Upload gate report and verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connect-protocol-compat-report
          path: |
            playwright-report/
            connect-compat-verdict.json
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # OR-T1518. The prod migration apply now classifies what it is about to run and
  # hard stops on the irreversible class. This job is the proof that the
  # classifier CAN refuse.
  #
  # It is not a formality. A check that has only ever been seen going green is
  # indistinguishable from a check that cannot go red, and that is the shape of
  # nearly every silent success defect found in this estate: a filter that
  # dropped its input, a probe that could not run, a loop over an empty list
  # exiting 0. So this job runs the real CLI over fixtures on disk and asserts
  # BOTH directions, because a classifier that refuses everything is just as
  # useless as one that refuses nothing.
  #
  # No Bun, no secrets, no database, no network. A checkout and the Node already
  # on the runner.
  # ---------------------------------------------------------------------------
  migration-reversibility-classifier:
    name: Migration classifier (proven able to refuse)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Needed to work out whether this pull request touches the classifier,
          # which decides whether the demonstration is worth commenting.
          fetch-depth: 0

      - name: Self test, both directions
        # Asserts every fixture against its expected verdict AND its expected
        # rule, so a rule that fires for the wrong reason is caught too. Also
        # asserts that an empty input list is refused rather than read as clean.
        run: |
          set -uo pipefail
          DEMO="${RUNNER_TEMP}/or-t1518-demo.md"
          {
            echo "## Migration classifier (OR-T1518)"
            echo ""
            echo "### Self test: does the classifier agree with every fixture, both ways"
            echo ""
            echo '```'
          } > "$DEMO"
          node scripts/classify-migrations.mjs --selftest 2>&1 | tee -a "$DEMO"
          RC=${PIPESTATUS[0]}
          {
            echo '```'
            echo ""
            echo "exit code: \`${RC}\` (want 0)"
          } >> "$DEMO"
          exit "$RC"

      - name: Refuse a deliberately irreversible fixture, and show the red
        run: |
          # `set +e` FIRST, and it is load bearing. A run step's default shell
          # here is `bash -e`, and `set -uo pipefail` does not clear e. This
          # step's entire purpose is to run a command that exits non-zero and
          # then look at the code, so with errexit on it died at the first
          # capture and reported a red with no reason attached (observed on run
          # 33637547005). It still fails on purpose, at the end, via FAIL.
          set +e
          set -uo pipefail
          FIX=scripts/fixtures/migration-classifier

          echo "=== running the real classifier over the irreversible and unparseable fixtures ==="
          OUT=$(node "scripts/classify-migrations.mjs" "$FIX"/*irreversible*.sql "$FIX"/*unparseable*.sql 2>&1); RC=$?
          echo "$OUT"
          echo "exit code: $RC"

          FAIL=0
          if [ "$RC" -ne 2 ]; then
            echo "::error::the classifier exited $RC over fixtures that are all irreversible or unparseable. It must exit 2. A classifier that cannot refuse is not a gate."
            FAIL=1
          fi
          for NEEDLE in "IRREVERSIBLE" "UNPARSEABLE" "DROP TABLE" "DELETE WITHOUT WHERE" "ALTER TABLE DROP" "line "; do
            if ! echo "$OUT" | grep -qF "$NEEDLE"; then
              echo "::error::the refusal did not mention '$NEEDLE'. The job log has to name the file, the line and the statement class, or nobody can act on it."
              FAIL=1
            fi
          done

          echo
          echo "=== the reversible fixture must still pass, with no friction ==="
          OK_OUT=$(node "scripts/classify-migrations.mjs" "$FIX"/*reversible_everything_allowed.sql 2>&1); OK_RC=$?
          echo "$OK_OUT"
          echo "exit code: $OK_RC"
          if [ "$OK_RC" -ne 0 ]; then
            echo "::error::the classifier refused the reversible fixture. Every statement in it has a restore path. A gate that refuses ordinary work gets routed around, so this is a defect in the classifier, not in the fixture."
            FAIL=1
          fi
          if ! echo "$OK_OUT" | grep -qF "1 REVERSIBLE, 0 IRREVERSIBLE, 0 UNPARSEABLE"; then
            echo "::error::the reversible fixture did not report a clean count line."
            FAIL=1
          fi

          echo
          echo "=== an empty file list must be refused, never read as clean ==="
          EMPTY_OUT=$(node "scripts/classify-migrations.mjs" 2>&1); EMPTY_RC=$?
          echo "$EMPTY_OUT"
          echo "exit code: $EMPTY_RC"
          if [ "$EMPTY_RC" -eq 0 ]; then
            echo "::error::the classifier exited 0 when handed no files. Concluding REVERSIBLE from an absence is the exact failure this gate exists to prevent."
            FAIL=1
          fi

          DEMO="${RUNNER_TEMP}/or-t1518-demo.md"
          {
            echo ""
            echo "### Proven able to refuse"
            echo ""
            echo "Exit codes observed: irreversible fixtures \`$RC\` (want 2), reversible fixture \`$OK_RC\` (want 0), empty file list \`$EMPTY_RC\` (want non-zero)."
            echo ""
            echo "The refusal, verbatim:"
            echo ""
            echo '```'
            echo "$OUT"
            echo '```'
            echo ""
            echo "The reversible fixture, verbatim:"
            echo ""
            echo '```'
            echo "$OK_OUT"
            echo '```'
            echo ""
            echo "An empty file list, verbatim:"
            echo ""
            echo '```'
            echo "$EMPTY_OUT"
            echo '```'
          } >> "$DEMO"
          cat "$DEMO" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "classifier refuses the irreversible class, passes the reversible one, and refuses an empty list."

      # -----------------------------------------------------------------------
      # OR-T1696. Proving the classifier CAN refuse (the step above) is not the
      # same fact as knowing WHAT it refuses in this repository today. Those are
      # different questions and only the second one tells us whether turning the
      # gate on changes anybody's day.
      #
      # REPORT, NOT A GATE, and the distinction is load bearing. The migration
      # tree already contains applied changes that drop tables and columns, so
      # this sweep is EXPECTED to exit 2. Failing the job on that would turn
      # every pull request red over history nobody can change, and a check that
      # is red for everyone is a check that gets ignored.
      #
      # What DOES fail here: the classifier not running at all, and the sweep
      # finding no files. A sweep that examined nothing is not a clean sweep,
      # and the whole point of this classifier is that it never concludes
      # REVERSIBLE from an absence.
      # -----------------------------------------------------------------------
      - name: Sweep every migration in the tree (report, not a gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # set +e first, same reason as the step above: this step reads exit
          # codes deliberately and exit 2 here is the expected answer.
          set +e
          set -uo pipefail
          DEMO="${RUNNER_TEMP}/or-t1518-demo.md"

          mapfile -t MIGS < <(find supabase/migrations -name '*.sql' -type f | sort)
          if [ "${#MIGS[@]}" -eq 0 ]; then
            echo "::error::no .sql files found under supabase/migrations. The sweep examined nothing, which is not the same fact as a tree with nothing to refuse. Fix the path rather than let this report green."
            exit 1
          fi
          echo "=== classifying every migration in the tree (${#MIGS[@]} file(s)) ==="

          JSON="${RUNNER_TEMP}/or-t1696-classify.json"
          OUT=$(node scripts/classify-migrations.mjs "${MIGS[@]}" --json "$JSON" 2>&1); RC=$?
          echo "$OUT"
          echo "exit code: $RC (2 is expected here: the tree holds applied drops)"

          if [ "$RC" -eq 1 ]; then
            echo "::error::the classifier could not run over the tree (exit 1). That is an UNKNOWN, not a clean sweep."
            exit 1
          fi

          EXAMINED=$(echo "$OUT" | grep '^EXAMINED' || true)
          if [ -z "$EXAMINED" ]; then
            echo "::error::the sweep printed no EXAMINED line, so it reached no conclusion about the tree."
            exit 1
          fi

          if [ ! -s "$JSON" ]; then
            echo "::error::the sweep wrote no JSON, so there is nothing to report from. Not a clean sweep."
            exit 1
          fi

          # Every file that is NOT REVERSIBLE, in the classifier's own prose
          # form. IRREVERSIBLE does not match ": REVERSIBLE" because of the
          # space, so this keeps both refused classes and drops the clean ones.
          NOT_CLEAN=$(echo "$OUT" | awk '/^== /{keep = ($0 !~ /: REVERSIBLE$/)} keep')

          # One row per finding, from the classifier's own JSON rather than its
          # prose, because a reviewer needs the file, the class and the line and
          # should not have to read a wall of snippets to collect them.
          TABLE=$(jq -r '
            .files[]
            | select(.verdict != "REVERSIBLE")
            | . as $f
            | if ((($f.findings) // []) | length) == 0
              then "\($f.file) | \($f.verdict) | (no finding reported)"
              else ($f.findings[] | "\($f.file) | \($f.verdict) | \(.id) | line \(.line)")
              end' "$JSON")

          # UNPARSEABLE is called out separately and FIRST. It is the rarest
          # class and the most consequential one, because this gate treats it as
          # irreversible: a file nobody can parse is a file nobody can promise a
          # restore path for. Sorted last in the table, it was the part that got
          # cut off, which is the worst possible thing to lose.
          UNPARSEABLE_ROWS=$(jq -r '
            .files[]
            | select(.verdict == "UNPARSEABLE")
            | . as $f
            | ((($f.findings) // [])[] | "\($f.file) | \(.id) | line \(.line) | \(.why)")' "$JSON")

          SWEEP="${RUNNER_TEMP}/or-t1696-sweep.md"
          {
            echo "## What the migration classifier says about this tree (OR-T1696)"
            echo ""
            echo "A REPORT, not a gate. Nothing here blocks this pull request. The exit code is the expected one: the tree holds applied migrations that drop tables and columns, so a classifier that refuses that class exits 2 over the whole tree."
            echo ""
            echo '```'
            echo "node scripts/classify-migrations.mjs \$(find supabase/migrations -name '*.sql' -type f | sort)"
            echo "$EXAMINED"
            echo "exit code: ${RC}"
            echo '```'
            echo ""
            echo "UNPARSEABLE, which this gate treats as irreversible:"
            echo ""
            echo '```'
            if [ -n "$UNPARSEABLE_ROWS" ]; then
              echo "$UNPARSEABLE_ROWS"
            else
              echo "(none)"
            fi
            echo '```'
            echo ""
            echo "The IRREVERSIBLE list follows in numbered comments, split so no row is cut."
          } > "$SWEEP"

          cat "$SWEEP" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "<details><summary>Full classifier output for every file that is not REVERSIBLE</summary>"
            echo ""
            echo '```'
            if [ -n "$NOT_CLEAN" ]; then echo "$NOT_CLEAN"; else echo "(none)"; fi
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # A headline on the demonstration comment too, so a reader who sees
          # only that one is not left thinking the sweep never ran.
          {
            echo ""
            echo "### Tree sweep (OR-T1696): \`${EXAMINED}\`, exit \`${RC}\`."
          } >> "$DEMO"

          # Same quiet rule as the publish step below, and for the same reason:
          # a check that comments on every pull request gets muted, and a muted
          # check is not a check. The job summary carries the numbers either way.
          TOUCHED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- \
            scripts/classify-migrations.mjs \
            scripts/fixtures/migration-classifier \
            .github/workflows/supabase-deploy.yml \
            .github/workflows/ci.yml 2>/dev/null || true)

          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ -z "$PR_NUMBER" ] || [ -z "$TOUCHED" ]; then
            echo "not commenting: either this is not a pull request, or it does not touch the classifier. The numbers are in the job summary."
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --body-file "$SWEEP" \
            || echo "::warning::the sweep comment was refused. The identical text is in this run's job summary and in the log above, so the evidence is not lost."

          # The IRREVERSIBLE list is long and a comment body has a size beyond
          # which readers here get a truncated copy with no marker saying so.
          # Split on line boundaries so every row lands in some comment.
          if [ -z "$TABLE" ]; then
            exit 0
          fi
          IRR=$(echo "$TABLE" | grep -v ' | UNPARSEABLE | ' || true)
          if [ -z "$IRR" ]; then
            exit 0
          fi
          printf '%s\n' "$IRR" > "${RUNNER_TEMP}/or-t1696-irr.txt"
          split -C 1000 -d -a 2 "${RUNNER_TEMP}/or-t1696-irr.txt" "${RUNNER_TEMP}/or-t1696-part-"
          PART=0
          for P in "${RUNNER_TEMP}"/or-t1696-part-*; do
            PART=$((PART + 1))
            {
              echo "### IRREVERSIBLE in this tree, part ${PART} (OR-T1696)"
              echo ""
              echo "One row per finding: file, rule id, reported line."
              echo ""
              echo '```'
              cat "$P"
              echo '```'
            } > "${P}.md"
            gh pr comment "$PR_NUMBER" --body-file "${P}.md" \
              || echo "::warning::part ${PART} of the list was refused. It is in the job summary."
          done

      - name: Publish the demonstration to the pull request
        # The seats that review changes in this repo hold GitHub read tools and
        # no shell. An Actions log is not reachable from a review seat and the
        # API refuses it without a token, so a refusal that exists only in a log
        # is a refusal nobody reviewing this change can read. This puts the
        # verbatim output where every reviewer already is.
        #
        # Deliberately quiet on ordinary pull requests: it comments only when
        # the job failed, or when this pull request actually touches the
        # classifier, its fixtures, or the two workflows. A check that comments
        # on every PR gets muted, and a muted check is not a check.
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # See the note on errexit in the step above: the default shell is
          # `bash -e` and this step reads exit codes deliberately.
          set +e
          set -uo pipefail
          DEMO="${RUNNER_TEMP}/or-t1518-demo.md"
          if [ ! -f "$DEMO" ]; then
            echo "no demonstration file was written, so there is nothing to publish. This is not a pass."
            exit 0
          fi

          TOUCHED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- \
            scripts/classify-migrations.mjs \
            scripts/fixtures/migration-classifier \
            .github/workflows/supabase-deploy.yml \
            .github/workflows/ci.yml 2>/dev/null || true)

          if [ "$JOB_STATUS" = "success" ] && [ -z "$TOUCHED" ]; then
            echo "this pull request does not touch the classifier and the demonstration passed; not commenting."
            exit 0
          fi

          {
            echo ""
            echo "---"
            echo "Job status: \`${JOB_STATUS}\`. Posted by the migration classifier job because this pull request touches it, or because it failed."
          } >> "$DEMO"

          gh pr comment "$PR_NUMBER" --body-file "$DEMO"
