name: CI

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The project is managed with Bun (bun.lock, bunfig.toml).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        # Don't fail the whole CI on lint warnings yet: the codebase
        # is young, warnings are noise, and a false-red CI trains
        # everyone to ignore the signal.
        continue-on-error: true

      - name: Build
        run: bun run build

  test:
    name: Test + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This is a real gate. No continue-on-error. A broken unit suite
      # turns the PR red, which is the whole reason the job exists.
      - name: Test
        run: bun run test

      # Advisory on purpose, for now. tsc has a standing error backlog and
      # flipping this to blocking in the same change would leave dev red for
      # everyone. Printing the count on every run is what lets us burn it
      # down and then remove this flag in a follow-up.
      - name: Typecheck (advisory, ratchet target)
        run: bunx tsc --noEmit
        continue-on-error: true

  playwright:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Runs against the already-deployed dev site. Two separate things deploy
    # that site, and neither of them is this workflow:
    #   frontend      -> Cloudflare Pages, from its own git integration, on
    #                    every push (branch dev is the production env of the
    #                    orangerails-dev project; feature branches get previews).
    #   edge functions -> supabase-deploy.yml, on every push to dev and prod.
    # Migrations are NOT deployed by either: they are applied by hand (the DBA
    # on dev, two party on prod) or by an explicit dispatch of supabase-deploy
    # with apply_migrations checked.
    #
    # A PR run therefore exercises the PR's tests against the currently-deployed
    # site; once the PR merges, the next run exercises the PR's own UI changes
    # after deploy.
    needs: lint-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://orangerails.dev' }}
        run: bunx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore
