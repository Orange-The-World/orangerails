name: Test ledger freshness classifier

on:
  pull_request:
    paths:
      - 'scripts/ledger-freshness.sh'
      - '.github/workflows/test-ledger-freshness.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/ledger-freshness.sh'
      - '.github/workflows/test-ledger-freshness.yml'

jobs:
  self-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prove the classifier is right on all four branches
        run: |
          set -uo pipefail
          # shellcheck source=scripts/ledger-freshness.sh
          source scripts/ledger-freshness.sh

          FAIL=0

          check() {
            local desc="$1" applied_rows="$2" probe_ok="$3" object_count="$4" want_verdict="$5" want_rc="$6"
            local got_verdict got_rc
            # set +e / set -e around the call, not an if: GitHub Actions runs
            # this whole block under bash -e regardless of the `set -uo
            # pipefail` above (it adds -u and pipefail, it does not clear -e).
            # A bare `got_verdict=$(...)` assignment is not an `if`, a `while`
            # or an `&&` chain, so without this bracket a test case expecting
            # exit 1 (POPULATED, UNKNOWN) kills the whole script right here,
            # before FAIL is ever set and before any ::error:: is printed.
            set +e
            got_verdict=$(classify_ledger_freshness "$applied_rows" "$probe_ok" "$object_count")
            got_rc=$?
            set -e
            if [ "$got_verdict" != "$want_verdict" ] || [ "$got_rc" -ne "$want_rc" ]; then
              echo "::error::self-test FAILED: ${desc} -- wanted verdict '${want_verdict}' exit ${want_rc}, got verdict '${got_verdict}' exit ${got_rc}"
              FAIL=1
            else
              echo "ok: ${desc} -> ${got_verdict} (exit ${got_rc})"
            fi
          }

          check "ledger already has rows: nothing to disambiguate"                            5 1 0  SKIP      0
          check "empty ledger, probe ok, zero objects: genuinely fresh"                       0 1 0  FRESH     0
          check "empty ledger, probe ok, objects present: emptied ledger on a live database"  0 1 53 POPULATED 1
          check "empty ledger, probe unreadable: inconclusive must abort, never default to fresh" 0 0 0 UNKNOWN 1

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::one or more branches of classify_ledger_freshness are wrong. Nothing in apply-migrations should trust this function until every line above says ok."
            exit 1
          fi
          echo "ledger-freshness self-test ok: SKIP when the ledger has rows, FRESH only on a genuinely empty database, POPULATED on an emptied ledger, UNKNOWN (never FRESH) when the probe cannot be read."
