name: Workflow YAML lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  parse-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Parse every workflow file
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import yaml

          failures = []
          files = sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml'))
          for path in files:
              with open(path, 'r') as f:
                  text = f.read()
              try:
                  yaml.safe_load(text)
              except yaml.YAMLError as exc:
                  failures.append((path, exc))

          if failures:
              print(f'{len(failures)} of {len(files)} workflow file(s) failed to parse:')
              for path, exc in failures:
                  print(f'--- {path} ---')
                  print(exc)
              sys.exit(1)

          print(f'All {len(files)} workflow file(s) parsed cleanly.')
          PY
