name: Comment findings-boundary scan

# Detects internal-infrastructure references in PR/issue comment bodies, PR
# review comments, and PR review summaries on this public repo, so a maintainer
# can remove them. scripts/pre-publish-scan.sh already keeps these out of
# shipping FILES; this covers the comment surface, which nothing scanned before.
#
# It DETECTS ONLY. It never edits or deletes a comment: removing already
# published content is a maintainer decision, not an automated one. It never
# echoes the matched text, because printing the match into the public run log
# would republish the reference it is flagging. A failed run here is the signal.
#
# One job, not two (DEV-0108, 2026-08-27). This used to be a `scan` job plus
# a separate `notify-on-failure` job that only ran `if: failure()`. A
# job-level `if:` does not stop GitHub creating a check-run for that job --
# it just marks it skipped -- so on a comment-heavy PR the failure-notify job
# added a second "skipped" check-run entry for every single comment, on top
# of the scan itself, with no coverage lost by removing it. It is now a step
# inside the one job, gated the same way (`if: failure()`), so a comment
# event costs one check-run instead of two. This does not reduce SCAN
# coverage: the same two steps run on the same events with the same logic,
# only the job boundary moved.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

# Minimum privilege required across all jobs. The scan job further restricts
# itself to permissions: {} (no scope at all). Only the notify-on-failure job
# needs issues: write, and only when the scan job fails.
permissions:
  contents: read
  issues: write

concurrency:
  group: comment-scan-${{ github.event.comment.id || github.event.review.id }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan comment body
    runs-on: ubuntu-latest
    # issues: write is only used by the failure-notify step below, and only
    # when the scan step above it fails. The scan step itself still reads
    # only the event payload passed through env -- it needs no repo contents
    # and no write scope of its own.
    permissions:
      issues: write
    steps:
      - name: Canary self-test (prove patterns match before trusting results)
        # Routes known-matching and known-safe literals through the exact grep
        # calls used in the scan step below. If either pattern fails to match
        # its canary, or matches a safe string it should not, the mechanism is
        # broken and a green scan would be a false negative -- hard-fail (exit 2)
        # before scanning anything. Mirrors self_test() in pre-publish-scan.sh
        # (lines 258-278), which exists because a silent no-op here already
        # happened once and the canary was what would have caught it.
        run: |
          set -euo pipefail
          TAILNET='\btail[a-z0-9]+\.ts\.net\b'
          CGNAT='\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+\b'

          # Known-matching canary strings: structurally valid, not real hosts.
          CANARY_TAILNET='tail1a2b3c4d.ts.net'
          CANARY_CGNAT='100.100.100.100'

          # Known-safe strings: must NOT match (false-positive guard).
          SAFE_TAILNET='example.com'
          SAFE_CGNAT='10.0.0.1'

          ok=1
          if ! printf '%s' "$CANARY_TAILNET" | grep -Eq "$TAILNET"; then
            echo "::error::Canary FAILED: TAILNET pattern does not match '$CANARY_TAILNET'. Scanner is broken."
            ok=0
          fi
          if ! printf '%s' "$CANARY_CGNAT" | grep -Eq "$CGNAT"; then
            echo "::error::Canary FAILED: CGNAT pattern does not match '$CANARY_CGNAT'. Scanner is broken."
            ok=0
          fi
          if printf '%s' "$SAFE_TAILNET" | grep -Eq "$TAILNET"; then
            echo "::error::Canary FAILED: TAILNET pattern incorrectly matched '$SAFE_TAILNET'. False positive."
            ok=0
          fi
          if printf '%s' "$SAFE_CGNAT" | grep -Eq "$CGNAT"; then
            echo "::error::Canary FAILED: CGNAT pattern incorrectly matched '$SAFE_CGNAT'. False positive."
            ok=0
          fi

          if [ "$ok" -eq 0 ]; then
            echo "::error::Scanner self-test failed. Results are not trustworthy; aborting scan."
            exit 2
          fi
          echo "Canary self-test passed: both patterns match their canary and do not false-positive on safe strings."

      - name: Scan for internal-infrastructure references
        # The comment/review body and its URL are passed through env, NEVER
        # interpolated into the run script. Inlining a user-controlled
        # ${{ github.event.*.body }} into a shell would let a crafted comment
        # inject commands; env keeps the body inert data.
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          COMMENT_URL: ${{ github.event.comment.html_url || github.event.review.html_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ -z "${BODY:-}" ]; then
            echo "No comment/review body on this event; nothing to scan."
            exit 0
          fi

          # Two generic STRUCTURAL patterns, identical to Category 3 of
          # scripts/pre-publish-scan.sh. Each names a CLASS of internal
          # reference (any Tailscale tail-net hostname, any address in the CGNAT
          # /10), never a specific host, so this file publishes no value.
          TAILNET='\btail[a-z0-9]+\.ts\.net\b'
          CGNAT='\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+\b'

          hit=0
          if printf '%s' "$BODY" | grep -Eq "$TAILNET"; then
            echo "::error::Comment matches a Tailscale tail-net hostname pattern (internal-infrastructure reference)."
            hit=1
          fi
          if printf '%s' "$BODY" | grep -Eq "$CGNAT"; then
            echo "::error::Comment matches a CGNAT-range address pattern (internal-infrastructure reference)."
            hit=1
          fi

          # The matched text is deliberately NOT printed: echoing it would
          # republish the reference in this public run log. The pattern class and
          # the comment URL are enough for a maintainer to find and remove it.
          {
            echo "## Comment findings-boundary scan"
            echo
            if [ "$hit" -eq 1 ]; then
              echo "A comment matched an internal-infrastructure reference class."
              echo
              echo "- Event: ${EVENT_NAME}"
              echo "- Comment: ${COMMENT_URL}"
              echo
              echo "The matched text is intentionally not shown here. A maintainer should open the linked comment and remove the reference if confirmed."
            else
              echo "No internal-infrastructure reference found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$hit" -eq 1 ]; then
            exit 1
          fi

      # issue_comment-triggered runs do NOT appear in a PR's check list. A
      # failure is therefore invisible to reviewers unless actively watched
      # in the Actions tab. This step opens a GitHub issue on failure so
      # maintainers are notified without requiring any external secret --
      # only GITHUB_TOKEN (issues: write). Was a separate `notify-on-failure`
      # job; folded into this one so a comment event costs one check-run
      # instead of two (see the header note).
      #
      # Note: the scheduled-workflow-failure monitor (PR #660) covers scheduled
      # and dispatched workflows via workflow_run. It does NOT cover
      # event-triggered runs like this one, so this step is the alarm path
      # for this workflow specifically.
      - name: Open issue on scan failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_URL: ${{ github.event.comment.html_url || github.event.review.html_url }}
        run: |
          set -euo pipefail
          BODY="The comment findings-boundary scan failed.

          - **Run:** ${RUN_URL}
          - **Event:** ${EVENT_NAME}
          - **Comment/review:** ${COMMENT_URL}

          Either a comment matched an internal-infrastructure reference class, or the scanner self-test failed (pattern broken). A maintainer should open the linked comment, verify, and remove any reference found. Close this issue once resolved."

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[findings-scan] Comment scan failure: ${EVENT_NAME}" \
            --body "$BODY"
