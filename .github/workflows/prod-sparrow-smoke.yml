name: Prod Sparrow Smoke

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  sparrow-prod-smoke:
    name: Sparrow smoke (prod)
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://connect.orangerails.com
      OR_SUPABASE_URL: https://lcdicqalreskibdfxkzb.supabase.co
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Sparrow smoke
        run: bunx playwright test tests/e2e/sparrow.spec.ts --forbid-only

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore
