name: Prod Sparrow Smoke

on:
  push:
    branches: [prod]
  workflow_dispatch:

jobs:
  sparrow-prod-smoke:
    name: Sparrow smoke (prod)
    runs-on: ubuntu-latest
    # 20 minutes, matching every other Playwright job in ci.yml. Without this the
    # job inherits GitHub's 360-minute default, and a step that wedges rather than
    # fails holds its check open for six hours while every sibling reports green.
    # That is not hypothetical here: it is what run 32096123689 did on #710, and
    # #763 fixed it everywhere except this file, which did not exist in that diff.
    # The budget is not tight: the Pages wait below is capped at 420s internally,
    # install is ~3 min and the smoke itself has never exceeded 2 min.
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: https://connect.orangerails.com
      OR_SUPABASE_URL: https://lcdicqalreskibdfxkzb.supabase.co
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # DL-0439: wait for the bundle this push produces before asserting on it.
      #
      # Measured on the 710 promotion (2026-08-18): this job's last assertion
      # logged 06:24:09.7Z and the Cloudflare deploy finished 06:24:34.7Z, so
      # the smoke tested the bundle the push was replacing and failed exactly
      # the tests an old bundle fails. A dispatch re-run on the identical
      # commit passed. Without this wait that race repeats on every promotion,
      # and a real regression is indistinguishable from the false one.
      #
      # Only on prod: a dev push deploys a different Pages project, and a
      # manual dispatch usually targets a commit that is already live.
      - name: Wait for the Cloudflare Pages deploy
        if: github.ref_name == 'prod'
        uses: ./.github/actions/wait-for-pages-deploy
        with:
          project: orangerails-prod
          commit_sha: ${{ github.sha }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run Sparrow smoke
        run: bunx playwright test tests/e2e/sparrow.spec.ts --forbid-only

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore
