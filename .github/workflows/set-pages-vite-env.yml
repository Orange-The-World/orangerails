name: Set CF Pages VITE_* env vars

# Takes the Supabase URL + anon key as workflow_dispatch inputs and
# PATCHes them into all 6 CF Pages projects (preview + production env).
# Uses the CLOUDFLARE_API_TOKEN that's already wired as a repo secret.

on:
  workflow_dispatch:
    inputs:
      or_supabase_url:
        description: 'ORANGERAILS_PROD_SUPABASE_URL (for VITE_SUPABASE_URL on the 4 orangerails-* projects)'
        required: true
        type: string
      or_supabase_anon_key:
        description: 'ORANGERAILS_PROD_SUPABASE_ANON_KEY (for VITE_SUPABASE_ANON_KEY)'
        required: true
        type: string
      ow_supabase_url:
        description: 'ORANGE_WORLD_PROD_SUPABASE_URL (for VITE_OW_SUPABASE_URL on the 2 world projects)'
        required: true
        type: string
      ow_supabase_anon_key:
        description: 'ORANGE_WORLD_PROD_SUPABASE_ANON_KEY (for VITE_OW_SUPABASE_ANON_KEY)'
        required: true
        type: string

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: PATCH env vars
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OR_URL: ${{ inputs.or_supabase_url }}
          OR_KEY: ${{ inputs.or_supabase_anon_key }}
          OW_URL: ${{ inputs.ow_supabase_url }}
          OW_KEY: ${{ inputs.ow_supabase_anon_key }}
        run: |
          set -e
          patch_or() {
            local NAME="$1"
            echo -n "  $NAME ... "
            RESP=$(curl -sS -X PATCH "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/$NAME" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"deployment_configs\":{\"preview\":{\"env_vars\":{\"VITE_SUPABASE_URL\":{\"type\":\"plain_text\",\"value\":\"$OR_URL\"},\"VITE_SUPABASE_ANON_KEY\":{\"type\":\"plain_text\",\"value\":\"$OR_KEY\"}}},\"production\":{\"env_vars\":{\"VITE_SUPABASE_URL\":{\"type\":\"plain_text\",\"value\":\"$OR_URL\"},\"VITE_SUPABASE_ANON_KEY\":{\"type\":\"plain_text\",\"value\":\"$OR_KEY\"}}}}}")
            echo "$RESP" | jq -r 'if .success then "ok" else "err: " + (.errors | tostring) end'
            sleep 5
          }

          patch_ow() {
            local NAME="$1"
            echo -n "  $NAME ... "
            RESP=$(curl -sS -X PATCH "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/$NAME" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"deployment_configs\":{\"preview\":{\"env_vars\":{\"VITE_OW_SUPABASE_URL\":{\"type\":\"plain_text\",\"value\":\"$OW_URL\"},\"VITE_OW_SUPABASE_ANON_KEY\":{\"type\":\"plain_text\",\"value\":\"$OW_KEY\"}}},\"production\":{\"env_vars\":{\"VITE_OW_SUPABASE_URL\":{\"type\":\"plain_text\",\"value\":\"$OW_URL\"},\"VITE_OW_SUPABASE_ANON_KEY\":{\"type\":\"plain_text\",\"value\":\"$OW_KEY\"}}}}}")
            echo "$RESP" | jq -r 'if .success then "ok" else "err: " + (.errors | tostring) end'
            sleep 5
          }

          echo "=== orangerails-* (VITE_SUPABASE_*) ==="
          patch_or orangerails-prod
          patch_or orangerails-dev
          patch_or orangerails-app
          patch_or orangerails-app-dev
          echo ""
          echo "=== world (VITE_OW_SUPABASE_*) ==="
          patch_ow orangerails-world
          patch_ow orange-world-dev

          echo ""
          echo "=== verify variable NAMES ==="
          for proj in orangerails-prod orangerails-dev orangerails-app orangerails-app-dev orangerails-world orange-world-dev; do
            curl -sH "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/$proj" > /tmp/p.json
            names=$(jq -r '.result.deployment_configs.production.env_vars | keys | join(", ")' /tmp/p.json 2>/dev/null)
            echo "  $proj prod-vars: ${names:-(none)}"
          done
