name: Production change-control settings drift

# OR-T1520, out of OR-T0537. The settings that gate production database
# changes on this repository were changed on 2026-08-24, and that was not
# noticed until 2026-09-02. A P1 risk ticket was closed in between on the
# pre-change values. The change was permissive: an identity was ADDED to the
# production actor allowlist. Nothing was harmed, and nothing would have
# reported it if it had been.
#
# This runs daily, records what the API reports, and goes RED when it differs
# from the reviewed baseline, naming the old value and the new one.
#
# WHAT IT DOES NOT DO: it does not change any setting, any reviewer list or
# any allowlist. It reads and it compares. Whether the shared builder identity
# should remain on the production allowlist is a decision, and it belongs to
# the person who owns that decision, not to this file.

on:
  schedule:
    # 11:17 UTC, which is 07:17 EDT. Odd minute on purpose: the top of the
    # hour is the busiest slot on the shared runners and a delayed cron run
    # is a run that silently did not happen today.
    - cron: '17 11 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/change-control-drift.yml'
      - 'scripts/change-control-settings.mjs'
      - 'ops/change-control/baseline.json'

permissions:
  contents: read
  # Declaring a permissions block sets every scope not named here to none.
  # The environments endpoint is governed by the deployments scope, so
  # contents alone can leave the live read refused (exit 3) for a reason that
  # has nothing to do with the settings this workflow watches. Read only.
  deployments: read

jobs:
  # ---------------------------------------------------------------------------
  # Nothing this workflow reports means anything until the comparison itself is
  # shown able to go red. No network, so it cannot be flaky and it cannot be
  # skipped by an outage.
  # ---------------------------------------------------------------------------
  self-test:
    name: The comparison goes red on every class of change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prove the comparison goes red on each class of change
        run: node scripts/change-control-settings.mjs --self-test

  # ---------------------------------------------------------------------------
  # The failure this exists to prevent is a check that could not look and
  # printed OK anyway. So drive the real script at four real failures and
  # assert each one exits with its own code.
  #
  # ONE JOB PER FAILURE MODE, deliberately. A single combined job reports one
  # red named "failure-modes" and the reader has to open the run log to learn
  # which of four assertions broke. The check name should carry that. This is
  # the same principle the script itself is built on: "it did not work" is not
  # a finding, "the 404 path exited 3" is.
  #
  # The first three call api.github.com for real. They are not fixtures and
  # they need no secret.
  # ---------------------------------------------------------------------------

  refused-token-exits-3:
    name: A refused token exits 3, not 0
    runs-on: ubuntu-latest
    needs: self-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Drive the real script at a token the API will refuse
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: this-is-not-a-valid-token
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_PROD: placeholder
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_DEV: placeholder
        run: |
          set -uo pipefail
          STATUS=0
          node scripts/change-control-settings.mjs --read > /dev/null 2> refused.txt || STATUS=$?
          echo "exit ${STATUS}: $(cat refused.txt)"
          if [ "${STATUS}" != "3" ]; then
            echo "::error::a refused token exited ${STATUS}, expected 3. A check that cannot authenticate must say so, not pass."
            exit 1
          fi

  missing-repository-exits-4:
    name: A repository that does not exist exits 4, not 0
    runs-on: ubuntu-latest
    needs: self-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Authenticated on purpose. Anonymous is a different failure and it is
      # not a stable one: from a shared runner IP api.github.com can answer
      # 403 rate-limit-exceeded, which this script correctly calls "refused"
      # (exit 3), and the job would then fail for a reason that has nothing
      # to do with the repository being absent.
      # CHANGE_CONTROL_REPOSITORY, not GITHUB_REPOSITORY. The runner sets the
      # GITHUB_ one itself and its value wins over this block, so overriding
      # that name reaches nothing: this assertion then reads the real
      # repository, succeeds, and exits 0 while claiming to test a 404.
      - name: Drive the real script at a repository that is not there
        env:
          CHANGE_CONTROL_REPOSITORY: Orange-The-World/this-repository-does-not-exist-or-t1520
          GITHUB_TOKEN: ${{ github.token }}
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_PROD: placeholder
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_DEV: placeholder
        run: |
          set -uo pipefail
          STATUS=0
          node scripts/change-control-settings.mjs --read > /dev/null 2> missing.txt || STATUS=$?
          echo "exit ${STATUS}: $(cat missing.txt)"
          if [ "${STATUS}" != "4" ]; then
            echo "::error::a 404 exited ${STATUS}, expected 4. 'I cannot see it' and 'there is nothing there' are different facts."
            exit 1
          fi

  unreachable-api-exits-5:
    name: An unreachable API exits 5, not 0
    runs-on: ubuntu-latest
    needs: self-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # CHANGE_CONTROL_API_URL for the same reason as the job above: the
      # runner owns GITHUB_API_URL, so setting that name here would leave the
      # script talking to the real api.github.com and exiting 0.
      - name: Point the real script at a port with nothing behind it
        env:
          CHANGE_CONTROL_API_URL: http://127.0.0.1:9
          GITHUB_REPOSITORY: ${{ github.repository }}
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_PROD: placeholder
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_DEV: placeholder
        run: |
          set -uo pipefail
          STATUS=0
          node scripts/change-control-settings.mjs --read > /dev/null 2> unreachable.txt || STATUS=$?
          echo "exit ${STATUS}: $(cat unreachable.txt)"
          if [ "${STATUS}" != "5" ]; then
            echo "::error::an unreachable endpoint exited ${STATUS}, expected 5."
            exit 1
          fi

  empty-allowlist-exits-5:
    name: An empty allowlist variable exits 5, not an empty recording
    runs-on: ubuntu-latest
    needs: self-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # No network is required to reach this refusal any more. The script
      # validates the recorded variables before it makes the environments
      # request, so this assertion tests one thing rather than depending on
      # an unrelated call having succeeded first.
      - name: Blank the production allowlist variable
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_PROD: ''
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_DEV: placeholder
        run: |
          set -uo pipefail
          STATUS=0
          node scripts/change-control-settings.mjs --read > /dev/null 2> emptyvar.txt || STATUS=$?
          echo "exit ${STATUS}: $(cat emptyvar.txt)"
          if [ "${STATUS}" != "5" ]; then
            echo "::error::an empty allowlist variable exited ${STATUS}, expected 5. An unset variable and an empty one are indistinguishable here, and one of them would be a change to who may apply migrations."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The live reading. Runs after the machinery has been proven able to fail.
  # ---------------------------------------------------------------------------
  read-and-compare:
    name: Read the live settings and compare them to the reviewed baseline
    runs-on: ubuntu-latest
    needs:
      - self-test
      - refused-token-exits-3
      - missing-repository-exits-4
      - unreachable-api-exits-5
      - empty-allowlist-exits-5
    # Variable values are not available to a pull request from a fork, so the
    # read would fail there for a reason that has nothing to do with this
    # repository's settings. An outside contributor should not be blocked by a
    # check about our own change control.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read the live settings
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          # Read from the workflow's own variables context rather than through
          # the REST API. Same values, one less permission on the path that
          # must not fail for a boring reason.
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_PROD: ${{ vars.MIGRATION_APPLY_ALLOWED_ACTORS_PROD }}
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_DEV: ${{ vars.MIGRATION_APPLY_ALLOWED_ACTORS_DEV }}
        run: |
          set -uo pipefail
          STATUS=0
          node scripts/change-control-settings.mjs --read live.json || STATUS=$?
          if [ "${STATUS}" != "0" ]; then
            {
              echo "## :grey_question: Change-control settings UNKNOWN"
              echo ""
              echo "The reading did not complete (exit ${STATUS}). This is **not** a report"
              echo "that the settings are unchanged. Read the step log: each failure has its"
              echo "own code and message (3 refused, 4 not found, 5 unusable)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Read at $(date -u '+%Y-%m-%d %H:%M UTC'), which is $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')."

      - name: Publish the reading, whatever the comparison says
        run: |
          {
            echo "## Change-control settings as read"
            echo ""
            echo "Read at \`$(date -u '+%Y-%m-%d %H:%M UTC')\` (\`$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')\`) from \`${{ github.repository }}\`."
            echo "A green run of this job means these values ARE the live values at that"
            echo "time, which is what makes a stale reading distinguishable from a fresh one."
            echo ""
            echo '```json'
            cat live.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reading as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: change-control-reading-${{ github.run_id }}
          path: live.json
          retention-days: 90

      - name: Compare against the reviewed baseline
        run: |
          set -uo pipefail
          STATUS=0
          node scripts/change-control-settings.mjs --compare ops/change-control/baseline.json live.json || STATUS=$?

          if [ "${STATUS}" = "6" ]; then
            {
              echo "## :grey_question: No baseline is committed yet"
              echo ""
              echo "\`ops/change-control/baseline.json\` does not exist on this branch, so there"
              echo "is nothing to compare the reading above against. This is **not** a pass and"
              echo "**not** a drift."
              echo ""
              echo "To seed it: copy the JSON printed above into"
              echo "\`ops/change-control/baseline.json\` in a reviewed pull request, minus the"
              echo "\`read_at\` line if you like, since the comparison ignores it. The first"
              echo "recorded values should be ones a person looked at."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no change-control baseline committed; nothing was compared"
            exit 1
          fi

          if [ "${STATUS}" != "0" ]; then
            {
              echo "## :no_entry: Production change-control settings CHANGED"
              echo ""
              echo "The live settings differ from \`ops/change-control/baseline.json\`. Every"
              echo "line below names what moved, what it was, and what it is now."
              echo ""
              echo "A permissive change is the one that matters and it is the one that looks"
              echo "like nothing: an identity added to an allowlist, \`prevent_self_review\`"
              echo "turned off, admins allowed to bypass."
              echo ""
              echo '```'
              node scripts/change-control-settings.mjs --compare ops/change-control/baseline.json live.json 2>&1 || true
              echo '```'
              echo ""
              echo "If the change was intended, update the baseline in a pull request so the"
              echo "old and new values are reviewed rather than absorbed. If it was not, that"
              echo "is an unreviewed change to who may touch production."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::production change-control settings differ from the committed baseline. See step summary."
            exit 1
          fi

          echo "No drift: the live settings match ops/change-control/baseline.json."

  # ---------------------------------------------------------------------------
  # OR-T1738. Every publication route the job above has is closed to a seat with
  # no shell: the step summary and the job log both need an authenticated
  # collaborator token, and the artifact is listable but not downloadable. So
  # the reading can be seen by a person and by no always-on seat here, and the
  # comparison step's own instruction, "copy the JSON printed above", cannot be
  # followed by the seats that have to follow it. That is not a first-run
  # inconvenience: the same route is needed every time an allowlist change is
  # intended and the baseline has to be re-reviewed.
  #
  # This job writes the same reading to a file in this repository, on a branch
  # that carries nothing else, so an ordinary file read at that ref returns it.
  # It does NOT write the baseline: ops/change-control/baseline.json still lands
  # through a reviewed pull request, because the first recorded values must be
  # ones somebody looked at, and a diff is what "looked at" means.
  #
  # PERMISSION, deliberately narrow. contents: write is declared HERE, at job
  # level, on a job that runs on workflow_dispatch and nothing else. The
  # workflow-level block stays read only, so no scheduled run and no
  # pull_request run, from a fork or otherwise, can reach a token that can
  # write. A fork cannot dispatch a workflow: workflow_dispatch is available
  # only to an identity with write access on a branch of this repository, and
  # the branch this job pushes to is fixed in this file rather than taken from
  # an input.
  # ---------------------------------------------------------------------------
  publish-reading:
    name: Publish the live reading where a seat with no shell can read it
    runs-on: ubuntu-latest
    needs:
      - self-test
      - refused-token-exits-3
      - missing-repository-exits-4
      - unreachable-api-exits-5
      - empty-allowlist-exits-5
    # Deliberately NOT `needs: read-and-compare`. That job is red precisely when
    # no baseline is committed, which is the run where the reading is needed
    # most, so gating publication on it would make the seeding case the one case
    # that publishes nothing.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      # A job-level block replaces the whole set rather than adding to it, so
      # deployments: read has to be restated here or the environments read fails
      # with exit 3 for a reason that has nothing to do with change control.
      deployments: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read the live settings
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_PROD: ${{ vars.MIGRATION_APPLY_ALLOWED_ACTORS_PROD }}
          VAR_MIGRATION_APPLY_ALLOWED_ACTORS_DEV: ${{ vars.MIGRATION_APPLY_ALLOWED_ACTORS_DEV }}
        run: |
          set -uo pipefail
          STATUS=0
          node scripts/change-control-settings.mjs --read live.json || STATUS=$?
          if [ "${STATUS}" != "0" ]; then
            echo "::error::the live read did not complete (exit ${STATUS}), so nothing is published. 3 refused, 4 not found, 5 unusable. Publishing a partial reading would be worse than publishing none, because it would then look like the live values."
            exit 1
          fi

      # Committed through the contents API rather than a git push, so the run
      # never has a checkout of the readings branch and cannot carry anything
      # else onto it. The only path this job writes is the one named below.
      - name: Commit the reading to the readings branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          API="${GITHUB_API_URL:-https://api.github.com}"
          BRANCH='ops/change-control-readings'
          TARGET='ops/change-control/live-reading.json'

          # Prints the HTTP status on stdout and leaves the body in resp.json.
          # The token is passed as a header and never echoed.
          req() {
            if [ -n "${3:-}" ]; then
              curl -sS -o resp.json -w '%{http_code}' -X "$1" \
                -H "authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'accept: application/vnd.github+json' \
                --data @"$3" "$2"
            else
              curl -sS -o resp.json -w '%{http_code}' -X "$1" \
                -H "authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'accept: application/vnd.github+json' "$2"
            fi
          }

          CODE=$(req GET "${API}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}")
          if [ "${CODE}" = "404" ]; then
            printf '{"ref":"refs/heads/%s","sha":"%s"}' "${BRANCH}" "${GITHUB_SHA}" > newref.json
            CODE=$(req POST "${API}/repos/${GITHUB_REPOSITORY}/git/refs" newref.json)
            if [ "${CODE}" != "201" ]; then
              echo "::error::could not create ${BRANCH} (HTTP ${CODE}); the reading was NOT published. $(cat resp.json)"
              exit 3
            fi
            echo "created ${BRANCH} at ${GITHUB_SHA}"
          elif [ "${CODE}" != "200" ]; then
            echo "::error::could not read ${BRANCH} (HTTP ${CODE}); the reading was NOT published. This is 'I could not publish', not 'nothing changed'. $(cat resp.json)"
            exit 3
          fi

          SHA=''
          CODE=$(req GET "${API}/repos/${GITHUB_REPOSITORY}/contents/${TARGET}?ref=${BRANCH}")
          if [ "${CODE}" = "200" ]; then
            SHA=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("resp.json","utf8")).sha)')
          elif [ "${CODE}" != "404" ]; then
            echo "::error::could not read ${TARGET} on ${BRANCH} (HTTP ${CODE}); the reading was NOT published. $(cat resp.json)"
            exit 3
          fi

          node -e '
            const fs = require("fs");
            const body = { message: process.argv[1], content: process.argv[2], branch: process.argv[3] };
            if (process.argv[4]) { body.sha = process.argv[4]; }
            fs.writeFileSync("put.json", JSON.stringify(body));
          ' "change-control: live reading at $(date -u '+%Y-%m-%d %H:%M UTC') (run ${GITHUB_RUN_ID})" "$(base64 -w0 live.json)" "${BRANCH}" "${SHA}"

          CODE=$(req PUT "${API}/repos/${GITHUB_REPOSITORY}/contents/${TARGET}" put.json)
          if [ "${CODE}" != "200" ] && [ "${CODE}" != "201" ]; then
            echo "::error::could not write ${TARGET} on ${BRANCH} (HTTP ${CODE}); the reading was NOT published. $(cat resp.json)"
            exit 3
          fi
          echo "published ${TARGET} on ${BRANCH} (HTTP ${CODE})"

      - name: Say where the reading is, and what to do with it
        run: |
          {
            echo "## The reading is published"
            echo ""
            echo "Branch \`ops/change-control-readings\`, file"
            echo "\`ops/change-control/live-reading.json\`. It carries the values and the"
            echo "\`read_at\` timestamp they were read at, so a stale reading is"
            echo "distinguishable from a fresh one without opening this run."
            echo ""
            echo "A seat holding only an ordinary repository file read gets it with:"
            echo ""
            echo '```'
            echo "gh_get_file(repo='${{ github.repository }}', path='ops/change-control/live-reading.json', ref='ops/change-control-readings')"
            echo '```'
            echo ""
            echo "To seed or re-baseline: read that file, commit its values into"
            echo "\`ops/change-control/baseline.json\` on a feature branch, and open a pull"
            echo "request. This workflow never writes the baseline itself, so the first"
            echo "recorded values are always ones somebody reviewed in a diff."
          } >> "$GITHUB_STEP_SUMMARY"
