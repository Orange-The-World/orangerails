name: prod two party gate

on:
  pull_request:
    branches: [prod]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  two-party:
    name: two approvals required to promote to prod
    if: github.event.pull_request.base.ref == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Self-test bot exclusion filter
        run: |
          set -euo pipefail

          # Synthetic reviews: one Bot APPROVED and one User APPROVED (neither the
          # author). The bot must not count; the human must. Expected result: 1.
          test_reviews='[
            {"user": "bot-reviewer", "state": "APPROVED", "type": "Bot"},
            {"user": "human-reviewer", "state": "APPROVED", "type": "User"}
          ]'

          bot_test="$(printf '%s' "${test_reviews}" | jq -r --arg author "pr-author" '
            map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
            | group_by(.user)
            | map(last)
            | map(select(.state == "APPROVED" and .user != $author and .type == "User"))
            | length
          ')"

          if [ "${bot_test}" -ne 1 ]; then
            echo "::error::Bot-exclusion self-test failed: expected 1 (human only), got ${bot_test}"
            exit 1
          fi
          echo "Bot-exclusion self-test passed: bot APPROVED filtered out, 1 human approver counted."

      - name: Count approving reviews from distinct non-author human accounts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          reviews="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | {user: .user.login, state: .state, type: .user.type}]')"

          # Keep only reviews that carry a verdict, take the latest verdict per
          # account, then count the accounts that currently approve, are not
          # the author, and have user.type == "User". Bot accounts can file
          # approving reviews in this fleet and must not satisfy the second-party
          # requirement: the second party must be a human identity. A plain
          # comment does not clear an earlier approval, and GitHub never counts
          # an author approving their own pull request.
          approvers="$(printf '%s' "${reviews}" | jq -r --arg author "${PR_AUTHOR}" '
            map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
            | group_by(.user)
            | map(last)
            | map(select(.state == "APPROVED" and .user != $author and .type == "User"))
            | map(.user)
            | join(", ")
          ')"

          count="$(printf '%s' "${reviews}" | jq -r --arg author "${PR_AUTHOR}" '
            map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
            | group_by(.user)
            | map(last)
            | map(select(.state == "APPROVED" and .user != $author and .type == "User"))
            | length
          ')"

          echo "approving human accounts (author excluded): ${count}"
          echo "who: ${approvers:-none}"

          if [ "${count}" -lt 2 ]; then
            echo "::error::A merge into prod is the production deploy and takes two approvals from two different human accounts (user.type == User), neither of them the author. Found ${count}."
            exit 1
          fi

          echo "Two party requirement satisfied."
