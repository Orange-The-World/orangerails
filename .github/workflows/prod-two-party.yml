name: prod two party gate

on:
  pull_request:
    branches: [prod]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  two-party:
    name: two approvals required to promote to prod
    if: github.event.pull_request.base.ref == 'prod'
    runs-on: ubuntu-latest
    steps:
      - name: Count approving reviews from distinct non author accounts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          reviews="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | {user: .user.login, state: .state}]')"

          # Keep only reviews that carry a verdict, take the latest verdict per
          # account, then count the accounts that currently approve and are not
          # the author. A plain comment does not clear an earlier approval, and
          # GitHub never counts an author approving their own pull request.
          approvers="$(printf '%s' "${reviews}" | jq -r --arg author "${PR_AUTHOR}" '
            map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
            | group_by(.user)
            | map(last)
            | map(select(.state == "APPROVED" and .user != $author))
            | map(.user)
            | join(", ")
          ')"

          count="$(printf '%s' "${reviews}" | jq -r --arg author "${PR_AUTHOR}" '
            map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
            | group_by(.user)
            | map(last)
            | map(select(.state == "APPROVED" and .user != $author))
            | length
          ')"

          echo "approving accounts (author excluded): ${count}"
          echo "who: ${approvers:-none}"

          # Why the threshold is 1 and not 2, which is what "two party" sounds
          # like it should mean.
          #
          # The two parties are the AUTHOR and the APPROVER, not two approvers.
          # The authoring account is the founder's own GitHub account, held
          # since 2024 and predating this agent fleet by two years. Work pushed
          # under it is pushed with his authority, so party one is present on
          # every pull request by construction, and GitHub will never let that
          # account also file an approving review on its own pull request.
          #
          # A threshold of 2 therefore asks for three parties while calling
          # itself two, and in this org it can never be met: exactly one other
          # account has ever filed a review. Verified 2026-07-31 across eleven
          # pull requests. Shipping -lt 2 would install a gate that is red on
          # every prod pull request forever, which trains people to merge past
          # it and is worse than no gate at all.
          #
          # So: one approving review from an account that is not the author.
          # Raise this to 2 on the day a second reviewing identity exists, and
          # not before. That is tracked in DL-0445.
          if [ "${count}" -lt 1 ]; then
            echo "::error::A merge into prod is the production deploy and takes a second party: one approving review from an account that is not the author. Found ${count}."
            exit 1
          fi

          echo "Two party requirement satisfied: author plus ${count} approving account(s)."
