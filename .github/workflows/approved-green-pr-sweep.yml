name: Approved and green PR sweep

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      exercise_positive_fallback:
        description: 'Add a synthetic positive result and exercise GitHub issue delivery'
        required: false
        default: false
        type: boolean

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      checks: read
      statuses: read
      issues: write
    steps:
      - name: Find approved and green PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          ISSUE_TITLE: 'Approved and green PRs waiting to merge (DL-0544)'
          EXERCISE_POSITIVE_FALLBACK: ${{ inputs.exercise_positive_fallback || false }}
        run: |
          set -Eeuo pipefail

          phase="initialization"
          scanned=0
          total_open="unknown"
          count=0

          fail_loud() {
            command_status=$?
            if [ "$BASH_SUBSHELL" -gt 0 ]; then
              return "$command_status"
            fi
            trap - ERR
            exit_status=4
            if [[ "$phase" == scan:* ]]; then
              exit_status=2
            elif [[ "$phase" == delivery:* ]]; then
              exit_status=3
            fi
            echo "::error::SWEEP_FAILED phase=${phase} scanned=${scanned}/${total_open} approved_green=${count} command_exit=${command_status}. This run did not complete; it is not a successful zero-result scan."
            exit "$exit_status"
          }
          trap fail_loud ERR

          chat_ready=1
          if [ -z "${ZULIP_SITE:-}" ] || [ -z "${ZULIP_BOT_EMAIL:-}" ] || [ -z "${ZULIP_API_KEY:-}" ]; then
            chat_ready=0
            echo "::warning::Chat credentials are not configured. This run will report to a GitHub issue instead."
          fi
          if [ "$EXERCISE_POSITIVE_FALLBACK" = "true" ]; then
            chat_ready=0
            echo "::notice::Dispatch exercise requested: adding one labelled synthetic result and using GitHub issue delivery."
          fi

          now=$(date +%s)
          report=""

          phase="scan:list-open-prs"
          prs=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --json number,title,url,reviewDecision,statusCheckRollup,createdAt \
            --limit 100)

          phase="scan:validate-response"
          total_open=$(printf '%s' "$prs" | jq -er 'if type == "array" then length else error("expected an array") end')

          partial=""
          if [ "$total_open" -ge 100 ]; then
            partial=" **(partial scan: reached the 100-PR limit; older PRs may not appear)**"
          fi

          phase="scan:evaluate-prs"
          while IFS= read -r pr; do
            review=$(printf '%s' "$pr" | jq -er '.reviewDecision // ""')
            if [ "$review" != "APPROVED" ]; then
              scanned=$((scanned + 1))
              continue
            fi

            non_green=$(printf '%s' "$pr" | jq -er '[.statusCheckRollup[] | select((.conclusion // .state) as $s | $s != "SUCCESS" and $s != "NEUTRAL" and $s != "SKIPPED")] | length')
            total_checks=$(printf '%s' "$pr" | jq -er '.statusCheckRollup | length')
            if [ "$non_green" != "0" ] || [ "$total_checks" -eq "0" ]; then
              scanned=$((scanned + 1))
              continue
            fi

            number=$(printf '%s' "$pr" | jq -er '.number')
            title=$(printf '%s' "$pr" | jq -er '.title')
            url=$(printf '%s' "$pr" | jq -er '.url')
            created=$(printf '%s' "$pr" | jq -er '.createdAt')
            age_h=$(( (now - $(date -d "$created" +%s)) / 3600 ))
            report="${report}- PR #${number}: [${title}](${url}) is ${age_h}h old"$'\n'
            count=$((count + 1))
            scanned=$((scanned + 1))
          done < <(printf '%s' "$prs" | jq -c '.[]')

          if [ "$scanned" -ne "$total_open" ]; then
            echo "::error::Scan stopped after ${scanned} of ${total_open} open PRs."
            false
          fi

          if [ "$EXERCISE_POSITIVE_FALLBACK" = "true" ]; then
            report="${report}- **FORCED DISPATCH PROOF:** synthetic approved-and-green result; not a real pull request."$'\n'
            count=$((count + 1))
          fi

          phase="scan:complete"
          echo "SCAN_COMPLETE scanned=${scanned}/${total_open} approved_green=${count} forced=${EXERCISE_POSITIVE_FALLBACK}."

          if [ "$count" -gt 0 ]; then
            body="@**Release** **Approved and green PRs waiting to merge (${count}):**${partial}"$'\n'"${report}"
          else
            body="Scanned ${total_open} open PRs. None are approved and green right now.${partial}"
          fi

          phase="delivery:chat"
          delivered=0
          if [ "$chat_ready" = "1" ]; then
            if curl -sS --fail -X POST "${ZULIP_SITE}/api/v1/messages" \
              -u "${ZULIP_BOT_EMAIL}:${ZULIP_API_KEY}" \
              --data-urlencode "type=stream" \
              --data-urlencode "to=Releases" \
              --data-urlencode "topic=Approved and green PRs waiting to merge (DL-0544)" \
              --data-urlencode "content=${body}"; then
              delivered=1
              echo "Reported ${count} PR(s) to chat."
            else
              echo "::warning::Chat post failed. This run will report to a GitHub issue instead."
            fi
          fi

          if [ "$delivered" = "1" ]; then
            echo "SWEEP_COMPLETE scanned=${scanned}/${total_open} approved_green=${count} delivery=chat."
            exit 0
          fi

          if [ "$count" -eq 0 ]; then
            echo "SWEEP_COMPLETE scanned=${scanned}/${total_open} approved_green=0 delivery=not-required. Chat was unavailable; no issue opened."
            exit 0
          fi

          issue_body=$(printf '%s\n\n%s\n\n%s' \
            "This sweep could not deliver its report to chat, so it is reporting here instead." \
            "Approved and green results waiting to merge (${count}; scanned ${total_open} open PRs):${partial}" \
            "${report}")

          phase="delivery:list-fallback-issue"
          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')

          if [ -n "$existing" ]; then
            phase="delivery:comment-fallback-issue"
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$issue_body"
            echo "Reported ${count} approved-and-green result(s) on existing issue #${existing}."
          else
            phase="delivery:create-fallback-issue"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$issue_body"
            echo "Reported ${count} approved-and-green result(s) on a new issue."
          fi

          phase="complete"
          echo "SWEEP_COMPLETE scanned=${scanned}/${total_open} approved_green=${count} delivery=github-issue."
