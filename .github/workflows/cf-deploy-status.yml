name: List CF Pages deployments

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List deployment + source per project
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          for proj in orangerails-prod orangerails-dev orangerails-app orangerails-app-dev orangerails-world orange-world-dev orbi-dev orbi-prod; do
            echo "=== $proj ==="
            # Project source + production_branch
            curl -sH "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/$proj" \
              | python3 -c "
import json,sys
d=json.load(sys.stdin).get('result',{})
src=d.get('source') or {}
cfg=src.get('config') or {}
print(f'  source: {src.get(\"type\",\"none\")} -> {cfg.get(\"owner\",\"\")}/{cfg.get(\"repo_name\",\"\")} branch={cfg.get(\"production_branch\",\"\")}')
print(f'  build: cmd={(d.get(\"build_config\") or {}).get(\"build_command\")!r} out={(d.get(\"build_config\") or {}).get(\"destination_dir\")!r}')
print(f'  domains: {d.get(\"domains\",[])}')
"
            # Last 3 deployments
            curl -sH "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/$proj/deployments?per_page=3" \
              | python3 -c "
import json,sys
ds=json.load(sys.stdin).get('result',[])
if not ds:
    print('  (no deployments)')
for d in ds[:3]:
    stage=(d.get('latest_stage') or {})
    src=(d.get('deployment_trigger') or {}).get('metadata',{}) or {}
    print(f'  {d.get(\"created_on\",\"\")[:19]} env={d.get(\"environment\",\"?\")} stage={stage.get(\"name\",\"?\")}/{stage.get(\"status\",\"?\")} branch={src.get(\"branch\",\"-\")} commit={src.get(\"commit_hash\",\"-\")[:8]}')
"
            echo ""
          done
