name: tmp hygiene scan secret-absent proof

on:
  push:
    branches: ['tmp/hygiene-scan-secret-absent-proof']

permissions:
  contents: read

jobs:
  proof:
    name: hygiene scan, list absent, both modes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mode A, list absent and NOT required (what a fork pull request gets)
        env:
          OR_RESERVED_TERMS: ''
          REQUIRE_RESERVED_TERMS: 'false'
        run: |
          set +e
          bash scripts/pre-publish-scan.sh > out-a.txt 2>&1
          code=$?
          echo "MODE_A_EXIT=$code"
          echo "--- MODE_A reserved-term lines ---"
          grep -n -i 'reserved' out-a.txt | head -20
          echo "--- MODE_A last lines ---"
          tail -n 6 out-a.txt
          exit 0

      - name: Mode B, list absent and required (what a same-repo pull request and a push get)
        env:
          OR_RESERVED_TERMS: ''
          REQUIRE_RESERVED_TERMS: 'true'
        run: |
          set +e
          bash scripts/pre-publish-scan.sh > out-b.txt 2>&1
          code=$?
          echo "MODE_B_EXIT=$code"
          echo "--- MODE_B reserved-term lines ---"
          grep -n -i 'reserved' out-b.txt | head -20
          echo "--- MODE_B last lines ---"
          tail -n 6 out-b.txt
          exit 0
