name: Post-merge metadata hygiene

# Scans every commit that just landed on a protected branch for non-public
# references in:
#   - commit message body (Co-authored-by trailers, body text)
#   - author name + email
#   - committer name + email
#
# This catches the class of stray reference a tree scan cannot see: GitHub auto-adds
# Co-authored-by trailers to squash / rebase merge commits at merge time,
# and the trailer email comes from each contributor's local git config. If a
# contributor's user.email carries a Tailscale tail-net hostname or any other internal-only string, the merge commit silently carries it into public
# history.
#
# Two pattern sources, kept separate on purpose:
#   - A GENERIC structural pattern (tail-net hostnames, CGNAT CIDR) lives in
#     this committed file. It names a CLASS of string, never a person, so it
#     is safe to publish.
#   - A reserved-term pattern (specific internal references) is read at
#     runtime from the OR_RESERVED_TERMS repo secret, so this committed
#     file does not publish the list itself. If the secret is unset the
#     reserved-term half is skipped and the generic half still runs.
#
# Tree-content scanning is owned by repo-hygiene.yml (it runs
# scripts/pre-publish-scan.sh on every PR + push). This workflow stays
# focused on commit metadata so the tree scan does not run twice.

on:
  push:
    branches: [dev, prod]

# Least privilege: this job only reads the repo to inspect commit metadata.
permissions:
  contents: read

jobs:
  conventions-scan:
    name: Commit metadata scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history of the just-pushed commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine range to scan
        id: range
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          # On a brand-new branch creation, github.event.before is all zeros.
          # Scan only the head commit then, to avoid scanning the entire repo
          # history every time a new branch lands.
          ZERO="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "range=$AFTER -1" >> "$GITHUB_OUTPUT"
          else
            echo "range=$BEFORE..$AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan author + committer + body for non-public references
        env:
          # GENERIC structural pattern : safe to commit (names a class, not a
          # person): tail-net hostnames and the CGNAT /10 block Tailscale
          # assigns. Bare ".local" is intentionally NOT here: it false-positives
          # on .env.local / *.local.json. The specific internal *.local host is
          # carried in the reserved-term list instead.
          GENERIC_PATTERN: 'tail[a-z0-9]+\.ts\.net|\.tailnet\b|100\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          # Reserved-term pattern: specific internal references, sourced from a
          # secret so this file never stores them; empty when the secret is unset
          # (reserved-term half skipped, generic half runs).
          # GitHub also masks the secret value in these public logs.
          RESERVED_PATTERN: ${{ secrets.OR_RESERVED_TERMS }}
          # Documentation strip-patterns: tokens that only appear in regex /
          # network documentation, never an accidental match. A matching line is
          # re-scanned with these stripped; if it then comes back clean it was
          # describing the regex (e.g. "widened CIDR to 100.64.0.0/10"), not
          # a stray reference. If it still matches, a real match co-exists with the docs.
          DOC_STRIP_CGNAT: '100\.64\.0\.0/10'
          DOC_STRIP_REGEX_ALT: '\([0-9]+(\|[0-9]+)+\)'
          # Synthetic tailnet sentinel used in self-test fixtures only.
          # A commit message describing a fixture change to this sentinel value
          # is correctly stripped and cleared; all other tail-net forms are caught.
          DOC_STRIP_TAILNET: 'tailtest\.ts\.net'
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          echo "Scanning range: $RANGE"
          PATTERN="$GENERIC_PATTERN"
          if [ -n "${RESERVED_PATTERN:-}" ]; then
            PATTERN="$PATTERN|$RESERVED_PATTERN"
          else
            echo "::notice::OR_RESERVED_TERMS secret not set : scanning generic structural patterns only."
          fi

          # Cleared-list: per-SHA exemptions for commits whose metadata contains a
          # bare CGNAT address the doc-strip cannot remove (e.g. the address appears
          # without surrounding context because the commit itself was removing it).
          # Format (one entry per line): <40-char-sha> <one-line reason>
          # A SHA with no reason is a hard validation error, not a silent skip.
          CLEARED_LIST_FILE=".github/commit-metadata-cleared.txt"
          declare -A CLEARED_SHA_MAP
          if [ -f "$CLEARED_LIST_FILE" ]; then
            while IFS= read -r entry; do
              [[ -z "$entry" || "$entry" =~ ^# ]] && continue
              sha="${entry:0:40}"
              reason="${entry:41}"
              if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::$CLEARED_LIST_FILE: invalid entry -- not a 40-char lowercase hex SHA"
                exit 1
              fi
              if [[ ! "$reason" =~ [^[:space:]] ]]; then
                echo "::error::$CLEARED_LIST_FILE: SHA $sha has no reason (required -- a reason-free entry is a hard error)"
                exit 1
              fi
              CLEARED_SHA_MAP["$sha"]=1
            done < "$CLEARED_LIST_FILE"
            echo "Cleared list loaded: ${#CLEARED_SHA_MAP[@]} SHA(s) from $CLEARED_LIST_FILE"
          fi

          # Sub-patterns used by the cleared-list exemption check (bash inline,
          # single-backslash ERE syntax -- not YAML env vars).
          # The exemption covers CGNAT bare-address matches only. Tailnet and all
          # other patterns on a cleared SHA are NOT exempted: a cleared SHA is not
          # a blanket skip, only the documented match class is exempt.
          _CGNAT_BARE='100\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          _TAILNET_PAT='tail[a-z0-9]+\.ts\.net|\.tailnet\b'

          # Self-test 1: a bare CGNAT address in a non-documentation context must
          # still match PATTERN after doc-strip runs. If doc-strip silences it,
          # the strip has grown too broad.
          _ST1="AUTHOR Someone <someone@example.com> COMMITTER git <git@example.com> 100.64.0.1"
          if ! echo "$_ST1" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 1 FAIL: PATTERN does not match a bare CGNAT address. Scanner is broken."
            exit 1
          fi
          _ST1_CLEAN=$(echo "$_ST1" | sed -E "s|${DOC_STRIP_CGNAT}|[CGNAT-BLOCK]|g; s|${DOC_STRIP_REGEX_ALT}|[REGEX-ALT]|g; s|${DOC_STRIP_TAILNET}|[TAILNET-DOC]|g")
          if ! echo "$_ST1_CLEAN" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 1 FAIL: doc-strip incorrectly cleared a bare CGNAT address. Scanner is broken."
            exit 1
          fi
          echo "Self-test 1 passed: bare CGNAT address survives doc-strip."

          # Self-test 2: a tailnet pattern is NOT exempted by cleared-list logic,
          # even on a cleared SHA. Exemption covers CGNAT bare-address matches only;
          # a different match class on the same SHA must still fail.
          _ST2_LINE="AUTHOR Test <user@badhost.tailab123xyz.ts.net> COMMITTER test <ci@example.com>"
          _ST2_CLEAN=$(echo "$_ST2_LINE" | sed -E "s|${DOC_STRIP_CGNAT}|[CGNAT-BLOCK]|g; s|${DOC_STRIP_REGEX_ALT}|[REGEX-ALT]|g; s|${DOC_STRIP_TAILNET}|[TAILNET-DOC]|g")
          if ! echo "$_ST2_CLEAN" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 2 FAIL: PATTERN does not match the tailnet test line. Scanner is broken."
            exit 1
          fi
          _st2_cgnat=$(echo "$_ST2_CLEAN" | grep -cEi "$_CGNAT_BARE" || true)
          _st2_tailnet=$(echo "$_ST2_CLEAN" | grep -cEi "$_TAILNET_PAT" || true)
          if [ "$_st2_cgnat" -gt 0 ] && [ "$_st2_tailnet" -eq 0 ]; then
            echo "::error::Self-test 2 FAIL: exemption logic would incorrectly clear a tailnet match. Scanner is broken."
            exit 1
          fi
          echo "Self-test 2 passed: non-documentation tailnet hostname survives tailnet doc-strip and is not exempted."

          # Self-test 3: cleared-list exemption must NOT apply to un-cleared SHAs.
          # Simulates the exemption decision for a synthetic SHA absent from the cleared
          # map and asserts the exemption does NOT fire for it.
          _ST3_SHA="deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
          _st3_would_exempt=0
          if [[ -n "${CLEARED_SHA_MAP[$_ST3_SHA]+set}" ]]; then
            _c=$(echo "100.64.0.1" | grep -cEi "$_CGNAT_BARE" || true)
            _t=$(echo "100.64.0.1" | grep -cEi "$_TAILNET_PAT" || true)
            if [ "$_c" -gt 0 ] && [ "$_t" -eq 0 ]; then
              _st3_would_exempt=1
            fi
          fi
          if [ "$_st3_would_exempt" -ne 0 ]; then
            echo "::error::Self-test 3 FAIL: exemption logic fired on an un-cleared SHA. Scanner is broken."
            exit 1
          fi
          echo "Self-test 3 passed: un-cleared SHA CGNAT match correctly not exempted."

          # Self-test 4: the tailnet documentation sentinel (DOC_STRIP_TAILNET) is stripped
          # only for the named synthetic sentinel value; a different synthetic tailnet
          # hostname survives the strip and still triggers PATTERN. Proves the strip
          # is narrow: an uncleared commit carrying any other tailnet form still fails.
          _ST4_LINE="AUTHOR Test <user@tailab123xyz.ts.net> COMMITTER test <ci@example.com>"
          _ST4_CLEAN=$(echo "$_ST4_LINE" | sed -E "s|${DOC_STRIP_CGNAT}|[CGNAT-BLOCK]|g; s|${DOC_STRIP_REGEX_ALT}|[REGEX-ALT]|g; s|${DOC_STRIP_TAILNET}|[TAILNET-DOC]|g")
          if ! echo "$_ST4_CLEAN" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 4 FAIL: doc-strip incorrectly cleared a non-documentation tailnet address. Scanner is broken."
            exit 1
          fi
          echo "Self-test 4 passed: non-documentation tailnet address survives tailnet doc-strip."
          MATCHES=0
          CURRENT_SHA="(unknown)"
          while IFS= read -r line; do
            # Each record starts with the commit SHA (see --format below).
            # Track it so a match on a BODY line attributes to the right
            # commit, not the first word of that body line.
            # Anchored to "AUTHOR" so a body line beginning with 40 hex chars
            # cannot spoof CURRENT_SHA and gain a cleared-list exemption.
            if [[ "$line" == "--END--" ]]; then
              CURRENT_SHA="(unknown)"
              continue
            fi
            if [[ "$line" =~ ^([0-9a-f]{40})\ AUTHOR\  ]]; then
              CURRENT_SHA="${BASH_REMATCH[1]}"
            fi
            if echo "$line" | grep -qEi "$PATTERN"; then
              # Strip documentation tokens and re-scan; a still-matching line
              # has a real match co-existing with the docs.
              cleaned=$(echo "$line" | sed -E "s|${DOC_STRIP_CGNAT}|[CGNAT-BLOCK]|g; s|${DOC_STRIP_REGEX_ALT}|[REGEX-ALT]|g; s|${DOC_STRIP_TAILNET}|[TAILNET-DOC]|g")
              if ! echo "$cleaned" | grep -qEi "$PATTERN"; then
                echo "::notice::Allowlisted documentation line (CGNAT block, regex syntax, or tailnet sentinel)."
                continue
              fi
              # Cleared-list check: exempts CGNAT bare-address matches on known SHAs.
              # Tailnet and other patterns are NOT exempted by this mechanism.
              if [[ -n "${CLEARED_SHA_MAP[$CURRENT_SHA]+set}" ]]; then
                _is_cgnat=$(echo "$cleaned" | grep -cEi "$_CGNAT_BARE" || true)
                _is_tailnet=$(echo "$cleaned" | grep -cEi "$_TAILNET_PAT" || true)
                if [ "$_is_cgnat" -gt 0 ] && [ "$_is_tailnet" -eq 0 ]; then
                  echo "::notice::SHA $CURRENT_SHA is on the cleared list; CGNAT bare-address match exempted."
                  continue
                fi
              fi
              # Do NOT echo the matched content: Actions logs are world-readable
              # on a public repo. Print only the commit SHA (already public in
              # git history) so the maintainer can locate it.
              echo "::error::Reserved internal term in commit ${CURRENT_SHA}'s metadata; a maintainer should clear it. (Matched text withheld from logs.)"
              MATCHES=$((MATCHES + 1))
            fi
          done < <(git log $RANGE --format='%H AUTHOR %an <%ae> COMMITTER %cn <%ce>%n%B%n--END--')

          if [ "$MATCHES" -gt 0 ]; then
            echo "::error::Conventions-scan failed: $MATCHES line(s) carry non-public references."
            exit 1
          fi
          echo "Conventions-scan clean: 0 lines carry non-public references."
