name: STALE CI label

# We use this to compare the set of check names on the PR head against the
# trunk (dev) baseline. A PR whose head SHA is missing any non-skipped trunk
# check name is labeled STALE CI so the review queue and reviewers can see
# it at a glance.
#
# Trigger, and why it changed (DEV-0108, 2026-08-27):
#   This used to fire on every completed check_run, repo-wide -- one
#   workflow run, and one more "Evaluate STALE CI label" check-run on the
#   PR head, for EVERY individual check that finished (each of ci.yml's ~5
#   jobs separately, plus every re-run). On a long-lived promotion PR that
#   pushed check-run counts on the head past the 100-row page the merge
#   tool reads, crowding the five REQUIRED contexts off page one (DL-1602).
#   Switched to workflow_run on the CI workflow: one trigger per CI run
#   completing, not per job inside it. deno-typecheck/deno-test/vitest/
#   playwright are jobs of that one workflow, so this still re-evaluates
#   once they have all settled.
#   Accepted tradeoff: a check-run from outside ci.yml finishing last (for
#   example a Cloudflare Pages deploy) no longer re-triggers this label by
#   itself. That is acceptable because this labeler is explicitly advisory
#   (see the concurrency comment below) and never blocks merge on its own;
#   the next CI run or push re-evaluates it. Rejected: keeping check_run as
#   a second trigger filtered to non-Actions apps only reduces PASS to SKIP
#   on the same number of runs (a job-level `if:` still creates a check-run
#   entry, it does not prevent one), so it would not have cut the count at
#   all -- verified against this same repo's "Open issue on scan failure"
#   job, which shows SKIP on nearly every invocation and still counts
#   toward the same page-one crowding this ticket exists to fix.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# This labeler is advisory. It must never leave an unsuccessful check-run
# on the head, because that holds mergeable_state at 'unstable' and blocks
# merge tooling. So: queue runs instead of cancelling them (a cancelled run
# is an unsuccessful conclusion), and let the compare step fail soft.
concurrency:
  group: stale-ci-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

jobs:
  label-stale-ci:
    name: Evaluate STALE CI label
    runs-on: ubuntu-latest
    steps:
      - name: Find open PR targeting dev for this commit
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          PR_NUMBER=$(gh api \
            "repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" \
            -H "Accept: application/vnd.github+json" \
            --jq '[.[] | select(.state == "open" and .base.ref == "dev")] | first | .number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR targeting dev for ${HEAD_SHA} -- nothing to label"
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Wait for checks to settle
        id: settled
        if: steps.find-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.find-pr.outputs.head_sha }}
        run: |
          # Poll the head's check-runs instead of looking once. Under the
          # workflow_run trigger this workflow fires exactly once per CI run,
          # and a check-run from outside CI (a Cloudflare Pages deploy, for
          # example) can settle after CI does. A single look would then see
          # an unsettled check and give up for good, since nothing else
          # re-triggers this workflow for that head. Poll instead, bounded so
          # a genuinely stuck check does not hold the job open forever.
          DEADLINE=$(( $(date +%s) + 300 ))
          while true; do
            RUNNING=$(gh api \
              "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              --jq '[.check_runs[] | select(.status != "completed" and .name != "Evaluate STALE CI label")] | length')
            if [ "$RUNNING" -eq 0 ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "All checks settled -- proceeding with STALE CI evaluation"
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "${RUNNING} check(s) still running after 5 minutes -- timed out, deferring STALE CI evaluation"
              break
            fi
            echo "${RUNNING} check(s) still running -- waiting 30s before re-checking"
            sleep 30
          done

      - name: Ensure STALE CI label exists
        if: >
          steps.find-pr.outputs.pr_number != '' &&
          steps.settled.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "STALE CI" \
            --repo "${{ github.repository }}" \
            --description "PR head is missing CI checks present on trunk (dev)" \
            --color "e4e669" 2>/dev/null || true

      - name: Compare check sets and apply or remove label
        continue-on-error: true
        if: >
          steps.find-pr.outputs.pr_number != '' &&
          steps.settled.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.find-pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          # --- Trunk baseline ---
          # Non-skipped check names on dev HEAD. apply-migrations is always
          # skipped on dev (it requires a manual dispatch flag) and is not a
          # real gate, so excluding skipped conclusions gives us the real set.
          TRUNK_CHECKS=$(gh api \
            "repos/${{ github.repository }}/commits/dev/check-runs" \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            --jq '[.check_runs[] | select(.conclusion != "skipped" and .name != "Evaluate STALE CI label") | .name] | sort | unique | .[]')

          if [ -z "$TRUNK_CHECKS" ]; then
            echo "::warning::Trunk check-run list is empty -- refusing to label (empty baseline would produce false positives on every PR)"
            exit 0
          fi

          TRUNK_COUNT=$(echo "$TRUNK_CHECKS" | wc -l | tr -d ' ')
          echo "Trunk baseline (${TRUNK_COUNT} checks):"
          echo "$TRUNK_CHECKS" | sed 's/^/  /'

          # --- PR head set ---
          # All check names that have any run on this SHA (any state or conclusion).
          # A name absent here will never appear: checks are bound to the SHA they
          # were triggered against.
          PR_CHECKS=$(gh api \
            "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            --jq '[.check_runs[] | select(.name != "Evaluate STALE CI label") | .name] | sort | unique | .[]' || echo "")

          PR_COUNT=$(echo "$PR_CHECKS" | grep -c . || true)
          echo "PR head checks (${PR_COUNT}):"
          echo "$PR_CHECKS" | sed 's/^/  /'

          # --- Compare ---
          # comm -23: lines in trunk (sorted A) not in PR head (sorted B) = missing.
          MISSING=$(comm -23 \
            <(echo "$TRUNK_CHECKS") \
            <(echo "$PR_CHECKS"))

          if [ -n "$MISSING" ]; then
            MISSING_COUNT=$(echo "$MISSING" | grep -c . || true)
            echo "STALE CI: ${MISSING_COUNT} trunk check(s) never ran on this PR head:"
            echo "$MISSING" | sed 's/^/  MISSING: /'
            gh pr edit "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --add-label "STALE CI"
            echo "Label STALE CI applied to PR #${PR_NUMBER}"
          else
            echo "All ${TRUNK_COUNT} trunk checks present on PR head -- clearing STALE CI label if set"
            gh pr edit "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --remove-label "STALE CI" 2>/dev/null || true
          fi
