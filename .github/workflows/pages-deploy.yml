name: Deploy to Cloudflare Pages

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you redeploying? (e.g. cancelled deploy, asset cache bust)'
        required: false
        type: string

concurrency:
  group: pages-${{ github.ref }}
  # Don't cancel in-progress runs. A merge train can produce two pushes
  # in quick succession; cancelling the first means its commit's content
  # never deploys (the second deploy ships its own sha, the first is
  # silently dropped). 2026-05-27: this bit us when #134 squash-merged
  # 90s after #135 and the docs/xpub-export changes did not ship until
  # an empty redeploy commit was pushed. Queue serially instead.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 24 (for Vite crypto.hash)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pick Supabase project for this branch
        id: sb
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "project_id=${{ vars.VITE_SUPABASE_PROJECT_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_SUPABASE_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=${{ vars.VITE_SUPABASE_PROJECT_ID_DEV }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_SUPABASE_URL_DEV }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ steps.sb.outputs.project_id }}
          VITE_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.sb.outputs.key }}

      - name: Pick Pages + Supabase targets for this branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "project=orangerails-prod" >> "$GITHUB_OUTPUT"
            echo "supabase_ref=lcdicqalreskibdfxkzb" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "project=orangerails-dev" >> "$GITHUB_OUTPUT"
            echo "supabase_ref=gposxxmxenrdvewrprle" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown branch ${{ github.ref_name }} — skipping deploy"
            exit 0
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.target.outputs.project }} --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # esm.sh occasionally 522s mid-bundle. Retry up to 3 times before
          # giving up so the deploy is not at the mercy of a single CDN hiccup.
          for attempt in 1 2 3; do
            if supabase functions deploy --project-ref ${{ steps.target.outputs.supabase_ref }}; then
              echo "edge functions deployed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; sleeping 15s and retrying"
            sleep 15
          done
          echo "edge functions deploy failed after 3 attempts"
          exit 1
