name: Deploy to Cloudflare Pages

on:
  push:
    branches: [dev, prod]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 24 (for Vite crypto.hash)
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pick Supabase project for this branch
        id: sb
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "project_id=${{ vars.VITE_SUPABASE_PROJECT_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_SUPABASE_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=${{ vars.VITE_SUPABASE_PROJECT_ID_DEV }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_SUPABASE_URL_DEV }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ steps.sb.outputs.project_id }}
          VITE_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.sb.outputs.key }}

      - name: Pick Pages + Supabase targets for this branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "project=orangerails-prod" >> "$GITHUB_OUTPUT"
            echo "supabase_ref=lcdicqalreskibdfxkzb" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "project=orangerails-dev" >> "$GITHUB_OUTPUT"
            echo "supabase_ref=gposxxmxenrdvewrprle" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown branch ${{ github.ref_name }} — skipping deploy"
            exit 0
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ steps.target.outputs.project }} --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy --project-ref ${{ steps.target.outputs.supabase_ref }}
