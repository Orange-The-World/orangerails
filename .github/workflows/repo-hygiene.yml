name: Repository hygiene

on:
  # DELIBERATELY UNFILTERED, see the long note in ci.yml (DEV-0283): a PR
  # stacked on another feature branch used to run none of the real checks and
  # still read GREEN. This scan reads the working tree, so the branch a PR
  # targets says nothing about whether the tree is clean. Every pull request
  # gets scanned.
  pull_request:
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: only needs to read the tree to scan it.
permissions:
  contents: read

jobs:
  pre-publish-scan:
    name: Pre-publish hygiene scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current scanner from dev
        # The checked-out tree can come from a branch created before a scanner
        # security fix. Running that branch's copy would restore the old output
        # policy and could publish matched content in this public log. Fetch the
        # scanner from dev every time, then install it at its normal path so it
        # still scans the checked-out PR tree rather than the fetched ref.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/dev
          git show FETCH_HEAD:scripts/pre-publish-scan.sh > "$RUNNER_TEMP/pre-publish-scan.sh"
          install -m 0755 "$RUNNER_TEMP/pre-publish-scan.sh" scripts/pre-publish-scan.sh

      - name: Run pre-publish hygiene scan
        # Fails the job (and the required check) if any reserved term or stray
        # internal reference is found. See scripts/pre-publish-scan.sh for the
        # rules and exemptions.
        # OR_RESERVED_TERMS feeds the scanner the reserved internal terms
        # that are NOT committed in the script. Sourced from a secret so the
        # list never lives in the repo. Absent on fork PRs (secrets withheld):
        # the reserved-term scan then skips and structural checks still run.
        # GitHub masks the value in logs.
        #
        # REQUIRE_RESERVED_TERMS makes a missing list a hard failure on every
        # run that can actually see the secret: pushes to dev/prod AND
        # same-repo pull requests. The list MUST be present on a real run, or
        # the guard is not running and this required check would report
        # success while the category it exists to catch never ran.
        #
        # One expression covers all three cases. On a push event
        # github.event.pull_request is null and null != true is true, so
        # pushes stay hard-required with no second clause. On a same-repo PR
        # fork is false, so it is hard-required too. On a fork PR fork is
        # true: GitHub withholds the secret from forks, so a fork genuinely
        # cannot supply the list and stays the legitimate soft-skip.
        env:
          OR_RESERVED_TERMS: ${{ secrets.OR_RESERVED_TERMS }}
          REQUIRE_RESERVED_TERMS: ${{ github.event.pull_request.head.repo.fork != true }}
        run: bash scripts/pre-publish-scan.sh
