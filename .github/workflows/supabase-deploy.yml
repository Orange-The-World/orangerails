name: Deploy Supabase edge functions and migrations

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you redeploying? (e.g. cancelled deploy, asset cache bust)'
        required: false
        type: string
      apply_migrations:
        description: 'Also APPLY pending DB migrations to this branch project. Off by default. Pushes can never turn this on.'
        required: false
        default: false
        type: boolean

concurrency:
  group: pages-${{ github.ref }}
  # Don't cancel in-progress runs. A merge train can produce two pushes
  # in quick succession; cancelling the first means its commit's content
  # never deploys (the second deploy ships its own sha, the first is
  # silently dropped). 2026-05-27: this bit us when #134 squash-merged
  # 90s after #135 and the docs/xpub-export changes did not ship until
  # an empty redeploy commit was pushed. Queue serially instead.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 24 (for Vite crypto.hash)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pick Supabase project for this branch
        id: sb
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "project_id=${{ vars.VITE_SUPABASE_PROJECT_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_SUPABASE_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=${{ vars.VITE_SUPABASE_PROJECT_ID_DEV }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_SUPABASE_URL_DEV }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        # This workflow never uploads to Cloudflare Pages: Pages builds independently
        # from its own project. VITE_OR_STEALTH_ALLOWED_ORIGINS is NOT set here.
        # Sole source of truth for the stealth allowlist: the VITE_OR_STEALTH_ALLOWED_ORIGINS
        # env var on the Cloudflare Pages project.
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ steps.sb.outputs.project_id }}
          VITE_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.sb.outputs.key }}
      - name: Pick Supabase target for this branch
        id: target
        run: |
          # Two separate Supabase projects in the same testing org:
          #   prod -> lcdicqalreskibdfxkzb (orangerails_prod, api.orangerails.com)
          #   dev  -> fzwmnzmtqidumdqjdddz (orangerails_dev,  api.orangerails.dev)
          #
          # Until 2026-06-21 the dev path pointed at the prod project too, which
          # meant a dev deploy would ship un-merged edge functions and migrations
          # straight to production. Earlier on 2026-06-21 the dev path was first
          # set to gposxxmxenrdvewrprle, which is NOT this repo's dev project at
          # all: it is orange-world-prod, the production database for a sibling
          # product that lives in the same Supabase team. The owner had already
          # caught this exact ref-confusion on 2026-06-18 and corrected it in the
          # predecessor workflow pages-deploy.yml (see commit b55636e: "was
          # pointing at OWM PROD by mistake, would clobber it on next dev push");
          # when pages-deploy.yml was replaced by this supabase-deploy.yml the
          # wrong ref was reintroduced. The correct dev project is
          # fzwmnzmtqidumdqjdddz, the orangerails_dev workspace. Each branch now
          # lands on its own Supabase project; promote dev -> prod through a PR to
          # graduate changes. NEVER let the dev arm here point at a project ref
          # outside this repo's two Supabase projects.
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "supabase_ref=lcdicqalreskibdfxkzb" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "supabase_ref=fzwmnzmtqidumdqjdddz" >> "$GITHUB_OUTPUT"
          else
            # Refuse to deploy from any non-prod, non-dev branch. The earlier
            # "Pick Supabase project" step falls through to DEV creds for any
            # other branch; without this guard, a workflow_dispatch from a
            # feature branch would build a Pages bundle wired to DEV Supabase
            # but skip the edge-function and migration deploy (empty ref),
            # producing schema drift against whatever DEV currently runs.
            echo "::error::Supabase deploys only run from 'prod' or 'dev' branches; got '${{ github.ref_name }}'"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Supabase edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Determine which functions to deploy.
          # - workflow_dispatch: always deploy all (may be a manual hotfix).
          # - Force push or fresh branch (before == 000...): cannot diff; deploy all.
          # - Any _-prefixed shared directory changed (_shared, _lib, etc.): deploy all.
          # - git diff fails for any reason: fail closed, deploy all.
          # - Otherwise: only deploy functions whose directory changed and still exists.
          BEFORE="${{ github.event.before }}"
          ALL_FUNCS=$(ls supabase/functions/ | grep -v '^_' || true)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            DEPLOY_FUNCS="$ALL_FUNCS"
            echo "Full deploy (workflow_dispatch or force push): $(echo "$DEPLOY_FUNCS" | tr '\n' ' ')"
          else
            if ! CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'supabase/functions/'); then
              DEPLOY_FUNCS="$ALL_FUNCS"
              echo "git diff failed; falling back to full deploy: $(echo "$DEPLOY_FUNCS" | tr '\n' ' ')"
            elif echo "$CHANGED" | grep -qE 'supabase/functions/_[^/]+/'; then
              DEPLOY_FUNCS="$ALL_FUNCS"
              echo "Shared directory changed; redeploying all functions: $(echo "$DEPLOY_FUNCS" | tr '\n' ' ')"
            else
              DEPLOY_FUNCS=$(echo "$CHANGED" | grep -oP 'supabase/functions/\K[^/]+' | grep -v '^_' | sort -u || true)
              # Skip any function directory deleted in this push.
              DEPLOY_FUNCS=$(echo "$DEPLOY_FUNCS" | while IFS= read -r func; do
                [ -n "$func" ] && [ -d "supabase/functions/$func" ] && echo "$func"
              done)
              echo "Targeted deploy: $(echo "$DEPLOY_FUNCS" | tr '\n' ' ')"
            fi
          fi

          if [ -z "$DEPLOY_FUNCS" ]; then
            echo "No edge functions changed; skipping deploy"
            exit 0
          fi

          # Deploy each function with retry on esm.sh 522 errors.
          for FUNC in $DEPLOY_FUNCS; do
            for attempt in 1 2 3; do
              if supabase functions deploy "$FUNC" --project-ref ${{ steps.target.outputs.supabase_ref }}; then
                echo "$FUNC deployed on attempt $attempt"
                break
              fi
              if [ $attempt -eq 3 ]; then
                echo "$FUNC deploy failed after 3 attempts"
                exit 1
              fi
              echo "attempt $attempt for $FUNC failed; sleeping 15s and retrying"
              sleep 15
            done
          done

      - name: Report pending DB migrations (read-only, never applies)
        # Runs on every deploy so schema drift is visible instead of silent.
        # Applying is a separate, opt-in step below.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_REF: ${{ steps.target.outputs.supabase_ref }}
        run: |
          set -euo pipefail
          MIG_DIR="supabase/migrations"
          if [ ! -d "$MIG_DIR" ]; then
            echo "no migrations directory; nothing pending"
            exit 0
          fi

          PAYLOAD=$(mktemp); chmod 600 "$PAYLOAD"
          trap 'rm -f "$PAYLOAD"' EXIT
          jq -n '{query:"SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;"}' > "$PAYLOAD"
          APPLIED=$(curl -sS -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@$PAYLOAD" | jq -r '.[].version' | sort -u)

          PENDING=0
          PENDING_NAMES=""
          for FILE in $(ls "$MIG_DIR"/*.sql 2>/dev/null | sort); do
            BASENAME=$(basename "$FILE")
            VERSION="${BASENAME%%_*}"
            if echo "$APPLIED" | grep -qx "$VERSION"; then
              continue
            fi
            echo "PENDING on ${SUPABASE_REF}: ${BASENAME}"
            PENDING_NAMES="${PENDING_NAMES}- \`${BASENAME}\`\n"
            PENDING=$((PENDING + 1))
          done

          echo
          echo "${PENDING} migration(s) pending on ${SUPABASE_REF}."
          if [ "$PENDING" -gt 0 ]; then
            {
              echo "## :warning: ${PENDING} unapplied migration(s) on \`${SUPABASE_REF}\`"
              echo ""
              echo ":white_check_mark: Edge functions deployed successfully. Only the schema is out of sync."
              echo ""
              printf '%b' "${PENDING_NAMES}"
              echo ""
              echo "Schema is **out of sync**. Nothing was applied by this run."
              echo ""
              echo "| env | who applies |"
              echo "| --- | --- |"
              echo "| dev | DBA applies and verifies |"
              echo "| prod | two-party: founder + CTO |"
            } >> "$GITHUB_STEP_SUMMARY"
            # On a workflow_dispatch with apply_migrations=true the apply step below
            # handles these migrations. Report as informational and let it proceed.
            # On any other trigger (push, or dispatch without apply), fail closed.
            if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.apply_migrations }}" != "true" ]; then
              echo "::error::${PENDING} migration(s) not applied on ${SUPABASE_REF} -- schema out of sync."
              exit 1
            else
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Apply step running next -- see below." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Schema in sync on ${SUPABASE_REF}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply pending DB migrations via Management API
        # Only ever runs on an explicit workflow_dispatch with apply_migrations
        # checked. A push CANNOT reach this step: `inputs` is null on a push
        # event, so the condition is false. Deploying code and changing a schema
        # are different acts with different blast radii, and merging a PR must
        # never be the thing that silently rewrites a database.
        #
        # The Supabase CLI's `db push` requires a linked project + DB
        # password we don't have in CI. The Management API SQL endpoint
        # (POST /v1/projects/{ref}/database/query) does NOT need the DB
        # password, it auths with SUPABASE_ACCESS_TOKEN, so we use it
        # directly. We track applied versions in
        # supabase_migrations.schema_migrations the same way `supabase db
        # push` would, so manual recovery via the CLI later stays clean.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_REF: ${{ steps.target.outputs.supabase_ref }}
        run: |
          set -euo pipefail
          MIG_DIR="supabase/migrations"
          if [ ! -d "$MIG_DIR" ]; then
            echo "no migrations directory; skipping"
            exit 0
          fi

          # Fetch already-applied versions
          PAYLOAD=$(mktemp); chmod 600 "$PAYLOAD"
          trap 'rm -f "$PAYLOAD"' EXIT
          jq -n '{query:"SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;"}' > "$PAYLOAD"
          APPLIED=$(curl -sS -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@$PAYLOAD" | jq -r '.[].version' | sort -u)
          echo "── already applied versions on ${SUPABASE_REF} ──"
          echo "$APPLIED" | tail -10
          echo

          # For each migration file, apply if not in the applied set
          APPLIED_COUNT=0
          for FILE in $(ls "$MIG_DIR"/*.sql 2>/dev/null | sort); do
            BASENAME=$(basename "$FILE")
            VERSION="${BASENAME%%_*}"
            if echo "$APPLIED" | grep -qx "$VERSION"; then
              continue
            fi
            echo "── applying ${BASENAME} ──"

            SQL_PAYLOAD=$(mktemp); chmod 600 "$SQL_PAYLOAD"
            jq -Rs --arg q "$(cat "$FILE")" '{query:$q}' < /dev/null > "$SQL_PAYLOAD"
            CODE=$(curl -sS -o /tmp/mig.resp -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@$SQL_PAYLOAD")
            rm -f "$SQL_PAYLOAD"

            if [[ ! "$CODE" =~ ^2 ]]; then
              echo "  ✗ FAILED (HTTP $CODE): $(head -c 400 /tmp/mig.resp)"
              rm -f /tmp/mig.resp
              exit 1
            fi
            echo "  ✓ SQL applied (HTTP $CODE)"

            # Record in schema_migrations
            REC=$(mktemp); chmod 600 "$REC"
            jq -n --arg v "$VERSION" \
              '{query:"INSERT INTO supabase_migrations.schema_migrations (version) VALUES ('"'"'\($v)'"'"') ON CONFLICT DO NOTHING;"}' > "$REC"
            REC_CODE=$(curl -sS -o /tmp/mig.resp -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@$REC")
            rm -f "$REC"

            if [[ ! "$REC_CODE" =~ ^2 ]]; then
              echo "  x FAILED to record migration in ledger (HTTP $REC_CODE): $(head -c 400 /tmp/mig.resp)"
              rm -f /tmp/mig.resp
              exit 1
            fi
            rm -f /tmp/mig.resp
            echo "  v migration recorded in ledger (HTTP $REC_CODE)"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
          done

          echo
          echo "── ${APPLIED_COUNT} migration(s) applied this run ──"
