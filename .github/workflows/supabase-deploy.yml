name: Deploy Supabase edge functions and migrations

# OR-T1772. The approver at the supabase-prod pause needs the restore point BEFORE
# they click, and nothing in this file carried it. run-name is evaluated when the run
# is created, so it is in the run title in the run list and at the top of the run page
# with zero clicks, and it is there before the environment pause. `inputs` is null on a
# push, so the push branch of this expression has to produce a real title rather than an
# empty one or the literal string null.
# A dispatch that carries NO reason must be LOUD, not blank: a run missing its
# restore point has to look different from an ordinary run, because absence reading
# as normal is the one shape a refusal cannot fire on.
# github.event.inputs is used rather than the inputs context on purpose. Both are
# valid for a workflow_dispatch, but the github context is unambiguously available at
# workflow level, and an expression that fails to evaluate here produces exactly the
# blank title this is meant to prevent.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && (github.event.inputs.reason != ''
          && format('DISPATCH by {0}: {1}', github.actor, github.event.inputs.reason)
          || format('DISPATCH by {0}: NO REASON GIVEN', github.actor))
      || format('push to {0} by {1}', github.ref_name, github.actor) }}

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you redeploying? (e.g. cancelled deploy, asset cache bust)'
        required: false
        type: string
      apply_migrations:
        description: 'Also APPLY pending DB migrations to this branch project. Off by default. Pushes can never turn this on.'
        required: false
        default: false
        type: boolean

concurrency:
  group: pages-${{ github.ref }}
  # Don't cancel in-progress runs. A merge train can produce two pushes
  # in quick succession; cancelling the first means its commit's content
  # never deploys (the second deploy ships its own sha, the first is
  # silently dropped). 2026-05-27: this bit us when #134 squash-merged
  # 90s after #135 and the docs/xpub-export changes did not ship until
  # an empty redeploy commit was pushed. Queue serially instead.
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # DL-1640 / DL-1470 / DL-1655, 2026-08-26. Founder: "why the drift why not done
  # as they are built?"
  #
  # WHAT WAS WRONG. Nothing was broken -- the workflow did exactly what it was
  # written to do, and what it was written to do produced 37 unapplied migrations
  # on production, 10 of them security revocations, the oldest from 2026-07-13.
  #
  #   deploy                    (no needs)     shipped edge functions
  #   check-pending-migrations  needs: deploy  reported drift AFTER the code shipped
  #   apply-migrations          needs: deploy  required workflow_dispatch + a ticked box
  #
  # `inputs` is null on a push, so apply-migrations could NEVER run on a merge.
  # Every automatic deploy shipped 100% of the code and 0% of the schema, and the
  # drift report ran afterwards and blocked nothing. The design assumed a human
  # would see the red check and hand-dispatch the apply. Over six weeks nobody did,
  # and the reason is structural rather than lazy: migrations apply IN ORDER, so
  # the cost of applying one migration is the risk of applying the whole backlog.
  # The longer it drifts the scarier the apply, so it drifts further. The DL-1597
  # cross-tenant scan-range guard is live in code right now with its migration
  # unapplied -- believing you are protected when you are not is the worst state
  # this can produce, and it was the normal operating state.
  #
  # THE RULE NOW: a migration and the code that needs it land together, or neither
  # lands.
  #
  #   target                    resolves the project (no secrets, no side effects)
  #   apply-migrations          needs: target   AUTOMATIC on a push to dev
  #   check-pending-migrations  needs: target   gates the deploy, does not follow it
  #   deploy                    needs: gate     cannot ship ahead of its schema
  #
  # dev applies on merge, so its backlog can never exceed one and a bad migration
  # breaks dev in front of the person who wrote it. prod keeps the two-party
  # dispatch untouched -- it protects real money -- but prod DEPLOY now blocks
  # while prod has pending migrations, which is what makes the drift impossible
  # to carry silently.
  # ---------------------------------------------------------------------------
  target:
    runs-on: ubuntu-latest
    outputs:
      supabase_ref: ${{ steps.t.outputs.supabase_ref }}
      environment_name: ${{ steps.t.outputs.environment_name }}
    steps:
      - name: Resolve Supabase target for this branch
        id: t
        run: |
          # Same mapping the deploy job uses. Lifted into its own job so the
          # migration jobs can resolve the project WITHOUT depending on deploy
          # having already run -- that dependency is what forced the schema
          # check to happen after the code had shipped.
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "supabase_ref=lcdicqalreskibdfxkzb" >> "$GITHUB_OUTPUT"
            echo "environment_name=supabase-prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "supabase_ref=fzwmnzmtqidumdqjdddz" >> "$GITHUB_OUTPUT"
            echo "environment_name=supabase-dev" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Supabase deploys only run from 'prod' or 'dev' branches; got '${{ github.ref_name }}'"
            exit 1
          fi

      # OR-T1772. This step lives in `target` ON PURPOSE. apply-migrations declares
      # target in `needs`, so this summary is written BEFORE the environment pause.
      # Do not move it into apply-migrations: that job is paused while the approver is
      # looking at the run, so its summary would be written after the approval it was
      # meant to inform. It would look correct in review and be useless at the only
      # moment it matters.
      # run-name carries the same value on one line and the UI truncates it. This is
      # what carries the whole block.
      # THE LOAD-BEARING FACT: it is target having NO `environment:` binding of its own,
      # and no `if:`, that makes this summary arrive BEFORE the pause. The needs edge
      # alone does not do it. If a future change binds target to an environment, this
      # carrier silently moves to after the approval it exists to inform and nothing
      # here will fail to warn you.
      # OR-T1801. A missing reason already fails loud, below. A PRESENT but
      # worthless one ("x", "redeploy", yesterday's reason pasted forward) was
      # unguarded: nothing checked it named an actual restore point, so the
      # step summary looked identical whether the reason was real or junk.
      # This must run BEFORE the environment pause, same reasoning as the
      # summary step below: an approver at the pause needs the refusal to
      # have already fired, not to discover it after clicking approve.
      # Checked on SHAPE (a parseable date/time), never on exact wording, so
      # this does not silently stop firing the next time the message is
      # reworded. A redeploy (apply_migrations false) needs no restore point
      # and is untouched.
      - name: Refuse an apply-migrations dispatch with no restore point in its reason
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true
        env:
          RUN_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          # A restore point is a UTC-shaped date, optionally with a time, so
          # this looks for that shape rather than an exact sentence:
          # 2026-09-04 or 2026-09-04T00:00 or 2026-09-04T00:00:00Z all count.
          CANDIDATE="$(printf '%s' "${RUN_REASON}" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}([T ][0-9]{2}:[0-9]{2}(:[0-9]{2})?Z?)?' | head -n1 || true)"
          if [ -z "${CANDIDATE}" ] || ! date -u -d "${CANDIDATE}" >/dev/null 2>&1 || [ "${#RUN_REASON}" -lt 20 ]; then
            echo "::error title=No restore point in the reason::apply_migrations is true but the reason input carries no parseable UTC timestamp. A restore point is the backup age an approver checks this dispatch against, and 'x', 'redeploy', or a reason pasted forward from a previous run all look identical to a real one without this check. State the restore point you are relying on, for example: 'restore point 2026-09-04T00:00:00Z, redeploying after a cancelled run.'"
            exit 1
          fi
          echo "Reason carries a parseable restore point (${CANDIDATE}) and is ${#RUN_REASON} character(s) long. Proceeding."

      - name: Publish the restore point where the approver can read it
        env:
          # Read through env, never interpolated into the script body: a dispatch input
          # is attacker-controlled text and ${{ }} substitution happens before the shell
          # parses the line.
          RUN_REASON: ${{ inputs.reason }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
        run: |
          {
            echo "## Restore point for the approver"
            echo ""
            echo "Target project: ${{ steps.t.outputs.supabase_ref }} (environment ${{ steps.t.outputs.environment_name }})"
            echo "Event: ${{ github.event_name }} on ${{ github.ref_name }}"
            echo "Dispatching actor: ${{ github.actor }}"
            echo "This summary was written at (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "(that is when this step ran, not when the run was created; the two differ by queue time)"
            echo ""
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Apply migrations requested: ${APPLY_MIGRATIONS:-false}"
              echo ""
              if [ -n "${RUN_REASON}" ]; then
                echo "Reason input, verbatim:"
                echo ""
                echo '```text'
                printf '%s\n' "${RUN_REASON}"
                echo '```'
              else
                echo "NO REASON WAS GIVEN, so there is no restore point on this run."
                echo "An approver has nothing here to check a backup age against and should reject."
              fi
            else
              echo "This run is a push, not a dispatch, so there is no reason input and no restore point was supplied."
              echo "A push can never turn apply_migrations on."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # OR-T1801. The step above makes a MISSING reason loud. It does nothing about a
      # reason that is present and worthless, which is the likelier failure: "x", or
      # "redeploy", or yesterday's reason pasted forward, all produce a summary that is
      # structurally identical to a correct one, so an approver cannot tell them apart.
      #
      # The predicate is written to a file HERE, proven able to refuse and able to pass
      # against synthetic reasons, and then reused verbatim by the guard step below. A
      # checker re-typed in the step that uses it is a checker nobody proved. This runs
      # on every run of this workflow, pushes included, so the guard cannot rot into
      # something that only ever says yes.
      #
      # It tests SHAPE, not wording, on purpose. The refusal sentence carried inside the
      # reason input will be reworded, and a guard matching that sentence would quietly
      # stop firing when it was. The floor is a timestamp a machine can parse, an explicit
      # UTC marker, and enough text to be a restore point rather than a word.
      - name: "Self-test: prove the restore point check can refuse and can pass"
        run: |
          set -uo pipefail
          CHECK="${RUNNER_TEMP}/restore-point-check.sh"
          cat > "$CHECK" <<'SH'
          #!/usr/bin/env bash
          # Reads a candidate reason on stdin.
          # exit 0: it carries a restore point. exit 1: it does not, and why is on stderr.
          REASON=$(cat)
          COLLAPSED=$(printf '%s' "$REASON" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')
          MIN_CHARS=40
          if [ "${#COLLAPSED}" -lt "$MIN_CHARS" ]; then
            echo "the reason is ${#COLLAPSED} characters long; a restore point needs at least ${MIN_CHARS}" >&2
            exit 1
          fi
          STAMP=$(printf '%s' "$COLLAPSED" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}[T ][0-9]{2}:[0-9]{2}(:[0-9]{2})?' | head -n 1)
          if [ -z "$STAMP" ]; then
            echo "no timestamp shaped like YYYY-MM-DDTHH:MM appears anywhere in the reason" >&2
            exit 1
          fi
          if ! date -u -d "$STAMP" >/dev/null 2>&1; then
            echo "the timestamp '${STAMP}' is not a real date and time" >&2
            exit 1
          fi
          if ! printf '%s' "$COLLAPSED" | grep -Eq '(UTC|utc|[0-9]Z|\+00:?00)'; then
            echo "the reason names no timezone; write the restore point in UTC (a trailing Z, the word UTC, or +00:00)" >&2
            exit 1
          fi
          exit 0
          SH
          chmod +x "$CHECK"

          refuses () {
            if printf '%s' "$2" | bash "$CHECK" 2>/dev/null; then
              echo "::error::self-test failed: ${1} was accepted as a restore point"
              exit 1
            fi
            echo "refused, correctly: ${1}"
          }

          accepts () {
            if ! printf '%s' "$2" | bash "$CHECK"; then
              echo "::error::self-test failed: ${1} was refused, and it does carry a restore point"
              exit 1
            fi
            echo "accepted, correctly: ${1}"
          }

          refuses "an empty reason" ""
          refuses "a one word reason" "redeploy"
          refuses "a long reason carrying no timestamp at all" "re-running this because the earlier deploy was cancelled by a merge train and the assets never shipped"
          refuses "a timestamp with no timezone on it" "newest completed backup 2026-09-03 10:47, catalogue read 2026-09-03 11:05, 41 migrations, forward only"
          refuses "a timestamp that is not a real date and time" "newest completed backup 2026-13-45T99:99Z, catalogue read 2026-13-45T99:99Z UTC, forward only, no undo"
          accepts "the shape a prod dispatch is asked to carry" "APPROVE ONLY IF THE CLOCK NOW READS BEFORE 2026-09-03T16:47 UTC. LATER THAN THAT, REJECT. 41 migrations, forward only, no undo. Newest COMPLETED backup 2026-09-03T10:47Z, catalogue read 2026-09-03T11:05Z."
          accepts "the same shape said in completely different words" "no undo on this batch. the restore point is the backup at 2026-09-03T10:47:00+00:00, catalogue read 2026-09-03T11:05:00+00:00."

          echo "the restore point check refused 5 worthless reasons and accepted 2 good ones"

      # OR-T1801. This refusal fires HERE, in target, and not in apply-migrations, for the
      # same reason the summary above lives here: target has no environment binding of its
      # own, so it runs BEFORE the supabase-prod pause. A refusal evaluated inside the
      # paused job would be evaluated after the approval it exists to prevent.
      # apply_migrations false is untouched: a redeploy writes to no database and needs no
      # restore point. A push is untouched too, because a push cannot set this input.
      - name: Refuse an apply whose reason carries no restore point
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations }}
        env:
          # Read through env, never interpolated into the script body, for the same reason
          # as the step above: a dispatch input is attacker-controlled text.
          RUN_REASON: ${{ inputs.reason }}
        run: |
          set -uo pipefail
          CHECK="${RUNNER_TEMP}/restore-point-check.sh"
          if [ ! -x "$CHECK" ]; then
            echo "::error::the restore point checker is missing, so this apply was never checked. Refusing rather than assuming."
            exit 1
          fi

          if WHY=$(printf '%s' "${RUN_REASON}" | bash "$CHECK" 2>&1); then
            echo "The reason input carries a restore point. Continuing to the environment pause."
            exit 0
          fi

          {
            echo ""
            echo "## :no_entry: Refused before the pause: this apply carries no restore point"
            echo ""
            echo "apply_migrations is ON and the reason input does not carry a restore point an"
            echo "approver could check a backup age against: ${WHY}."
            echo ""
            echo "Nothing was applied and nothing was deployed on this run."
            echo ""
            echo "Dispatch again with a reason naming, in UTC, the newest COMPLETED backup on the"
            echo "target project and when that catalogue was read. The shape:"
            echo ""
            echo '```text'
            echo "APPROVE ONLY IF THE CLOCK NOW READS BEFORE 2026-09-03T16:47 UTC. LATER THAN THAT, REJECT."
            echo "41 migrations, forward only, no undo. Newest COMPLETED backup 2026-09-03T10:47Z,"
            echo "catalogue read 2026-09-03T11:05Z."
            echo '```'
            echo ""
            echo "The check is on shape, not on wording: a timestamp a machine can parse, an"
            echo "explicit UTC marker, and more than 40 characters. Reword the sentence freely."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::apply_migrations is on and the reason input carries no restore point: ${WHY}. Nothing applied, nothing deployed."
          exit 1

  deploy:
    needs: [target, check-pending-migrations, check-rls-policy-baseline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      supabase_ref: ${{ steps.target.outputs.supabase_ref }}
      environment_name: ${{ steps.target.outputs.environment_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 24 (for Vite crypto.hash)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pick Supabase project for this branch
        id: sb
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "project_id=${{ vars.VITE_SUPABASE_PROJECT_ID_PROD }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_SUPABASE_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "project_id=${{ vars.VITE_SUPABASE_PROJECT_ID_DEV }}" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.VITE_SUPABASE_URL_DEV }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        # This workflow never uploads to Cloudflare Pages: Pages builds independently
        # from its own project. VITE_OR_STEALTH_ALLOWED_ORIGINS is NOT set here.
        # Sole source of truth for the stealth allowlist: the VITE_OR_STEALTH_ALLOWED_ORIGINS
        # env var on the Cloudflare Pages project.
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ steps.sb.outputs.project_id }}
          VITE_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.sb.outputs.key }}

      - name: Pick Supabase target for this branch
        id: target
        run: |
          # Two separate Supabase projects in the same testing org:
          #   prod -> lcdicqalreskibdfxkzb (orangerails_prod, api.orangerails.com)
          #   dev  -> fzwmnzmtqidumdqjdddz (orangerails_dev,  api.orangerails.dev)
          #
          # Until 2026-06-21 the dev path pointed at the prod project too, which
          # meant a dev deploy would ship un-merged edge functions and migrations
          # straight to production. Earlier on 2026-06-21 the dev path was first
          # set to gposxxmxenrdvewrprle, which is NOT this repo's dev project at
          # all: it is orange-world-prod, the production database for a sibling
          # product that lives in the same Supabase team. The owner had already
          # caught this exact ref-confusion on 2026-06-18 and corrected it in the
          # predecessor workflow pages-deploy.yml (see commit b55636e: "was
          # pointing at OWM PROD by mistake, would clobber it on next dev push");
          # when pages-deploy.yml was replaced by this supabase-deploy.yml the
          # wrong ref was reintroduced. The correct dev project is
          # fzwmnzmtqidumdqjdddz, the orangerails_dev workspace. Each branch now
          # lands on its own Supabase project; promote dev -> prod through a PR to
          # graduate changes. NEVER let the dev arm here point at a project ref
          # outside this repo's two Supabase projects.
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "supabase_ref=lcdicqalreskibdfxkzb" >> "$GITHUB_OUTPUT"
            echo "environment_name=supabase-prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            echo "supabase_ref=fzwmnzmtqidumdqjdddz" >> "$GITHUB_OUTPUT"
            echo "environment_name=supabase-dev" >> "$GITHUB_OUTPUT"
          else
            # Refuse to deploy from any non-prod, non-dev branch. The earlier
            # "Pick Supabase project" step falls through to DEV creds for any
            # other branch; without this guard, a workflow_dispatch from a
            # feature branch would build a Pages bundle wired to DEV Supabase
            # but skip the edge-function and migration deploy (empty ref),
            # producing schema drift against whatever DEV currently runs.
            echo "::error::Supabase deploys only run from 'prod' or 'dev' branches; got '${{ github.ref_name }}'"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned deliberately. `latest` let the toolchain float under a
          # production deploy: the same commit could succeed or fail
          # depending on what upstream published that hour. Bump this on
          # purpose, in its own PR, after a dev deploy proves the version.
          # v3 resolves via npm, not the GitHub API, so GITHUB_TOKEN is no
          # longer needed and has been removed.
          version: 2.111.0

      - name: Deploy Supabase edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Determine which functions to deploy.
          # - workflow_dispatch: always deploy all (may be a manual hotfix).
          # - Force push or fresh branch (before == 000...): cannot diff; deploy all.
          # - Any _-prefixed shared directory changed (_shared, _lib, etc.): deploy all.
          # - git diff fails for any reason: fail closed, deploy all.
          # - Otherwise: only deploy functions whose directory changed and still exists.
          BEFORE="${{ github.event.before }}"
          # Directories only. `ls` also returns plain files that live in this
          # directory, and a file name is not a valid Supabase function name.
          ALL_FUNCS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -v '^_' | sort || true)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            DEPLOY_FUNCS="$ALL_FUNCS"
            echo "Full deploy (workflow_dispatch or force push): $(echo "$DEPLOY_FUNCS" | tr '\n' ' ')"
          else
            # The pathspec MUST include supabase/config.toml. The branch below
            # tests $CHANGED for it, and a diff limited to supabase/functions/
            # can never produce that path: the test was unreachable, and a push
            # touching only config.toml produced an empty $CHANGED, skipped the
            # deploy and exited 0 green having shipped nothing.
            if ! CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'supabase/functions/' 'supabase/config.toml'); then
              DEPLOY_FUNCS="$ALL_FUNCS"
              echo "git diff failed; falling back to full deploy: $(echo "$DEPLOY_FUNCS" | tr '\n' ' ')"
            elif echo "$CHANGED" | grep -qE 'supabase/functions/_[^/]+/|supabase/config\.toml'; then
              DEPLOY_FUNCS="$ALL_FUNCS"
              echo "Shared directory or config changed; redeploying all functions: $(echo "$DEPLOY_FUNCS" | tr '\n' ' ')"
            else
              DEPLOY_FUNCS=$(echo "$CHANGED" | grep -oP 'supabase/functions/\K[^/]+' | grep -v '^_' | sort -u || true)
              # Skip any function directory deleted in this push.
              DEPLOY_FUNCS=$(echo "$DEPLOY_FUNCS" | while IFS= read -r func; do
                [ -n "$func" ] && [ -d "supabase/functions/$func" ] && echo "$func"
              done || true)
              echo "Targeted deploy: $(echo "$DEPLOY_FUNCS" | tr '\n' ' ')"
            fi
          fi

          if [ -z "$DEPLOY_FUNCS" ]; then
            echo "No edge functions changed; skipping deploy"
            exit 0
          fi

          # Deploy each function with retry on esm.sh 522 errors.
          # Continue past individual failures so all functions are attempted
          # and the log names every function that failed, not just the first.
          FAILED_FUNCS=""
          for FUNC in $DEPLOY_FUNCS; do
            DEPLOYED=false
            for attempt in 1 2 3; do
              # The CLI truncates its own errors and tells you to rerun with
              # --debug, which is impossible after the fact in CI. Run only the
              # LAST attempt with --debug: a transient retry stays quiet, and a
              # real failure names the key or path it choked on. Actions masks
              # registered secrets in the log.
              DEBUG_FLAG=""
              if [ "$attempt" -eq 3 ]; then DEBUG_FLAG="--debug"; fi
              if supabase functions deploy "$FUNC" --project-ref ${{ steps.target.outputs.supabase_ref }} --import-map supabase/functions/import_map.json $DEBUG_FLAG; then
                echo "$FUNC deployed on attempt $attempt"
                DEPLOYED=true
                break
              fi
              if [ $attempt -eq 3 ]; then
                echo "::error::$FUNC failed after 3 attempts"
                FAILED_FUNCS="${FAILED_FUNCS} ${FUNC}"
              else
                echo "attempt $attempt for $FUNC failed; sleeping 15s and retrying"
                sleep 15
              fi
            done
          done

          if [ -n "$FAILED_FUNCS" ]; then
            echo "::error::Functions that failed to deploy:${FAILED_FUNCS}"
            exit 1
          fi


  check-pending-migrations:
    needs: [target, check-duplicate-migrations, apply-migrations]
    # Runs BEFORE the deploy job, not after it. deploy declares
    # needs: [target, check-pending-migrations], so when this job exits 1 the
    # deploy is SKIPPED and code cannot ship ahead of its schema. That is the
    # inverse of the old arrangement, where this job ran after deploy and was
    # deliberately non-blocking. It is still NOT in branch-protection required
    # checks, so it never prevents a merge on its own; what it prevents is the
    # deploy that would otherwise follow that merge.
    #
    # `if: always()` with no result condition is deliberate: apply-migrations is
    # SKIPPED on every prod push, and a skipped dependency would otherwise cancel
    # this job. A skipped check-run renders NEUTRAL, not red, so a run that never
    # looked at the schema would read exactly like a run that found it clean.
    # Reporting UNKNOWN out loud costs one extra red; staying silent costs a
    # migration nobody notices.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check pending DB migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_REF: ${{ needs.target.outputs.supabase_ref }}
          APPLY_RESULT: ${{ needs['apply-migrations'].result }}
          DUPES_RESULT: ${{ needs['check-duplicate-migrations'].result }}
        run: |
          set -uo pipefail

          # One helper for every "we could not find out" exit. UNKNOWN and
          # PENDING are different facts and must never share a message: the
          # first means go and look, the second means go and apply.
          unknown () {
            {
              echo "## :grey_question: Drift state UNKNOWN on \`${SUPABASE_REF:-unresolved}\`"
              echo ""
              echo "$1"
              echo ""
              echo "This is **not** a report that migrations are pending, and **not** a"
              echo "report that the schema is clean. The check could not determine the"
              echo "state. Re-run it, or read the schema directly, before promoting."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::drift state UNKNOWN on ${SUPABASE_REF:-unresolved}: $1"
            exit 1
          }

          # apply-migrations is 'skipped' on every prod push (by design) and on a
          # dispatch without the box ticked. Both are fine -- this job then simply
          # reports what is pending and blocks the deploy. A 'failure' is different:
          # the apply ran and did not finish, so the schema is in an unknown state.
          if [ "${APPLY_RESULT}" = "failure" ] || [ "${APPLY_RESULT}" = "cancelled" ]; then
            unknown "apply-migrations ended '${APPLY_RESULT}'. Some migrations may have applied and some not; the schema state is not known from here."
          fi
          if [ -z "${SUPABASE_REF}" ]; then
            unknown "The target job produced no supabase_ref output."
          fi

          MIG_DIR="supabase/migrations"
          if [ ! -d "$MIG_DIR" ]; then
            echo "no migrations directory; nothing pending"
            exit 0
          fi

          # Two files sharing a version prefix make this report structurally
          # blind. The ledger holds ONE row per version, so once either file is
          # recorded the `grep -qx` below matches for BOTH and the other is
          # counted as applied forever -- no red, on any project, ever. That is
          # not a drift report failing, it is a drift report that cannot see.
          #
          # The comparison itself no longer lives here. It lived here until
          # OR-T1189, and this job declares needs: [..., apply-migrations], so it
          # could only ever announce a collision that the apply had already
          # resolved by silently skipping one of the two files. It is now
          # check-duplicate-migrations, which apply-migrations needs, so a
          # colliding pair stops the apply rather than describing it afterwards.
          # What remains here is the consequence for THIS report: if that check
          # did not pass, this comparison cannot see, and it must say so.
          if [ "${DUPES_RESULT}" != "success" ]; then
            unknown "check-duplicate-migrations ended '${DUPES_RESULT}'. Until every migration file has its own version, the ledger cannot distinguish a file that was applied from one that was shadowed by a namesake, so the comparison below cannot see drift. That job's summary names the colliding files."
          fi

          PAYLOAD=$(mktemp); chmod 600 "$PAYLOAD"
          trap 'rm -f "$PAYLOAD"' EXIT
          jq -n '{query:"SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;"}' > "$PAYLOAD"

          # --fail-with-body, not bare -sS. Without it curl exits 0 on a 401,
          # 403 or 500: the retry loop breaks on the first attempt, the error
          # body parses as valid JSON, `.[].version` over an object yields
          # nothing, APPLIED comes back empty, and every migration on disk is
          # then reported PENDING. A stale token produced a confident, specific,
          # wrong answer that was indistinguishable from total drift.
          RESPONSE=""
          HTTP_OK=0
          for attempt in 1 2 3; do
            if RESPONSE=$(curl -sS --fail-with-body \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@$PAYLOAD"); then
              HTTP_OK=1
              break
            fi
            echo "migration query attempt ${attempt}/3 did not return a success status"
            # An `if`, not `[ "$attempt" -lt 3 ] && sleep 10`. GitHub Actions
            # invokes every plain `run:` block as `bash -e` by default, whether
            # or not the script also declares its own `set`; this step's
            # `set -uo pipefail` above adds -u and pipefail, it does not clear
            # -e. An AND-list left dangling at the end of a loop is how a
            # different job's retry (the migration classifier, CI run
            # 33637547005) silently died mid-attempt with no summary written
            # (OR-T1536). This `if` cannot fail the same way.
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          # The response body is not echoed. On an auth failure it is the only
          # place a token-shaped string could surface in a public build log.
          [ "$HTTP_OK" -eq 1 ] || unknown "The Supabase Management API did not return a success status after 3 attempts. Most often an expired or rotated SUPABASE_ACCESS_TOKEN, or the project being paused."

          # A success status is still not a usable answer until the shape is
          # right. Only an array of rows can be trusted to mean "these are the
          # versions that are applied"; anything else is an unknown, not a zero.
          if ! echo "$RESPONSE" | jq -e 'type == "array"' >/dev/null 2>&1; then
            unknown "The migration query returned a success status but not a JSON array of rows."
          fi
          APPLIED=$(echo "$RESPONSE" | jq -r '.[].version' | sort -u)

          PENDING=0
          PENDING_NAMES=""
          for FILE in $(ls "$MIG_DIR"/*.sql 2>/dev/null | sort); do
            BASENAME=$(basename "$FILE")
            VERSION="${BASENAME%%_*}"
            if [ -n "$APPLIED" ] && echo "$APPLIED" | grep -qx "$VERSION"; then
              continue
            fi
            echo "PENDING on ${SUPABASE_REF}: ${BASENAME}"
            PENDING_NAMES="${PENDING_NAMES}- \`${BASENAME}\`\n"
            PENDING=$((PENDING + 1))
          done

          echo
          echo "${PENDING} migration(s) pending on ${SUPABASE_REF}."
          if [ "$PENDING" -gt 0 ]; then
            {
              echo "## :warning: ${PENDING} unapplied migration(s) on \`${SUPABASE_REF}\`"
              echo ""
              echo ":no_entry: **The deploy is blocked.** Edge functions have NOT shipped."
              echo ""
              echo "Code is not allowed to ship ahead of its schema (DL-1640). Apply these first."
              echo ""
              printf '%b' "${PENDING_NAMES}"
              echo ""
              echo "Schema is **out of sync**. Nothing was applied by this run."
              echo ""
              echo "| env | who applies |"
              echo "| --- | --- |"
              echo "| dev | DBA applies and verifies |"
              echo "| prod | two-party: founder + CTO |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${PENDING} migration(s) not applied on ${SUPABASE_REF} -- DEPLOY BLOCKED. On prod, apply via workflow_dispatch with apply_migrations=true (two-party). On dev this means the automatic apply did not run or did not finish."
            exit 1
          else
            echo "Schema in sync on ${SUPABASE_REF}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check anon EXECUTE grants on public functions
        # Runs even when the migration check above exited 1. Steps default to
        # if: success(), so on a target already carrying a migration backlog,
        # the target this check is most wanted on, it produced no answer at all.
        # The job is red either way, but "no answer" and "clean" must never look
        # the same.
        if: always()
        # DEV-0238 / DL-1661 / DEV-0226. A default-privilege row (ours or a
        # platform role's) can hand the anonymous role EXECUTE on a function
        # the moment it is created in schema public. We hold no membership in
        # supabase_admin, so no migration we own can prevent that row; this is
        # the detection DEV-0226 decided on, running automatically instead of
        # depending on someone remembering a cadence.
        #
        # Zero rows is PASS. Grantor-agnostic on purpose: filtering by grantor
        # is what made 20260825120000's assertion unable to see the platform
        # row at all.
        #
        # OR-T0946: it was NOT grantee-agnostic, and that is why it could print
        # a success line on a database that had anon-executable functions in it.
        # Three routes reach the same privilege and only one of them puts the
        # string "anon" in the ACL text:
        #   1. anon=X/owner   anon named directly. The only case the old
        #                     LIKE 'anon=%' predicate could see.
        #   2. =X/owner       PUBLIC, which renders with an EMPTY grantee, and
        #                     PUBLIC includes anon. Read live on the dev project
        #                     2026-08-31: one function in schema public in
        #                     exactly this shape, and the old predicate returned
        #                     zero rows for it.
        #   3. proacl IS NULL no ACL row at all, so the built-in default applies,
        #                     which for a function is EXECUTE to PUBLIC.
        #                     unnest() over NULL yields no rows, so no text match
        #                     can ever reach this one. Read live 2026-08-31: all
        #                     3,257 pg_catalog functions with a NULL proacl
        #                     answer true to has_function_privilege('anon', oid,
        #                     'EXECUTE').
        # has_function_privilege() asks what this check actually means to ask,
        # can the anonymous role call this, and covers all three routes plus role
        # membership. The ACL text is still reported, for the reader. If the anon
        # role did not exist the function would error, the request would not
        # return 2xx, and the step would report UNKNOWN rather than a clean pass.
        # That is deliberate: a query that cannot run must be loud.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_REF: ${{ needs.target.outputs.supabase_ref }}
          ALLOWLIST: ${{ vars.ANON_EXECUTE_RPC_ALLOWLIST }}
        run: |
          set -uo pipefail

          # Same shape as the migration check above, duplicated rather than
          # shared because each `run:` block is its own shell process. A query
          # that could not run must exit non-zero with a distinct message and
          # never read as a pass -- that matters more here than on the
          # migration check, because EMPTY is the pass condition for this one.
          unknown () {
            {
              echo "## :grey_question: anon-EXECUTE check UNKNOWN on \`${SUPABASE_REF:-unresolved}\`"
              echo ""
              echo "$1"
              echo ""
              echo "This is **not** a report that a function is anon-executable, and **not**"
              echo "a report that the surface is clean. The check could not determine the"
              echo "state. Re-run it, or read pg_proc directly, before promoting."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::anon-EXECUTE check state UNKNOWN on ${SUPABASE_REF:-unresolved}: $1"
            exit 1
          }

          if [ -z "${SUPABASE_REF}" ]; then
            unknown "The target job produced no supabase_ref output."
          fi

          PAYLOAD=$(mktemp); chmod 600 "$PAYLOAD"
          SQL_FILE=$(mktemp); chmod 600 "$SQL_FILE"
          trap 'rm -f "$PAYLOAD" "$SQL_FILE"' EXIT

          # Written to a file and handed to jq -Rs rather than escaped inline.
          # The inline single-quote escaping this replaced made the predicate
          # unreadable, and an unreadable predicate is how the PUBLIC case
          # survived review in the first place.
          cat > "$SQL_FILE" <<'SQL'
          SELECT n.nspname AS nspname,
                 p.proname AS proname,
                 CASE
                   WHEN p.proacl IS NULL
                     THEN 'null-acl-default-public'
                   WHEN EXISTS (SELECT 1 FROM unnest(p.proacl) a WHERE a::text LIKE 'anon=%')
                     THEN 'anon-direct'
                   WHEN EXISTS (SELECT 1 FROM unnest(p.proacl) a WHERE a::text LIKE '=%')
                     THEN 'bare-public'
                   ELSE 'role-membership'
                 END AS reason,
                 coalesce(array_to_string(p.proacl, ','), '(no acl row)') AS ace
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
           WHERE n.nspname = 'public'
             AND has_function_privilege('anon', p.oid, 'EXECUTE')
           ORDER BY p.proname;
          SQL
          jq -Rs '{query:.}' < "$SQL_FILE" > "$PAYLOAD"

          # --fail-with-body, not bare -sS: without it curl exits 0 on a 401,
          # 403 or 500, the error body parses as valid JSON, row extraction
          # yields nothing, and an auth failure reads as a clean pass.
          RESPONSE=""
          HTTP_OK=0
          for attempt in 1 2 3; do
            if RESPONSE=$(curl -sS --fail-with-body \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@$PAYLOAD"); then
              HTTP_OK=1
              break
            fi
            echo "anon-EXECUTE query attempt ${attempt}/3 did not return a success status"
            # An `if`, not `[ "$attempt" -lt 3 ] && sleep 10`. Same reasoning as
            # check-pending-migrations above: this step's `set -uo pipefail`
            # does not clear the `-e` GitHub Actions already applies by default,
            # so a bare AND-list here can exit the step before the `unknown`
            # call right after this loop (OR-T1536).
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          # Response body not echoed on failure -- the one place a
          # token-shaped string could reach a public build log.
          [ "$HTTP_OK" -eq 1 ] || unknown "The Supabase Management API did not return a success status after 3 attempts. Most often an expired or rotated SUPABASE_ACCESS_TOKEN, or the project being paused."

          if ! echo "$RESPONSE" | jq -e 'type == "array"' >/dev/null 2>&1; then
            unknown "The anon-EXECUTE query returned a success status but not a JSON array of rows."
          fi

          # Allowlist filter. Comma-separated, unqualified function names,
          # empty by default so today "any row is a regression" holds exactly
          # as DEV-0226 measured it.
          IFS=',' read -ra ALLOWED_ARR <<< "${ALLOWLIST}"
          ROWS=$(echo "$RESPONSE" | jq -r '.[] | "\(.nspname).\(.proname)\t\(.reason)\t\(.ace)"')

          # Name the ROUTE, not just the function. "anon holds a direct grant"
          # is the wrong sentence for a PUBLIC row: it sends the next reader
          # looking for an anon entry that is not in that ACL at all (OR-T0946).
          explain () {
            case "$1" in
              anon-direct)
                echo "anon is named directly in the function ACL" ;;
              bare-public)
                echo "PUBLIC holds EXECUTE (empty grantee, renders as \`=X/owner\`) and PUBLIC includes anon; there is NO anon entry in this ACL" ;;
              null-acl-default-public)
                echo "the function has no ACL row, so the built-in default applies and PUBLIC holds EXECUTE; there is NO anon entry in this ACL" ;;
              *)
                echo "anon reaches EXECUTE through role membership; read the ACL directly" ;;
            esac
          }

          OFFENDING=""
          ALLOWED_HIT=""
          while IFS=$'\t' read -r QUALIFIED REASON ACE; do
            [ -z "$QUALIFIED" ] && continue
            FUNC="${QUALIFIED#public.}"
            WHY=$(explain "$REASON")
            IS_ALLOWED=0
            for A in "${ALLOWED_ARR[@]}"; do
              TRIMMED=$(echo "$A" | tr -d '[:space:]')
              if [ -n "$TRIMMED" ] && [ "$TRIMMED" = "$FUNC" ]; then
                IS_ALLOWED=1
              fi
            done
            if [ "$IS_ALLOWED" -eq 1 ]; then
              ALLOWED_HIT="${ALLOWED_HIT}- \`${QUALIFIED}\` -- ${WHY} -- acl: \`${ACE}\` -- allowlisted via ANON_EXECUTE_RPC_ALLOWLIST\n"
            else
              OFFENDING="${OFFENDING}- \`${QUALIFIED}\` -- ${WHY} -- acl: \`${ACE}\`\n"
            fi
          done <<< "$ROWS"

          if [ -n "$ALLOWED_HIT" ]; then
            {
              echo "## :warning: anon-executable function(s) allowlisted on \`${SUPABASE_REF}\`"
              echo ""
              printf '%b' "$ALLOWED_HIT"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "allowlisted anon-executable function(s) present, named above; not failing the check for these"
          fi

          if [ -n "$OFFENDING" ]; then
            {
              echo "## :no_entry: anon-executable function(s) found in \`public\` on \`${SUPABASE_REF}\`"
              echo ""
              echo "The anonymous role can call these. Each line names the ROUTE by which it"
              echo "holds the privilege: named directly in the ACL, through PUBLIC (an empty"
              echo "grantee), or through no ACL row at all, where the built-in default hands"
              echo "EXECUTE to PUBLIC (DEV-0226/DEV-0238/OR-T0946)."
              echo ""
              echo "Revoke it explicitly, naming BOTH anon AND PUBLIC: revoking only anon"
              echo "leaves the PUBLIC entry behind and this check stays red, correctly."
              echo "Or add the function to the ANON_EXECUTE_RPC_ALLOWLIST repo variable, with"
              echo "a reason in the PR, if it is meant to stay public."
              echo ""
              printf '%b' "$OFFENDING"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::anon-executable function(s) found in schema public on ${SUPABASE_REF}. See step summary."
            exit 1
          fi

          echo "0 anon-executable function(s) in schema public on ${SUPABASE_REF} (outside the allowlist)."

  # ---------------------------------------------------------------------------
  # OR-T1340. RLS regresses the same silent way anon-EXECUTE grants do: a
  # migration drops or rewrites a policy and nothing throws, it just returns
  # rows (or denies them) to whoever asks next. This job diffs what
  # pg_policies actually reports on this branch's project against the
  # baseline captured from THAT project: rls-policy-baseline.dev.tsv or
  # rls-policy-baseline.prod.tsv, selected from the target job's resolved
  # environment. One file cannot describe two clusters -- measured
  # 2026-09-02, dev carries 67 policies in schema public and prod carries
  # 73 -- so a single baseline makes one project permanently red and the
  # obvious fix flips the failure to the other project. There is no
  # fallback to the other cluster's file: a resolved target with no
  # baseline is reported UNKNOWN and blocks the deploy, because measuring
  # prod against dev's expectations is worse than not measuring it.
  # A mismatch does not mean the change is wrong, it
  # means an intentional RLS edit must update the baseline in the SAME PR, so
  # the diff is reviewed rather than silently absorbed.
  #
  # SCOPE, stated so a green check is not read as more than it is: this
  # compares the POLICY SET. It does not assert that row level security is
  # switched ON, because pg_policies carries no relrowsecurity column and
  # lists a table's policies whether or not RLS is enabled. Disabling RLS on
  # a table changes not one byte of this baseline. That gap is tracked
  # separately (OR-T1601) and is not closed here.
  #
  # Self-test runs first, against synthetic rows, and proves the diff can go
  # both red and green before the live comparison is trusted -- the same
  # discipline apply-migrations' own self-test uses. A script that can only
  # ever report "clean" is worse than no script.
  # ---------------------------------------------------------------------------
  check-rls-policy-baseline:
    # Needs apply-migrations, not just target: this job reads LIVE pg_policies,
    # so it must run after the migration that could have changed them has
    # actually applied, or it reads stale state and misses exactly the drift
    # it exists to catch. apply-migrations is 'skipped' on every prod push and
    # on a dispatch without the box ticked, and both are fine: nothing touched
    # the schema. A 'failure' or 'cancelled' means the schema state is not
    # known, so this check cannot trust what it reads either -- the compare
    # step takes that result as APPLY_RESULT and exits UNKNOWN on it.
    needs: [target, apply-migrations]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: "Self-test: prove the diff can go both red and green"
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT

          # Three synthetic policies, the same shape as a live baseline row,
          # so this exercises the real comparison rather than a stand-in.
          cat > "$WORKDIR/baseline.tsv" <<'TSV'
          public	demo_table	demo select	SELECT	{authenticated}	aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa	d41d8cd98f00b204e9800998ecf8427e
          public	demo_table	demo insert	INSERT	{authenticated}	d41d8cd98f00b204e9800998ecf8427e	bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          public	demo_table	demo update	UPDATE	{authenticated}	cccccccccccccccccccccccccccccccc	cccccccccccccccccccccccccccccccc
          TSV

          # GREEN: an identical set compares clean.
          cp "$WORKDIR/baseline.tsv" "$WORKDIR/live-clean.tsv"
          if ! diff -u "$WORKDIR/baseline.tsv" "$WORKDIR/live-clean.tsv" >/dev/null; then
            echo "::error::self-test failed: an identical policy set was reported as a diff"
            exit 1
          fi

          # RED: drop one policy, what a migration deleting a policy (by
          # accident or on purpose without updating the baseline) produces.
          grep -v 'demo update' "$WORKDIR/baseline.tsv" > "$WORKDIR/live-missing.tsv"
          if diff -u "$WORKDIR/baseline.tsv" "$WORKDIR/live-missing.tsv" >/dev/null; then
            echo "::error::self-test failed: a missing policy was reported as clean"
            exit 1
          fi

          # RED: change one hash, what a migration rewriting a policy's
          # USING/WITH CHECK expression without renaming it produces.
          sed 's/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/00000000000000000000000000000000/' \
            "$WORKDIR/baseline.tsv" > "$WORKDIR/live-changed.tsv"
          if diff -u "$WORKDIR/baseline.tsv" "$WORKDIR/live-changed.tsv" >/dev/null; then
            echo "::error::self-test failed: a changed policy expression was reported as clean"
            exit 1
          fi

          # RED: an extra policy live that the baseline does not carry, what a
          # migration ADDING a policy without updating the baseline produces.
          # This is the third drift class named in OR-T1340 and the one the
          # first version of this self-test never exercised.
          cp "$WORKDIR/baseline.tsv" "$WORKDIR/live-extra.tsv"
          printf 'public\tdemo_table\tdemo delete\tDELETE\t{authenticated}\teeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee\td41d8cd98f00b204e9800998ecf8427e\n' >> "$WORKDIR/live-extra.tsv"
          if diff -u "$WORKDIR/baseline.tsv" "$WORKDIR/live-extra.tsv" >/dev/null; then
            echo "::error::self-test failed: a policy present live and absent from the baseline was reported as clean"
            exit 1
          fi

          # RED: same policy name and expressions, different cmd. A migration
          # that drops and recreates a policy under the same name but a wider
          # command (SELECT becoming ALL) changes neither hash, so the cmd
          # column is the only thing that can catch it.
          sed 's/SELECT/ALL/' "$WORKDIR/baseline.tsv" > "$WORKDIR/live-cmd.tsv"
          if diff -u "$WORKDIR/baseline.tsv" "$WORKDIR/live-cmd.tsv" >/dev/null; then
            echo "::error::self-test failed: a policy whose cmd widened was reported as clean"
            exit 1
          fi

          # RED: same policy name, cmd and expressions, different roles.
          # Widening {authenticated} to include anon is the drift that actually
          # exposes data to the public, and it too leaves both hashes untouched.
          sed 's/{authenticated}/{authenticated,anon}/' \
            "$WORKDIR/baseline.tsv" > "$WORKDIR/live-roles.tsv"
          if diff -u "$WORKDIR/baseline.tsv" "$WORKDIR/live-roles.tsv" >/dev/null; then
            echo "::error::self-test failed: a policy whose roles widened to include anon was reported as clean"
            exit 1
          fi

          echo "self-test passed: the diff goes red on a removed policy, red on an added policy, red on a changed expression, red on a widened cmd, red on widened roles, and green on a match"

      - name: Compare live RLS policies to the committed baseline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ needs.target.outputs.supabase_ref }}
          ENVIRONMENT_NAME: ${{ needs.target.outputs.environment_name }}
          APPLY_RESULT: ${{ needs['apply-migrations'].result }}
        run: |
          set -uo pipefail

          # One helper for every "we could not find out" exit, the same shape
          # check-pending-migrations uses. UNKNOWN and DRIFT are different
          # facts and must never share a message: the first means go and look,
          # the second means a policy actually changed.
          unknown () {
            {
              echo "## :grey_question: RLS policy state UNKNOWN on \`${SUPABASE_PROJECT_REF:-unresolved}\`"
              echo ""
              echo "$1"
              echo ""
              echo "This is **not** a report that the policy set matches its baseline, and"
              echo "**not** a report that it drifted. The check could not determine the"
              echo "state. Re-run it, or read pg_policies directly, before promoting."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::rls-policy-baseline state UNKNOWN on ${SUPABASE_PROJECT_REF:-unresolved}: $1"
            exit 1
          }

          # apply-migrations is 'skipped' on every prod push (by design) and on
          # a dispatch without the box ticked. Both are fine: nothing touched
          # the schema, so what pg_policies reports can be trusted. A 'failure'
          # or 'cancelled' is different -- some migrations may have applied and
          # some not -- and a match read off a half-applied database proves
          # nothing while rendering as a green check.
          if [ "${APPLY_RESULT}" = "failure" ] || [ "${APPLY_RESULT}" = "cancelled" ]; then
            unknown "apply-migrations ended '${APPLY_RESULT}'. Some migrations may have applied and some not, so the live policy set cannot be compared to anything."
          fi

          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            unknown "The target job produced no supabase_ref output."
          fi

          # One baseline per CLUSTER, selected from the RESOLVED target. An
          # explicit case, not string surgery on the environment name, so an
          # environment nobody has mapped is a loud error rather than a
          # filename that merely happens not to exist.
          case "${ENVIRONMENT_NAME}" in
            supabase-dev)  BASELINE="supabase/rls-policy-baseline.dev.tsv" ;;
            supabase-prod) BASELINE="supabase/rls-policy-baseline.prod.tsv" ;;
            *) unknown "No RLS baseline is mapped for environment '${ENVIRONMENT_NAME:-unresolved}' (project ${SUPABASE_PROJECT_REF}). Add its baseline file and a case for it; do not point this check at another cluster's baseline." ;;
          esac

          if [ ! -f "$BASELINE" ]; then
            unknown "No baseline file for the resolved target: ${BASELINE} does not exist in this branch. Capture it from ${SUPABASE_PROJECT_REF} and commit it. There is deliberately no fallback to the other cluster's file: the two policy sets differ, so that fallback would report a confident wrong answer."
          fi

          LIVE=$(mktemp)
          trap 'rm -f "$LIVE"' EXIT

          if ! node scripts/generate-rls-policy-baseline.mjs --stdout > "$LIVE"; then
            echo "::error::rls-policy-baseline state UNKNOWN: could not fetch the live policy set from ${SUPABASE_PROJECT_REF}. See the script's own error above; it never echoes the token."
            exit 1
          fi

          BASELINE_COUNT=$(wc -l < "$BASELINE")
          LIVE_COUNT=$(wc -l < "$LIVE")
          # The third number is the point. "N in baseline" and "N read live"
          # alone let two different outcomes print the same pair: 67 and 67
          # reads as a match even when a policy was renamed, because one row
          # left and another arrived. COMPARED counts the rows that are
          # byte-identical in both files, so on a clean run all three are equal
          # and any gap is the size of the drift.
          COMPARED=$(comm -12 <(sort "$BASELINE") <(sort "$LIVE") | wc -l)
          echo "${BASELINE_COUNT} in baseline, ${LIVE_COUNT} read live from ${SUPABASE_PROJECT_REF}, ${COMPARED} identical in both -- comparing."

          if ! diff -u "$BASELINE" "$LIVE" > /tmp/rls-diff.txt; then
            {
              echo "## :no_entry: RLS policy drift on \`${SUPABASE_PROJECT_REF}\`"
              echo ""
              echo "The live \`pg_policies\` set does not match \`${BASELINE}\`, the baseline"
              echo "captured from this cluster."
              echo "A policy was added, removed, or its USING/WITH CHECK expression changed"
              echo "without the baseline being updated in the same PR (OR-T1340)."
              echo ""
              echo '```diff'
              cat /tmp/rls-diff.txt
              echo '```'
              echo ""
              echo "If this change is intentional, regenerate THIS cluster's baseline in this"
              echo "PR. Regenerate the file named below and no other: the other cluster has a"
              echo "different policy set, and pointing its baseline at this project is what"
              echo "makes the two take turns being red."
              echo '```'
              echo "SUPABASE_ACCESS_TOKEN=... SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_REF} \\"
              echo "  node scripts/generate-rls-policy-baseline.mjs ${BASELINE}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::RLS policy drift detected on ${SUPABASE_PROJECT_REF}. See step summary for the diff."
            exit 1
          fi

          echo "RLS policy set on ${SUPABASE_PROJECT_REF} matches ${BASELINE} (${BASELINE_COUNT} policies). This compares the POLICY SET only; it does not assert that RLS is enabled on any table."

  # ---------------------------------------------------------------------------
  # OR-T1189. This comparison used to live inside check-pending-migrations, and
  # that job needs apply-migrations, so the check ran AFTER the apply it should
  # have gated. By the time it could go red the shadowed file had already been
  # skipped against a real database. The check was correct; it was downstream of
  # the only thing it could have protected.
  #
  # It needs nothing but a checkout: no database, no secrets, no environment, no
  # output from target. That is why there was never a reason for it to run late,
  # and why it can gate the apply without slowing anything down.
  # ---------------------------------------------------------------------------
  check-duplicate-migrations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refuse two migration files sharing a version prefix
        run: |
          set -uo pipefail

          MIG_DIR="supabase/migrations"
          if [ ! -d "$MIG_DIR" ]; then
            echo "no migrations directory; nothing to compare"
            exit 0
          fi

          DUPES=$(ls "$MIG_DIR"/*.sql 2>/dev/null | sed 's|.*/||' | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            {
              echo "## :rotating_light: Duplicate migration version(s)"
              echo ""
              for V in $DUPES; do
                echo "\`${V}\` is used by more than one file:"
                echo ""
                ls "$MIG_DIR"/${V}_*.sql 2>/dev/null | sed 's|.*/|- `|; s|$|`|'
                echo ""
              done
              echo "\`supabase_migrations.schema_migrations\` stores one row per"
              echo "version, so at most one of these can ever be tracked and the"
              echo "rest are reported as applied whether they ran or not. Rename"
              echo "the later file to an unused timestamp."
              echo ""
              echo "apply-migrations needs this job, so nothing has been applied"
              echo "on this run. Rename the file and push again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::duplicate migration version(s): $(echo "$DUPES" | tr '\n' ' ')-- refusing to apply; one of these files would be recorded and the rest treated as applied without running."
            exit 1
          fi

          echo "no duplicate migration version(s) in $MIG_DIR"

  apply-migrations:
    # needs check-duplicate-migrations, not just target. A colliding pair of
    # filenames makes this job's own record of what it did untrue: the ledger
    # holds ONE row per version, so it applies one file, records that version,
    # and treats the namesake as already applied on every future run. The if:
    # below is a plain expression rather than always(), so a failed need skips
    # this job outright instead of the condition re-enabling it (OR-T1189).
    needs: [target, check-duplicate-migrations]
    # A PUSH TO DEV REACHES THIS JOB. That is the whole change: dev applies its
    # own migrations at merge time, so the dev backlog is always 0 or 1 and prod
    # promotion is a batch that has already run once on a real database.
    #
    # prod is UNCHANGED and still cannot be reached by a push: it needs an explicit
    # workflow_dispatch with the box ticked, the GitHub Environment reviewers, and
    # the actor allowlist below. Deploying code and rewriting a production schema
    # stay different acts with different blast radii.
    if: >-
      ${{ (github.event_name == 'push' && github.ref_name == 'dev')
          || (github.event_name == 'workflow_dispatch' && inputs.apply_migrations) }}
    runs-on: ubuntu-latest
    # environment: binds this job to a GitHub Environment whose required-reviewer list
    # is set in repo Settings -> Environments. prod dispatches bind to supabase-prod
    # (configure required reviewers there); dev dispatches bind to supabase-dev (open
    # for DBA applies). The environment name is resolved from the deploy job output so
    # the right project is always protected. Add reviewers to supabase-prod in repo
    # Settings -> Environments once this PR merges -- the job will pause for approval
    # before any steps run.
    environment: ${{ needs.target.outputs.environment_name }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Actor allowlist gate (per target, no inheritance)
        # SKIPPED on the automatic dev push, deliberately. On a dispatch the actor is
        # a person and the allowlist is the control. On a push to dev the actor is
        # whoever merged, and the control is the reviewed PR that reached dev at all --
        # requiring a second per-person allowlist there would reintroduce exactly the
        # human bottleneck that produced the 37-migration backlog. This never loosens
        # prod: prod cannot be reached by a push, so prod always takes the branch below.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # Fallback gate. The primary gate is meant to be the required-reviewer list on
        # the GitHub Environment this job binds to; until reviewers are configured on
        # supabase-prod, this step is the only thing standing in front of the prod
        # database, so it must not be looser than the prod path deserves.
        #
        # ONE allowlist per target, resolved from the environment the deploy job
        # computed. There is deliberately NO fallback from prod to dev: a single shared
        # variable meant that adding a login so it could apply on dev also let it
        # rewrite production in one dispatch.
        #
        # Set both in repo Settings -> Variables, comma-separated GitHub login names:
        #   MIGRATION_APPLY_ALLOWED_ACTORS_DEV    (dev project)
        #   MIGRATION_APPLY_ALLOWED_ACTORS_PROD   (prod project)
        # Either one absent or empty fails closed on that path only.
        env:
          TARGET_ENV: ${{ needs.target.outputs.environment_name }}
          ALLOWED_DEV: ${{ vars.MIGRATION_APPLY_ALLOWED_ACTORS_DEV }}
          ALLOWED_PROD: ${{ vars.MIGRATION_APPLY_ALLOWED_ACTORS_PROD }}
          ACTOR: ${{ github.actor }}
        run: |
          set -uo pipefail
          case "$TARGET_ENV" in
            supabase-prod)
              ALLOWED="$ALLOWED_PROD"
              VAR_NAME="MIGRATION_APPLY_ALLOWED_ACTORS_PROD"
              ;;
            supabase-dev)
              ALLOWED="$ALLOWED_DEV"
              VAR_NAME="MIGRATION_APPLY_ALLOWED_ACTORS_DEV"
              ;;
            *)
              echo "::error::Unrecognised apply target '$TARGET_ENV'. Refusing apply."
              exit 1
              ;;
          esac

          if [ -z "$ALLOWED" ]; then
            echo "::error::$VAR_NAME is not set. Configure it in Settings -> Variables before applying to $TARGET_ENV."
            exit 1
          fi

          MATCHED=0
          IFS=',' read -ra LIST <<< "$ALLOWED"
          for A in "${LIST[@]}"; do
            TRIMMED=$(echo "$A" | tr -d '[:space:]')
            if [ -n "$TRIMMED" ] && [ "$TRIMMED" = "$ACTOR" ]; then
              MATCHED=1
            fi
          done

          if [ "$MATCHED" -ne 1 ]; then
            echo "::error::Actor '$ACTOR' is not on $VAR_NAME. Refusing apply on $TARGET_ENV."
            exit 1
          fi
          echo "Actor '$ACTOR' is on $VAR_NAME. Proceeding on $TARGET_ENV."

      - name: Apply pending DB migrations via Management API
        # The Supabase CLI's db push requires a linked project + DB password we do not
        # have in CI. The Management API SQL endpoint
        # (POST /v1/projects/{ref}/database/query) auths with SUPABASE_ACCESS_TOKEN and
        # does NOT need the DB password. We track applied versions in
        # supabase_migrations.schema_migrations the same way supabase db push would, so
        # manual recovery via the CLI later stays clean.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_REF: ${{ needs.target.outputs.supabase_ref }}
        run: |
          set -euo pipefail
          MIG_DIR="supabase/migrations"
          if [ ! -d "$MIG_DIR" ]; then
            echo "no migrations directory; skipping"
            exit 0
          fi

          # Fetch already-applied versions.
          #
          # This is the SAME call the drift report makes, and it is hardened the
          # same way, for the opposite reason. Bare `curl -sS` exits 0 on a 401,
          # 403 or 500: the error body parses as valid JSON, `.[].version` over
          # an object yields nothing, and APPLIED comes back EMPTY. In the drift
          # report an empty APPLIED is a false red claiming total drift, which is
          # noisy and harmless. HERE an empty APPLIED means the loop below finds
          # no version in the set, treats EVERY .sql file in supabase/migrations
          # as unapplied, and replays the whole migration history against the
          # target project. On a prod dispatch that target is the production
          # database. So an unreadable ledger must ABORT, never proceed: the
          # applied set is UNKNOWN, and UNKNOWN is not the same fact as empty.

          # -------------------------------------------------------------------
          # OR-T2141. THE LEDGER SHAPE RULE, IN ONE PLACE, PROVEN BEFORE IT IS
          # RELIED ON.
          #
          # The rule below decides whether a success status may be read as "these
          # are the applied versions". It lives in ONE function because the real
          # path and the self-test must call the same code: a second copy is a
          # rule that can drift, and then the thing demonstrated is not the thing
          # that runs. Same standard as the shadow-scan and order-guard
          # self-tests further down in this step.
          #
          # WHAT THIS COVERS AND WHAT IT DOES NOT. It proves the SHAPE branch: a
          # 2xx body that is not a JSON array of rows aborts instead of being
          # read as an empty ledger. It does NOT exercise the curl branch
          # (--fail-with-body, retry exhaustion). That branch is reviewed and not
          # demonstrated, and it is written down that way rather than counted as
          # coverage.
          # -------------------------------------------------------------------
          ledger_shape_ok () {
            printf '%s' "$1" | jq -e 'type == "array"' >/dev/null 2>&1
          }

          # refuses <fn> <payload> is true when <fn> REJECTS the payload. It is a
          # helper rather than an inline negation so the block below can prove its
          # own negative assertions are able to fire.
          refuses () { ! "$1" "$2"; }

          # A rule that accepts everything, used ONLY to prove the must-be-red
          # assertions are live. If refuses cannot tell this apart from the real
          # rule, every negative line below is decorative and proves nothing.
          ledger_shape_always_ok () { return 0; }

          LEDGER_ST_FAIL=0
          if ! ledger_shape_ok '[{"version":"20260822031500","name":"x"}]'; then
            echo "::error::ledger shape self-test FAILED: a JSON array of rows was refused, so a healthy ledger response would abort the apply."
            LEDGER_ST_FAIL=1
          fi
          if ! ledger_shape_ok '[]'; then
            echo "::error::ledger shape self-test FAILED: an empty JSON array was refused. An empty ledger is a legitimate answer on a fresh project and must be readable as zero applied versions."
            LEDGER_ST_FAIL=1
          fi
          if ! refuses ledger_shape_ok '{"message":"Unauthorized"}'; then
            echo "::error::ledger shape self-test FAILED: a JSON object was accepted as a ledger. That is the exact defect this guard exists for: .[].version over an object yields nothing, APPLIED comes back empty, and every file in the tree is treated as unapplied."
            LEDGER_ST_FAIL=1
          fi
          if ! refuses ledger_shape_ok '{"error":{"code":500,"message":"internal error"}}'; then
            echo "::error::ledger shape self-test FAILED: an API error body was accepted as a ledger."
            LEDGER_ST_FAIL=1
          fi
          if ! refuses ledger_shape_ok 'not json at all'; then
            echo "::error::ledger shape self-test FAILED: a body that is not JSON was accepted as a ledger."
            LEDGER_ST_FAIL=1
          fi
          if ! refuses ledger_shape_ok ''; then
            echo "::error::ledger shape self-test FAILED: an empty body was accepted as a ledger."
            LEDGER_ST_FAIL=1
          fi
          if refuses ledger_shape_always_ok '{"message":"Unauthorized"}'; then
            echo "::error::ledger shape self-test HARNESS FAILED: a rule that accepts everything was reported as refusing an object, so the must-be-red assertions above cannot fire and prove nothing."
            LEDGER_ST_FAIL=1
          fi
          if [ "$LEDGER_ST_FAIL" -ne 0 ]; then
            echo "::error::APPLY ABORTED on ${SUPABASE_REF}: the ledger response shape rule does not behave as required, so the applied-version set cannot be trusted even if the query succeeds. NOTHING was applied."
            exit 1
          fi
          echo "ledger shape self-test ok: array accepted, empty array accepted, object refused, error body refused, non-JSON refused, empty body refused, and the negative assertions shown able to fire."

          PAYLOAD=$(mktemp); chmod 600 "$PAYLOAD"
          trap 'rm -f "$PAYLOAD"' EXIT
          jq -n '{query:"SELECT version, name FROM supabase_migrations.schema_migrations ORDER BY version;"}' > "$PAYLOAD"

          RESPONSE=""
          HTTP_OK=0
          for attempt in 1 2 3; do
            if RESPONSE=$(curl -sS --fail-with-body \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@$PAYLOAD"); then
              HTTP_OK=1
              break
            fi
            echo "ledger query attempt ${attempt}/3 did not return a success status"
            # An `if`, not `[ "$attempt" -lt 3 ] && sleep 10`. This step
            # declares `set -euo pipefail`, so -e is explicit here, but the
            # drift step (check-pending-migrations) is under -e too: GitHub
            # Actions runs every plain `run:` block as `bash -e` by default,
            # and that step's `set -uo pipefail` does not clear it. Both steps
            # now use this `if` shape for the same reason (OR-T1536).
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          # The response body is deliberately NOT echoed on any failure path. On
          # an auth failure it is the only place a token-shaped string could
          # reach a public build log.
          if [ "$HTTP_OK" -ne 1 ]; then
            echo "::error::APPLY ABORTED on ${SUPABASE_REF}: the Supabase Management API did not return a success status for the migration ledger after 3 attempts. The applied-version set is UNKNOWN, so NOTHING was applied. Most often an expired or rotated SUPABASE_ACCESS_TOKEN, or the project being paused."
            exit 1
          fi

          # A success status is still not a usable answer until the shape is
          # right. Only a JSON array of rows can be trusted to mean "these are
          # the versions that are applied"; anything else is UNKNOWN, not zero.
          # This calls the SAME ledger_shape_ok the self-test above ran over
          # synthetic payloads, so what was demonstrated is what runs (OR-T2141).
          if ! ledger_shape_ok "$RESPONSE"; then
            echo "::error::APPLY ABORTED on ${SUPABASE_REF}: the migration ledger query returned a success status but not a JSON array of rows. The applied-version set is UNKNOWN, so NOTHING was applied."
            exit 1
          fi

          APPLIED=$(echo "$RESPONSE" | jq -r '.[].version' | sort -u)
          echo "-- already applied versions on ${SUPABASE_REF} --"
          echo "$APPLIED" | tail -10
          echo

          # -------------------------------------------------------------------
          # OR-T1252. SHADOW SCAN, before anything is applied.
          #
          # "Applied" in this loop means "a row with that version number exists",
          # never "this file ran". So a file can be merged, deployed and reported
          # clean on every check while its SQL has never executed anywhere:
          # rename a migration, or revert and re-add it under a different name,
          # and the loop below finds its version already in the ledger and skips
          # it, on this run and on every future run. check-duplicate-migrations
          # cannot see this, because it compares the tree with itself and there
          # is exactly one file.
          #
          # The ledger carries a name column, so the shadow IS detectable: the
          # version is recorded under one file name and the tree carries another.
          # Rows written before this workflow started recording names have a NULL
          # name and cannot be compared. Those are counted and reported as
          # UNVERIFIABLE and are never folded into the pass count, because "I
          # could not check" is not the same fact as "I checked and it was fine".
          # -------------------------------------------------------------------
          LEDGER_MAP=$(mktemp); chmod 600 "$LEDGER_MAP"
          echo "$RESPONSE" | jq -r '.[] | "\(.version)=\(.name // "")"' | sort -u > "$LEDGER_MAP"

          shadow_scan() {
            local map="$1" files="$2"
            local base version fname ledger_line ledger_name
            local checked=0 matched=0 unverifiable=0 mismatched=0
            while IFS= read -r base; do
              [ -n "$base" ] || continue
              version="${base%%_*}"
              fname="${base#*_}"; fname="${fname%.sql}"
              ledger_line=$(grep -m1 "^${version}=" "$map" || true)
              [ -n "$ledger_line" ] || continue
              checked=$((checked + 1))
              ledger_name="${ledger_line#*=}"
              if [ -z "$ledger_name" ]; then
                unverifiable=$((unverifiable + 1))
              elif [ "$ledger_name" = "$fname" ]; then
                matched=$((matched + 1))
              else
                mismatched=$((mismatched + 1))
                echo "  x SHADOWED: ${base} -- version ${version} is recorded in the ledger under the name '${ledger_name}'. This file has never run against ${SUPABASE_REF} and never will."
              fi
            done <<< "$files"
            echo "SHADOW SCAN: ${checked} already-recorded file(s) compared, ${matched} name-matched, ${unverifiable} unverifiable (ledger row predates name recording), ${mismatched} shadowed."
            [ "$mismatched" -eq 0 ]
          }

          # The scan must be able to go RED. Run it first over a synthetic pair
          # with a known shadow and a known match, and refuse to apply if the
          # detector does not behave both ways. A comparison that silently checks
          # nothing would otherwise read exactly like a clean tree.
          ST_MAP=$(mktemp); chmod 600 "$ST_MAP"
          printf '%s\n' '20990101000000=add_thing' '20990101000001=fine' > "$ST_MAP"
          if shadow_scan "$ST_MAP" '20990101000000_add_thing_properly.sql' >/dev/null 2>&1; then
            rm -f "$ST_MAP" "$LEDGER_MAP"
            echo "::error::shadow-scan self-test FAILED: the detector did not fire on a file that IS shadowed. Refusing to apply, because a check that cannot go red proves nothing."
            exit 1
          fi
          if ! shadow_scan "$ST_MAP" '20990101000001_fine.sql' >/dev/null 2>&1; then
            rm -f "$ST_MAP" "$LEDGER_MAP"
            echo "::error::shadow-scan self-test FAILED: the detector fired on a file whose name matches the ledger. Refusing to apply."
            exit 1
          fi
          rm -f "$ST_MAP"
          echo "shadow-scan self-test ok: fires on a mismatch, silent on a match."

          TREE_FILES=$(ls "$MIG_DIR" 2>/dev/null | grep -E '\.sql$' | sort || true)
          if [ -z "$TREE_FILES" ]; then
            echo "SHADOW SCAN: no .sql files in $MIG_DIR to compare."
          elif ! shadow_scan "$LEDGER_MAP" "$TREE_FILES"; then
            rm -f "$LEDGER_MAP"
            echo "::error::APPLY ABORTED on ${SUPABASE_REF}: one or more migration files carry a version that the ledger recorded under a DIFFERENT file name. Those files have never run and never will, because a version already in the ledger is skipped. Give each one a new, unused version timestamp and push again. NOTHING was applied on this run."
            exit 1
          fi
          rm -f "$LEDGER_MAP"
          echo

          # -------------------------------------------------------------------
          # OR-T1481 / OR-T1431 / OR-T0419. ORDER GUARD, before anything is applied.
          #
          # The loop below selects pending files by pure set difference against
          # the ledger: a file runs if its version is not already in APPLIED.
          # Nothing compares it against the HIGHEST applied version. Version
          # order is a total order only WITHIN one apply run and says nothing
          # across runs, so a file numbered below everything already applied
          # still runs the first time it appears, against a database that is
          # already past it. An absolute REVOKE, a DROP IF EXISTS, or an UPDATE
          # whose WHERE clause a later migration changed all succeed and quietly
          # undo later work. An allow-list assertion cannot catch that, because
          # it only fires on a privilege that IS present.
          #
          # Refuse unless acknowledged. Applying an older file is sometimes
          # right (a branch cut before a merge), so refusing outright would
          # block legitimate work, and a warning in a log nobody reads is not a
          # control. The file itself must carry, on a line of its own:
          #
          #   -- OUT-OF-ORDER-OK: <reason>
          #
          # The line has to start at column one and the reason has to be
          # non-empty. An empty marker is refused on purpose: a token people
          # paste in without thinking is worse than no token, because it reads
          # as a decision when none was made.
          #
          # OR-T0419 / OR-T2139. This guard and the "order scan" built in
          # parallel under OR-T0419 were the same control at the same anchor
          # and they disagreed on the escape hatch: this one refuses unless
          # acknowledged, that one refused outright. Two blocks would have made
          # the acknowledged path unreachable and left no in-band way to apply
          # an older file at all. There is ONE guard here and it keeps the
          # acknowledged path. Three properties from the order scan are folded
          # in because they are strictly better:
          #
          #   1. UNCOMPARABLE IS FATAL. A version with a non-numeric prefix was
          #      named and then skipped, folded into neither count, so it
          #      escaped the ordering check entirely. It now aborts. "I could
          #      not check" must never read as "I checked and it was fine".
          #   2. SAME WIDTH. A numeric version of a different width from the
          #      ledger's is uncomparable too: lexicographic order stops meaning
          #      chronological order the moment the widths differ.
          #   3. The already-applied skip lives INSIDE the function, so a
          #      self-test can cover it (OR-T2134). It is the most damaging line
          #      here to lose: if a version already in the ledger ever stops
          #      being recognised, every historical file reads as pending, most
          #      of them number below the max, and the apply halts for ever on
          #      BOTH environments.
          #
          # Dev, 2026-08-24, the case that started OR-T0419:
          # 20260824120000_schedule_or_webhook_dispatch.sql merged first and
          # applied; 20260824105000_mark_pre_cutoff_webhook_backlog_dead.sql
          # merged about forty minutes later with a LOWER version and had not.
          # The second file's header states it must run before the schedule
          # exists. The schedule was live and its safety migration had never
          # run. Nothing broke only because the table held zero rows.
          # -------------------------------------------------------------------
          # OR-T2147. ONE-TIME allowlist: the 29 versions already merged and
          # applied on dev before this guard existed, that sort at or below
          # prod's applied maximum and carry no in-file OUT-OF-ORDER-OK marker.
          # Without this the guard aborts the very next prod promotion on all
          # 29 and stays aborted, because none of them can retroactively earn
          # a marker for a question the guard did not exist to ask when they
          # were written. This is an explicit list of version strings, not a
          # date cutoff and not a wildcard: an amnesty that can silently grow
          # is a hole. Captured 2026-09-04 from the OR-T1431 ruling note (dba,
          # 2026-09-04 10:37 UTC), reproducible as a set difference between
          # dev's and prod's supabase_migrations.schema_migrations filtered to
          # <= prod's applied max at capture time (20260822031500). Anything
          # merged after this list was written is not covered and must carry
          # its own marker like every other file.
          OUT_OF_ORDER_ALLOWLIST="20260713120001 20260716120001 20260717123000 20260721120000 20260722000001 20260722130000 20260722140000 20260723120000 20260723210000 20260724180000 20260730000000 20260730120000 20260730120001 20260730200000 20260802120000 20260803000000 20260803120000 20260803140000 20260803160000 20260803190000 20260804000000 20260804000001 20260804090000 20260804140000 20260806100000 20260809130000 20260815000001 20260817230000 20260819120000"

          out_of_order_scan () {
            local applied="$1" files="$2" dir="$3" allowlist="${4:-$OUT_OF_ORDER_ALLOWLIST}"
            local max base version reason below=0 unmarked=0 allowlisted=0 unknown=0 skipped=0 examined=0
            local applied_rows=0 max_label
            # The highest applied version comes from the SAME set this function
            # is filtering with, so the guard can never judge one read of the
            # ledger while the apply loop runs against another.
            max=$(printf '%s\n' "$applied" | grep -E '^[0-9]+$' | sort | tail -1 || true)
            # OR-T2152. max is the maximum of the applied set FILTERED to
            # numeric versions, so an empty max has TWO causes and they are not
            # the same fact: an empty ledger, or a ledger holding rows of which
            # not one is numeric. Count the rows themselves, unfiltered, so the
            # two can be told apart below. Without this the second case passed
            # every pending file with no comparison at all while reporting
            # "none applied", which is I-could-not-check reading as I-checked-
            # and-it-was-fine, inside the guard written to end exactly that.
            applied_rows=$(printf '%s\n' "$applied" | grep -c '[^[:space:]]' || true)
            while IFS= read -r base; do
              [ -n "$base" ] || continue
              version="${base%%_*}"
              # Already in the ledger, so it is not pending and the loop below
              # will skip it. This is the SAME expression that loop uses, which
              # is what makes the guard judge exactly the set that will run: it
              # cannot pass a file the loop would apply, nor fire on one the
              # loop would skip.
              #
              # OR-T2152. That identity is the property, not the flags. grep -qx
              # treats the version as a regular expression rather than a fixed
              # string; both sites do, so they agree. If either is ever changed
              # to grep -Fqx, BOTH must change in the same edit, or the guard
              # starts judging a different set of files than the loop applies.
              if printf '%s\n' "$applied" | grep -qx "$version"; then
                skipped=$((skipped + 1))
                continue
              fi
              examined=$((examined + 1))
              # An empty max is benign ONLY when the ledger is genuinely empty:
              # nothing has been applied, so nothing can be out of order. When
              # the ledger HAS rows and not one of them is numeric there is no
              # version to order against, the comparison below cannot be made at
              # all, and that is UNCOMPARABLE and therefore fatal, never a pass
              # (OR-T2152).
              if [ -z "$max" ]; then
                if [ "$applied_rows" -eq 0 ]; then
                  continue
                fi
                unknown=$((unknown + 1))
                echo "  ? UNCOMPARABLE: ${base} -- the ledger holds ${applied_rows} applied version(s) and not one of them is numeric, so there is no highest applied version to order against."
                continue
              fi
              # A version this cannot compare is FATAL, not skipped. Two ways it
              # happens: a non-numeric prefix, and a numeric prefix of a
              # different width from the ledger's, where lexicographic order
              # stops meaning chronological order (OR-T0419).
              if ! printf '%s' "$version" | grep -qE '^[0-9]+$' || [ "${#version}" -ne "${#max}" ]; then
                unknown=$((unknown + 1))
                echo "  ? UNCOMPARABLE: ${base} -- version '${version}' cannot be ordered against the highest applied version ${max}. Same-width numeric timestamps are what makes filename order mean chronological order."
                continue
              fi
              [[ "$version" < "$max" ]] || continue
              below=$((below + 1))
              # OR-T2147. Checked BEFORE the marker read, so a pre-guard file
              # with no marker at all still passes, silently, exactly once.
              if printf '%s\n' $allowlist | grep -qx "$version"; then
                allowlisted=$((allowlisted + 1))
                echo "  ~ OUT-OF-ORDER, allowlisted (OR-T2147, one-time amnesty for pre-guard merges): ${base} (version ${version}) sorts below ${max}."
                continue
              fi
              # The first marker line decides. If its reason is empty the file
              # is refused rather than reading on for a better one further down:
              # what a reader sees first must be what counts.
              reason=$(sed -n 's/^--[[:space:]]*OUT-OF-ORDER-OK:[[:space:]]*//p' "${dir}/${base}" 2>/dev/null | head -1 || true)
              reason="${reason%"${reason##*[![:space:]]}"}"
              if [ -n "$reason" ]; then
                echo "  ~ OUT-OF-ORDER, acknowledged: ${base} (version ${version}) sorts below the highest applied version ${max}: ${reason}"
              else
                unmarked=$((unmarked + 1))
                echo "  x OUT-OF-ORDER: ${base} (version ${version}) sorts BELOW the highest applied version ${max} and carries no '-- OUT-OF-ORDER-OK: <reason>' line, at column one, with a non-empty reason, and is not on the OR-T2147 allowlist."
              fi
            done <<< "$files"
            # OR-T2152. Say WHICH of the two empty-max cases this run was. A
            # ledger with rows but no numeric version must not print "none
            # applied": that reads as a clean empty database when it is in fact
            # a state this guard cannot order anything against.
            if [ -n "$max" ]; then
              max_label="$max"
            elif [ "$applied_rows" -eq 0 ]; then
              max_label="none applied"
            else
              max_label="none comparable (${applied_rows} applied version(s), not one numeric)"
            fi
            echo "ORDER SCAN: highest applied version ${max_label}, ${skipped} already-applied file(s) skipped, ${examined} unapplied file(s) examined, ${below} numbered below it, ${allowlisted} allowlisted (OR-T2147), ${unmarked} of the rest unacknowledged, ${unknown} uncomparable."
            [ "$unmarked" -eq 0 ] && [ "$unknown" -eq 0 ]
          }

          # The guard must be able to go RED, and to stay silent for every
          # reason it should. Same standard as the shadow-scan self-test above:
          # run the REAL function over synthetic files with known answers and
          # refuse to apply if it does not behave every way. A second copy of
          # the rule would pass for ever while the rule itself was edited away.
          # A check nobody has watched fail proves nothing, and this repo has
          # been bitten by exactly that.
          ST_DIR=$(mktemp -d)
          ST_APPLIED=$(printf '%s\n' '20990101000000' '20990101000005')
          printf '%s\n' 'select 1;' > "${ST_DIR}/20990101000000_already_applied.sql"
          printf '%s\n' 'select 1;' > "${ST_DIR}/20990101000002_below_unmarked.sql"
          printf '%s\n' '-- OUT-OF-ORDER-OK: synthetic self-test, a branch cut before the merge' 'select 1;' > "${ST_DIR}/20990101000003_below_marked.sql"
          printf '%s\n' '-- OUT-OF-ORDER-OK:' 'select 1;' > "${ST_DIR}/20990101000004_below_empty_marker.sql"
          printf '%s\n' 'select 1;' > "${ST_DIR}/20990101000009_in_order.sql"
          printf '%s\n' 'select 1;' > "${ST_DIR}/2099010100000X_notanumber.sql"
          printf '%s\n' 'select 1;' > "${ST_DIR}/209901010000091_toowide.sql"
          printf '%s\n' 'select 1;' > "${ST_DIR}/20990101000001_below_allowlisted.sql"

          if out_of_order_scan "$ST_APPLIED" '20990101000002_below_unmarked.sql' "$ST_DIR" >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: the guard stayed silent on a pending file numbered BELOW the ledger max carrying no marker. Refusing to apply, because a check that cannot go red proves nothing."
            exit 1
          fi
          if out_of_order_scan "$ST_APPLIED" '20990101000004_below_empty_marker.sql' "$ST_DIR" >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: the guard accepted an OUT-OF-ORDER-OK marker with nothing after the colon. Refusing to apply: an empty marker is a token pasted in with no decision behind it."
            exit 1
          fi
          if out_of_order_scan "$ST_APPLIED" '2099010100000X_notanumber.sql' "$ST_DIR" >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: a version with no numeric prefix was reported as fine. I-could-not-check must never read as clean."
            exit 1
          fi
          if out_of_order_scan "$ST_APPLIED" '209901010000091_toowide.sql' "$ST_DIR" >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: a version of a different width from the ledger's was compared as though lexicographic order meant chronological order. Refusing to apply."
            exit 1
          fi
          if ! out_of_order_scan "$ST_APPLIED" '20990101000003_below_marked.sql' "$ST_DIR" >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: the guard fired on an older file that carries a valid OUT-OF-ORDER-OK marker with a reason. Refusing to apply."
            exit 1
          fi
          if ! out_of_order_scan "$ST_APPLIED" '20990101000009_in_order.sql' "$ST_DIR" >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: the guard fired on a file numbered ABOVE the ledger max. Refusing to apply."
            exit 1
          fi
          # OR-T2134. The already-applied skip is the most damaging line in this
          # function to lose, and until now nothing exercised it. 20990101000000
          # is in the applied set AND numbers below the max, so it would be
          # counted as behind, unacknowledged, the moment the skip stopped
          # recognising a version the ledger already carries.
          if ! out_of_order_scan "$ST_APPLIED" '20990101000000_already_applied.sql' "$ST_DIR" >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: a version already present in the applied set was not skipped, so a migration the apply loop will never run was judged as pending. Refusing to apply."
            exit 1
          fi
          # OR-T2147. An allowlisted version with NO marker at all must be
          # silent: this is the earn-it-once path the allowlist exists for,
          # tested with a synthetic allowlist passed as the 4th arg so the
          # real OUT_OF_ORDER_ALLOWLIST is never touched by the self-test.
          # OR-T2170: the fixture version here MUST sort below ST_APPLIED's
          # max (20990101000005), or it never reaches the allowlist branch
          # at all and passes for the wrong reason. That is exactly what
          # 20990101000006 did before this fix: 6 is not below 5, so it took
          # the in-order short-circuit and the allowlist check was never run.
          if ! out_of_order_scan "$ST_APPLIED" '20990101000001_below_allowlisted.sql' "$ST_DIR" '20990101000001' >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: the guard fired on a file whose version is on the allowlist, which needs no marker. Refusing to apply."
            exit 1
          fi
          # OR-T2170: prove the case above can actually fail. Pass a
          # synthetic allowlist that does NOT contain this file's version:
          # with no matching entry and no marker, the guard must report it
          # unmarked (non-silent), or this test can never go red.
          if out_of_order_scan "$ST_APPLIED" '20990101000001_below_allowlisted.sql' "$ST_DIR" '99999999999999' >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: the guard stayed silent on a file whose version is NOT on the synthetic allowlist passed in, so the allowlist-branch self-test cannot fail and proves nothing."
            exit 1
          fi
          # OR-T2152. A ledger holding rows of which NOT ONE is numeric leaves
          # the highest applied version empty, and an empty maximum used to pass
          # every pending file with no comparison at all. Neither environment
          # can reach that state today (dev 164 applied versions, prod 102, all
          # 14-digit numeric, read 2026-09-04), but a project restored from
          # nothing that applies one non-numeric filename lands there and the
          # guard is blind on it from then on. The synthetic applied set here is
          # non-numeric and the pending file is IN ORDER, so the only thing that
          # can make this go red is the missing comparison.
          ST_APPLIED_NONNUMERIC=$(printf '%s\n' 'baseline' 'seed_from_restore')
          if out_of_order_scan "$ST_APPLIED_NONNUMERIC" '20990101000009_in_order.sql' "$ST_DIR" >/dev/null 2>&1; then
            rm -rf "$ST_DIR"
            echo "::error::order self-test FAILED: the applied set held versions of which none was numeric, so there was no highest applied version to order against, and the guard passed a pending file anyway. Refusing to apply: I-could-not-check must never read as clean."
            exit 1
          fi
          rm -rf "$ST_DIR"
          echo "order self-test ok: red on an unmarked older file, red on an empty marker, red on a non-numeric version, red on a different-width version, red on an applied set holding no numeric version at all (OR-T2152), silent on a marked older file, silent on an in-order file, silent on a file already in the applied set, silent on an allowlisted file with no marker (OR-T2147), red on a non-matching synthetic allowlist (OR-T2170)."

          # The guard reads the ledger response already read above. NOT a
          # second API call: a second read could disagree with the set the loop
          # below actually applies against, and then the guard would be judging
          # a different database than the one being written to. It does its own
          # already-applied skip, with the same expression that loop uses, so
          # the two cannot select different files.
          if [ -n "$TREE_FILES" ] && ! out_of_order_scan "$APPLIED" "$TREE_FILES" "$MIG_DIR"; then
            echo "::error::APPLY ABORTED on ${SUPABASE_REF}: the order guard refused this run and NOTHING was applied. Two different things cause this and they have DIFFERENT remedies. (1) A pending file numbered BELOW the highest applied version named in the scan above, carrying no acknowledgement. It would run against a database already past it, where an absolute REVOKE, a DROP IF EXISTS or an UPDATE whose WHERE clause a later migration changed can silently undo later work. If that file has NEVER been applied in ANY environment, give it a new unused timestamp above the highest applied version. If it is ALREADY APPLIED somewhere else, DO NOT rename it: renaming changes its version, the environment that already ran it no longer finds that version in its ledger, and it applies the file a SECOND time, which is safe only if the migration is idempotent and nothing in this repo requires or checks that. For that case add a line at column one reading -- OUT-OF-ORDER-OK: followed by why applying it late is correct here. (2) A version the guard could not compare, listed above as UNCOMPARABLE. Give the file the same-width numeric timestamp prefix every other migration uses; I-could-not-check is never treated as clean. Do not switch this check off: filename order is a within-run property and cannot be a cross-run guarantee (OR-T0419, OR-T1481)."
            exit 1
          fi
          echo

          # For each migration file, apply if not in the applied set
          APPLIED_COUNT=0
          for FILE in $(ls "$MIG_DIR"/*.sql 2>/dev/null | sort); do
            BASENAME=$(basename "$FILE")
            VERSION="${BASENAME%%_*}"
            if echo "$APPLIED" | grep -qx "$VERSION"; then
              continue
            fi
            echo "-- applying ${BASENAME} --"

            SQL_PAYLOAD=$(mktemp); chmod 600 "$SQL_PAYLOAD"
            jq -Rs --arg q "$(cat "$FILE")" '{query:$q}' < /dev/null > "$SQL_PAYLOAD"
            CODE=$(curl -sS -o /tmp/mig.resp -w "%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@$SQL_PAYLOAD")
            rm -f "$SQL_PAYLOAD"

            if [[ ! "$CODE" =~ ^2 ]]; then
              echo "  x FAILED (HTTP $CODE): $(head -c 400 /tmp/mig.resp)"
              rm -f /tmp/mig.resp
              exit 1
            fi
            echo "  v SQL applied (HTTP $CODE)"

            # Record in schema_migrations, WITH the name of the file that ran.
            #
            # OR-T1252. Recording only the version is what lets a renamed or
            # re-added file be skipped for ever: the loop above treats a version
            # present in the ledger as applied, whatever file carried it. The
            # name column already exists and the Supabase CLI populates it; this
            # workflow never did, so every row it wrote was unverifiable. From
            # here on each row says which file ran and the shadow scan can
            # compare it against the tree.
            #
            # OR-T1254. The SQL is ALREADY APPLIED by the time we get here. If
            # the record does not land, the database carries the change and the
            # ledger does not know it, so the next run applies the same file
            # again. That is harmless only if the migration is idempotent, which
            # nothing in this repo requires or checks. So the write is retried,
            # then read back, and a total failure names the exact recovery
            # statement rather than only reporting that it failed.
            #
            # NOT merged into the apply call above as one multi-statement
            # request, deliberately: supabase/migrations contains CREATE INDEX
            # CONCURRENTLY and DROP INDEX CONCURRENTLY migrations
            # (20260715130000 and 20260716140000) and neither may run inside a
            # transaction block, so a combined request would make those files
            # impossible to apply at all.
            NAME="${BASENAME#*_}"; NAME="${NAME%.sql}"
            SQ="'"
            V_SQL="${VERSION//$SQ/$SQ$SQ}"
            N_SQL="${NAME//$SQ/$SQ$SQ}"
            REC_SQL="INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('${V_SQL}', '${N_SQL}') ON CONFLICT (version) DO UPDATE SET name = COALESCE(schema_migrations.name, EXCLUDED.name);"
            REC=$(mktemp); chmod 600 "$REC"
            jq -n --arg q "$REC_SQL" '{query:$q}' > "$REC"

            REC_OK=0
            REC_CODE=""
            for attempt in 1 2 3; do
              REC_CODE=$(curl -sS -o /tmp/mig.resp -w "%{http_code}" \
                -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary "@$REC")
              if [[ "$REC_CODE" =~ ^2 ]]; then
                REC_OK=1
                break
              fi
              echo "  ! ledger record attempt ${attempt}/3 returned HTTP ${REC_CODE}"
              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done
            rm -f "$REC"

            # The response body is deliberately not echoed on any failure path:
            # on an auth failure it is the only place a token-shaped string could
            # reach a public build log.
            if [ "$REC_OK" -ne 1 ]; then
              rm -f /tmp/mig.resp
              echo "::error::${BASENAME} WAS APPLIED to ${SUPABASE_REF} and could NOT be recorded in the ledger after 3 attempts (last HTTP ${REC_CODE}). The database carries this change and the ledger does not know it, so a re-run would apply the same file a second time. Record it by hand before re-running: INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('${VERSION}', '${NAME}') ON CONFLICT (version) DO UPDATE SET name = COALESCE(schema_migrations.name, EXCLUDED.name);"
              exit 1
            fi

            # A 2xx is the API accepting the call. It is not the row being there.
            RB=$(mktemp); chmod 600 "$RB"
            jq -n --arg q "SELECT count(*) AS n FROM supabase_migrations.schema_migrations WHERE version = '${V_SQL}';" '{query:$q}' > "$RB"
            RB_BODY=$(curl -sS -X POST "https://api.supabase.com/v1/projects/${SUPABASE_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@$RB" || true)
            rm -f "$RB"
            if ! echo "$RB_BODY" | jq -e '(.[0].n | tonumber) == 1' >/dev/null 2>&1; then
              rm -f /tmp/mig.resp
              echo "::error::${BASENAME} was applied to ${SUPABASE_REF} and the ledger write returned success, but reading it back did not find exactly one row for version ${VERSION}. Treat the ledger as NOT carrying this migration and record it by hand before re-running."
              exit 1
            fi
            rm -f /tmp/mig.resp
            echo "  v migration recorded in ledger and read back (version ${VERSION}, name ${NAME})"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
          done

          echo
          echo "-- ${APPLIED_COUNT} migration(s) applied this run --"

  # ---------------------------------------------------------------------------
  # DEV-0212, 2026-08-28. WHY THIS JOB EXISTS.
  #
  # supabase-deploy.yml failed on 8 consecutive runs on dev, from 2026-08-27
  # 00:55 UTC to 2026-08-28 00:07 UTC, about 23 hours. On every one of those runs
  # check-pending-migrations exited 1 and the deploy job was SKIPPED, by design,
  # so no edge function shipped to the dev project for a day across 8 merges.
  # Nothing raised a hand: no alert, no issue, no message. It was found only
  # because someone ran the checks on dev out of caution.
  #
  # The failure class is structurally invisible from a pull request:
  # apply-migrations and check-pending-migrations run ONLY on the push to the
  # branch, never on the PR, because the apply needs the real project. So no PR
  # gate can predict it, and check-pending-migrations is deliberately NOT a
  # required check, so a red branch never blocks the next merge. Seven more
  # merges landed on top of the first failure.
  #
  # IT MUST BE ABLE TO GO RED ITSELF. Every gh call below is checked and every
  # failure exits non-zero with an ::error:: annotation. There is deliberately no
  # `|| true` anywhere in it: a notifier that swallows its own errors is exactly
  # the silent-success shape it was written to end.
  #
  # KNOWN LIMIT, stated rather than hidden: this job lives inside the run it
  # reports on, so it cannot fire if the whole run is cancelled before it starts,
  # or if this file fails to parse. It covers job failure and a skipped deploy,
  # which is the failure that actually happened.
  # ---------------------------------------------------------------------------
  notify:
    needs: [target, apply-migrations, check-pending-migrations, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the deploy-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_TARGET: ${{ needs.target.result }}
          R_APPLY: ${{ needs['apply-migrations'].result }}
          R_GATE: ${{ needs['check-pending-migrations'].result }}
          R_DEPLOY: ${{ needs.deploy.result }}
        run: |
          set -uo pipefail

          # What counts as a failure worth waking someone for:
          #   any job failed or was cancelled -> the run did not do its work
          #   deploy skipped                  -> nothing shipped. deploy carries no
          #                                      `if:` of its own, so it can only be
          #                                      skipped when target or the migration
          #                                      gate refused it.
          # A deploy that ran and found no changed functions is a SUCCESS and is
          # deliberately not reported.
          REASONS=""
          for PAIR in "target:${R_TARGET}" "apply-migrations:${R_APPLY}" "check-pending-migrations:${R_GATE}" "deploy:${R_DEPLOY}"; do
            JOB="${PAIR%%:*}"
            RES="${PAIR##*:}"
            case "$RES" in
              failure|cancelled) REASONS="${REASONS}- \`${JOB}\` ended **${RES}**"$'\n' ;;
            esac
          done
          if [ "${R_DEPLOY}" = "skipped" ]; then
            REASONS="${REASONS}- \`deploy\` was **skipped**, so no edge function shipped to this branch's Supabase project."$'\n'
          fi

          TITLE="CI: Supabase deploy is failing on ${BRANCH}"

          if ! OPEN_NUM=$(gh issue list --repo "$REPO" --state open --limit 100 \
                --json number,title \
                --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty"); then
            echo "::error::could not list issues on ${REPO}; the deploy-failure notifier cannot report."
            exit 1
          fi

          if [ -z "$REASONS" ]; then
            echo "Every job succeeded on ${BRANCH}."
            if [ -n "$OPEN_NUM" ]; then
              RECOVERED="Recovered on \`${BRANCH}\` at \`${SHA}\`. Every job in this run succeeded and the deploy ran. ${RUN_URL}"
              if ! gh issue comment "$OPEN_NUM" --repo "$REPO" --body "$RECOVERED"; then
                echo "::error::could not comment on issue #${OPEN_NUM}."
                exit 1
              fi
              if ! gh issue close "$OPEN_NUM" --repo "$REPO"; then
                echo "::error::could not close issue #${OPEN_NUM}."
                exit 1
              fi
              echo "Closed #${OPEN_NUM} on recovery." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          {
            echo "## Deploy did NOT ship on \`${BRANCH}\`"
            echo ""
            printf '%s' "$REASONS"
          } >> "$GITHUB_STEP_SUMMARY"

          BODY=$(printf '%s\n' \
            "The Supabase deploy workflow did not ship on \`${BRANCH}\`." \
            "" \
            "Commit: \`${SHA}\`" \
            "Run: ${RUN_URL}" \
            "" \
            "What went wrong:" \
            "" \
            "${REASONS}" \
            "This issue is opened by the workflow itself on the first failed run and" \
            "closed by the first run that recovers." \
            "" \
            "While it is open, assume edge functions on this branch's Supabase project" \
            "are BEHIND the branch. The deploy ships only the functions changed since" \
            "the previous push, so a later green run does not backfill the pushes that" \
            "were skipped while this was red.")

          if [ -n "$OPEN_NUM" ]; then
            if ! gh issue comment "$OPEN_NUM" --repo "$REPO" --body "$BODY"; then
              echo "::error::could not comment on issue #${OPEN_NUM}; the failure is NOT reported."
              exit 1
            fi
            echo "Updated #${OPEN_NUM}." >> "$GITHUB_STEP_SUMMARY"
          else
            if ! NEW=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"); then
              echo "::error::could not open an issue on ${REPO}; the failure is NOT reported."
              exit 1
            fi
            echo "Opened ${NEW}." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Exit non-zero on purpose. A green notify job sitting under a red run
          # reads as "something handled it"; it did not, the deploy still has not
          # shipped.
          echo "::error::deploy did not ship on ${BRANCH}; see the tracking issue."
          exit 1
