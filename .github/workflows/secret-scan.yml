name: Secret scan

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned release binary, not the vendor action: the check must behave
      # the same on every run, on a fork, and without depending on any
      # external account state.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans the working tree, not just the diff: a secret that predates this
      # gate must not be able to launder itself through a rebase or a move.
      # --redact keeps the finding out of the log; CI logs here are public.
      - name: Scan working tree
        run: |
          gitleaks detect \
            --no-git \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

      - name: What to do if this failed
        if: failure()
        run: |
          echo "A credential pattern was found in the tree."
          echo "Do not push a fix that only deletes the line: assume the value is burned and rotate it."
          echo "If this is a false positive, add a narrow allowlist entry to .gitleaks.toml in this PR."
