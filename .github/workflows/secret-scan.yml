name: Secret scan

on:
  # DELIBERATELY UNFILTERED, see the long note in ci.yml (DEV-0283): a PR
  # stacked on another feature branch used to run none of the real checks and
  # still read GREEN. gitleaks scans the working tree, so what the PR targets
  # has no bearing on what needs scanning. Every pull request gets scanned.
  pull_request:
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: only needs to read the tree to scan it.
permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the release tarball BY CONTENT, not only by version tag. A tag is
      # mutable and a release asset can be replaced, so a version pin alone
      # does not guarantee the same binary runs every time. The download is
      # verified against a sha256 taken from the official v8.30.1 checksums
      # asset BEFORE anything is extracted or executed. sha256sum -c exits
      # non-zero on a mismatch, so a substituted asset fails this step rather
      # than being run. That, plus no dependency on external account state, is
      # what actually makes the check identical on every run and on a fork.
      - name: Install gitleaks v8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 651f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Stage the archive OUTSIDE the working tree: the next step scans
          # this checkout with --no-git --source ., so a tarball left here
          # would become part of what gets scanned.
          TARBALL="${RUNNER_TEMP:?RUNNER_TEMP is not set}/${ASSET}"
          curl -sSfL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          chmod +x ./gitleaks
          ./gitleaks version

      # Scan the whole working tree, not just the diff. A secret that
      # predates this gate cannot launder itself through a rebase or a
      # file move. Findings are redacted: the job reports that a secret
      # exists and where, never the value, because CI logs are public.
      - name: Scan for secrets
        run: |
          ./gitleaks detect \
            --config .gitleaks.toml \
            --redact \
            --no-git \
            --source .
