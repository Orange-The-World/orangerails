name: Secret scan

on:
  # CAVEAT (OR-T1270, 2026-09-14): pull_request fires on opened, reopened
  # and synchronize only. A base-branch RETARGET (this PR's stacked branch
  # was deleted on its parent's merge, and GitHub re-pointed the base to
  # dev) fires none of those, so a head last pushed before the retarget
  # never runs this required check at all: its check-run total_count reads
  # 0 on that head, which is not a failure and does not show up as one.
  # GitHub then reports the PR mergeable_state=blocked even with every
  # visible check green and an approval on file. Fix: push any real commit
  # to the head to force a synchronize event. That also invalidates the
  # existing approval under require_last_push_approval (dev branch
  # protection), so a fresh review at the new head is required before
  # merge.
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the release binary so the check is identical on every run
      # and on a fork, with no dependency on external account state.
      - name: Install gitleaks v8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          chmod +x ./gitleaks

      # Scan the whole working tree, not just the diff. A secret that
      # predates this gate cannot launder itself through a rebase or a
      # file move. Findings are redacted: the job reports that a secret
      # exists and where, never the value, because CI logs are public.
      - name: Scan for secrets
        run: |
          ./gitleaks detect \
            --config .gitleaks.toml \
            --redact \
            --no-git \
            --source .
