name: Bootstrap CF Pages projects

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: List config + variable names
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          for proj in orangerails-prod orangerails-dev orangerails-app orangerails-app-dev orangerails-world orange-world-dev orbi-dev orbi-prod; do
            echo "=== $proj ==="
            curl -sH "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/$proj" > /tmp/p.json
            jq -r '"  source: \(.result.source.config.owner)/\(.result.source.config.repo_name) @ \(.result.source.config.production_branch)"' /tmp/p.json
            jq -r '"  build: " + (.result.build_config.build_command // "(none)") + " out=" + (.result.build_config.destination_dir // "(none)") + " root=" + (.result.build_config.root_dir // "")' /tmp/p.json
            echo "  preview vars:    $(jq -r '.result.deployment_configs.preview.env_vars | keys | join(", ")' /tmp/p.json)"
            echo "  production vars: $(jq -r '.result.deployment_configs.production.env_vars | keys | join(", ")' /tmp/p.json)"
            echo ""
          done
