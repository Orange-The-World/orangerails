name: PR commit-metadata scan (pre-merge gate)

# Scans every commit in EVERY pull request for non-public references in commit
# metadata (author name/email, committer name/email, commit message body)
# BEFORE the merge is allowed.
#
# This is the pre-merge companion to post-merge-hygiene.yml.  The post-merge
# workflow fires on a push to a protected branch, which is after the content is
# permanent and public, so it can report but it cannot prevent.  This workflow
# runs as a PR check, so the merge is rejected if any commit in the PR range
# carries a non-public reference.
#
# OR-T1685: this used to run on pull requests targeting prod only.  Almost
# every pull request here targets dev, so on the ordinary path nothing read a
# commit message before it merged.  That matters more than it would elsewhere
# because our merge path writes a merge commit: every commit on the branch
# becomes an ancestor of dev, survives deleting the branch, and is in every
# clone permanently, on a public repository.
#
# WHAT THIS CANNOT DO, stated so nobody mistakes a green tick for more than it
# is: it matches structural classes and a withheld reserved-term list.  Prose
# is not a regex class.  An attack narrative, or a description of an unfixed
# weakness written in ordinary sentences, will pass this check.  That remains a
# review responsibility and no scanner here should be described as covering it.
#
# Two pattern sources (same as post-merge-hygiene.yml):
#   - GENERIC_PATTERN: structural classes (tailnet hostnames, CGNAT CIDR),
#     safe to commit because it names a class, not a person.
#   - RESERVED_PATTERN: specific internal references, read from the
#     OR_RESERVED_TERMS repo secret so this file never publishes the list.
#     If the secret is unset the reserved-term half is skipped.
#
# Tree-content scanning is owned by repo-hygiene.yml.  This workflow stays
# focused on commit metadata only.

on:
  # DELIBERATELY UNFILTERED, the same reasoning repo-hygiene.yml records for
  # the tree scan (DEV-0283): a pull request stacked on another feature branch
  # ran none of the real checks and still read GREEN.  Commit metadata is a
  # property of the commits, not of the branch they are aimed at, so the target
  # branch says nothing about whether the metadata is clean.  Every pull
  # request gets scanned.
  pull_request:

# Least privilege: this job only reads the repo to inspect commit metadata.
permissions:
  contents: read

jobs:
  pr-metadata-scan:
    name: Commit metadata scan (PR range)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan author + committer + body for non-public references
        env:
          # GENERIC structural pattern: safe to commit (names a class, not a
          # person): tail-net hostnames and the CGNAT /10 block Tailscale
          # assigns. Bare ".local" is intentionally NOT here: it
          # false-positives on .env.local / *.local.json. The specific
          # internal *.local host is carried in the reserved-term list.
          #
          # OR-T1685 adds three more classes, each a SHAPE rather than a value,
          # so this file still publishes nothing:
          #   - a knowledge-base document link (any host, /doc/<slug>), which is
          #     how an internal write-up gets cited in a message
          #   - a chat permalink (/#narrow/...), which is a message-id citation
          #     nobody outside can resolve
          #   - a home directory path (/home/<user>/...), which names an
          #     operator and a machine layout
          # A match on one of these three fires the non-structural branch of the
          # cleared-list check below, so a commit that legitimately has to name
          # one is cleared with class 'reserved'.
          GENERIC_PATTERN: 'tail[a-z0-9]+\.ts\.net|\.tailnet\b|100\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\.[0-9]+\.[0-9]+|https?://[A-Za-z0-9.-]+/doc/[A-Za-z0-9_-]{6,}|/#narrow/|/home/[a-z][a-z0-9_-]*/'
          # Reserved-term pattern: sourced from a secret so this file never
          # stores them; empty when the secret is unset (generic half runs).
          RESERVED_PATTERN: ${{ secrets.OR_RESERVED_TERMS }}
          # Documentation strip-patterns: tokens that only appear in regex /
          # network documentation, never an accidental match. A matching line
          # is re-scanned with these stripped; if it comes back clean it was
          # describing the regex, not a stray reference.
          DOC_STRIP_CGNAT: '100\.64\.0\.0/10'
          DOC_STRIP_REGEX_ALT: '\([0-9]+(\|[0-9]+)+\)'
          # PR range: all commits that will land on prod if this PR merges.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          RANGE="$BASE_SHA..$HEAD_SHA"
          echo "Scanning PR range: $RANGE"

          PATTERN="$GENERIC_PATTERN"
          if [ -n "${RESERVED_PATTERN:-}" ]; then
            PATTERN="$PATTERN|$RESERVED_PATTERN"
          else
            echo "::notice::OR_RESERVED_TERMS secret not set : scanning generic structural patterns only."
          fi

          # Cleared-list: per-SHA exemptions for commits whose metadata contains
          # a structural pattern the doc-strip cannot remove.
          # Format (one entry per line): <40-hex-sha> <classes> <reason>
          # <classes> is a mandatory comma-separated subset of: cgnat, tailnet, reserved
          CLEARED_LIST_FILE=".github/commit-metadata-cleared.txt"
          declare -A CLEARED_SHA_MAP
          if [ -f "$CLEARED_LIST_FILE" ]; then
            while IFS= read -r entry; do
              [[ -z "$entry" || "$entry" =~ ^# ]] && continue
              sha="${entry:0:40}"
              rest="${entry:41}"
              if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::$CLEARED_LIST_FILE: invalid entry -- not a 40-char lowercase hex SHA"
                exit 1
              fi
              classes="${rest%% *}"
              if [[ -z "$classes" ]]; then
                echo "::error::$CLEARED_LIST_FILE: SHA $sha missing class field (required: non-empty comma-separated subset of cgnat,tailnet,reserved)"
                exit 1
              fi
              if [[ "$classes" == "$rest" ]]; then
                echo "::error::$CLEARED_LIST_FILE: SHA $sha has no reason (format: <sha> <classes> <reason>)"
                exit 1
              fi
              reason="${rest#"$classes" }"
              if [[ ! "$reason" =~ [^[:space:]] ]]; then
                echo "::error::$CLEARED_LIST_FILE: SHA $sha has blank reason (required)"
                exit 1
              fi
              IFS=',' read -ra _class_tokens <<< "$classes"
              for _tok in "${_class_tokens[@]}"; do
                case "$_tok" in
                  cgnat|tailnet|reserved) ;;
                  *) echo "::error::$CLEARED_LIST_FILE: SHA $sha has unknown class '$_tok' (must be cgnat, tailnet, or reserved)"; exit 1 ;;
                esac
              done
              CLEARED_SHA_MAP["$sha"]="$classes"
            done < "$CLEARED_LIST_FILE"
            echo "Cleared list loaded: ${#CLEARED_SHA_MAP[@]} SHA(s) from $CLEARED_LIST_FILE"
          fi

          # Sub-patterns used by the cleared-list exemption check.
          _CGNAT_BARE='100\.(6[4-9]|[7-9][0-9]|1[0-1][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          _TAILNET_PAT='tail[a-z0-9]+\.ts\.net|\.tailnet\b'

          # Self-test 1: a bare CGNAT address must still match PATTERN after
          # doc-strip. If doc-strip silences it, the strip is too broad.
          _ST1="AUTHOR Someone <someone@example.com> COMMITTER git <git@example.com> 100.64.0.1"
          if ! echo "$_ST1" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 1 FAIL: PATTERN does not match a bare CGNAT address. Scanner is broken."
            exit 1
          fi
          _ST1_CLEAN=$(echo "$_ST1" | sed -E "s|${DOC_STRIP_CGNAT}|[CGNAT-BLOCK]|g; s|${DOC_STRIP_REGEX_ALT}|[REGEX-ALT]|g")
          if ! echo "$_ST1_CLEAN" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 1 FAIL: doc-strip incorrectly cleared a bare CGNAT address. Scanner is broken."
            exit 1
          fi
          echo "Self-test 1 passed: bare CGNAT address survives doc-strip."

          # Self-test 2: cgnat-only cleared SHA must still FAIL a tailnet line.
          _ST2_SHA="aaaa0000aaaa0000aaaa0000aaaa0000aaaa0000"
          CLEARED_SHA_MAP["$_ST2_SHA"]="cgnat"
          _ST2_LINE="AUTHOR Test <user@badhost.tailtest.ts.net> COMMITTER test <ci@example.com>"
          _ST2_CLEAN=$(echo "$_ST2_LINE" | sed -E "s|${DOC_STRIP_CGNAT}|[CGNAT-BLOCK]|g; s|${DOC_STRIP_REGEX_ALT}|[REGEX-ALT]|g")
          _st2_cgnat=$(echo "$_ST2_CLEAN" | grep -cEi "$_CGNAT_BARE" || true)
          _st2_tailnet=$(echo "$_ST2_CLEAN" | grep -cEi "$_TAILNET_PAT" || true)
          _st2_would_exempt=0
          if [[ -n "${CLEARED_SHA_MAP[$_ST2_SHA]+set}" ]]; then
            _st2_cleared="${CLEARED_SHA_MAP[$_ST2_SHA]}"
            if [ "$_st2_cgnat" -gt 0 ] || [ "$_st2_tailnet" -gt 0 ]; then
              _st2_subset=1
              if [ "$_st2_cgnat" -gt 0 ] && ! echo "$_st2_cleared" | grep -qE '(^|,)cgnat(,|$)'; then _st2_subset=0; fi
              if [ "$_st2_tailnet" -gt 0 ] && ! echo "$_st2_cleared" | grep -qE '(^|,)tailnet(,|$)'; then _st2_subset=0; fi
              if [ "$_st2_subset" -eq 1 ]; then _st2_would_exempt=1; fi
            fi
          fi
          unset "CLEARED_SHA_MAP[$_ST2_SHA]"
          if [ "$_st2_would_exempt" -ne 0 ]; then
            echo "::error::Self-test 2 FAIL: cgnat-only cleared SHA incorrectly exempted a tailnet line. Scanner is broken."
            exit 1
          fi
          echo "Self-test 2 passed: cleared SHA with cgnat only correctly fails a tailnet line."

          # Self-test 3: cleared-list exemption must NOT apply to un-cleared SHAs.
          _ST3_SHA="deadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
          _st3_would_exempt=0
          if [[ -n "${CLEARED_SHA_MAP[$_ST3_SHA]+set}" ]]; then
            _c=$(echo "100.64.0.1" | grep -cEi "$_CGNAT_BARE" || true)
            _t=$(echo "100.64.0.1" | grep -cEi "$_TAILNET_PAT" || true)
            if [ "$_c" -gt 0 ] && [ "$_t" -eq 0 ]; then
              _st3_would_exempt=1
            fi
          fi
          if [ "$_st3_would_exempt" -ne 0 ]; then
            echo "::error::Self-test 3 FAIL: exemption logic fired on an un-cleared SHA. Scanner is broken."
            exit 1
          fi
          echo "Self-test 3 passed: un-cleared SHA CGNAT match correctly not exempted."

          # Self-test 4: cleared SHA with cgnat,tailnet must EXEMPT a line
          # matching both.
          _ST4_SHA="cccc1111cccc1111cccc1111cccc1111cccc1111"
          CLEARED_SHA_MAP["$_ST4_SHA"]="cgnat,tailnet"
          _ST4_LINE="AUTHOR Test <ci@100.64.0.1> COMMITTER ci <git@host.tailfake4.ts.net>"
          _ST4_CLEAN=$(echo "$_ST4_LINE" | sed -E "s|${DOC_STRIP_CGNAT}|[CGNAT-BLOCK]|g; s|${DOC_STRIP_REGEX_ALT}|[REGEX-ALT]|g")
          _st4_cgnat=$(echo "$_ST4_CLEAN" | grep -cEi "$_CGNAT_BARE" || true)
          _st4_tailnet=$(echo "$_ST4_CLEAN" | grep -cEi "$_TAILNET_PAT" || true)
          _st4_would_exempt=0
          if [[ -n "${CLEARED_SHA_MAP[$_ST4_SHA]+set}" ]]; then
            _st4_cleared="${CLEARED_SHA_MAP[$_ST4_SHA]}"
            if [ "$_st4_cgnat" -gt 0 ] || [ "$_st4_tailnet" -gt 0 ]; then
              _st4_subset=1
              if [ "$_st4_cgnat" -gt 0 ] && ! echo "$_st4_cleared" | grep -qE '(^|,)cgnat(,|$)'; then _st4_subset=0; fi
              if [ "$_st4_tailnet" -gt 0 ] && ! echo "$_st4_cleared" | grep -qE '(^|,)tailnet(,|$)'; then _st4_subset=0; fi
              if [ "$_st4_subset" -eq 1 ]; then _st4_would_exempt=1; fi
            fi
          fi
          unset "CLEARED_SHA_MAP[$_ST4_SHA]"
          if [ "$_st4_would_exempt" -eq 0 ]; then
            echo "::error::Self-test 4 FAIL: both-class cleared SHA did not exempt a matching line. Scanner is broken."
            exit 1
          fi
          echo "Self-test 4 passed: cleared SHA with cgnat,tailnet correctly exempts a line matching both."

          # Self-test 5a: cleared SHA with cgnat,tailnet does NOT exempt a reserved-term-only match.
          # A match that triggers neither structural sub-pattern is not covered by structural classes,
          # even when the SHA is on the cleared list with all known structural classes.
          _ST5A_SHA="5555aaaa5555aaaa5555aaaa5555aaaa5555aaaa"
          CLEARED_SHA_MAP["$_ST5A_SHA"]="cgnat,tailnet"
          # Simulate a reserved-term-only match: neither structural sub-pattern fires.
          _st5a_cgnat=0
          _st5a_tailnet=0
          _st5a_would_exempt=0
          if [[ -n "${CLEARED_SHA_MAP[$_ST5A_SHA]+set}" ]]; then
            _st5a_cleared="${CLEARED_SHA_MAP[$_ST5A_SHA]}"
            if [ "$_st5a_cgnat" -gt 0 ] || [ "$_st5a_tailnet" -gt 0 ]; then
              _st5a_subset=1
              if [ "$_st5a_cgnat" -gt 0 ] && ! echo "$_st5a_cleared" | grep -qE '(^|,)cgnat(,|$)'; then _st5a_subset=0; fi
              if [ "$_st5a_tailnet" -gt 0 ] && ! echo "$_st5a_cleared" | grep -qE '(^|,)tailnet(,|$)'; then _st5a_subset=0; fi
              if [ "$_st5a_subset" -eq 1 ]; then _st5a_would_exempt=1; fi
            else
              if echo "$_st5a_cleared" | grep -qE '(^|,)reserved(,|$)'; then _st5a_would_exempt=1; fi
            fi
          fi
          unset "CLEARED_SHA_MAP[$_ST5A_SHA]"
          if [ "$_st5a_would_exempt" -ne 0 ]; then
            echo "::error::Self-test 5a FAIL: cgnat,tailnet cleared SHA incorrectly exempted a reserved-term-only match. Scanner is broken."
            exit 1
          fi
          echo "Self-test 5a passed: cleared SHA with cgnat,tailnet correctly fails a reserved-term-only match."

          # Self-test 5b: cleared SHA with 'reserved' class DOES exempt a reserved-term-only match.
          # Proves the reserved-class path fires when neither structural sub-pattern matched.
          _ST5B_SHA="6666bbbb6666bbbb6666bbbb6666bbbb6666bbbb"
          CLEARED_SHA_MAP["$_ST5B_SHA"]="reserved"
          _st5b_cgnat=0
          _st5b_tailnet=0
          _st5b_would_exempt=0
          if [[ -n "${CLEARED_SHA_MAP[$_ST5B_SHA]+set}" ]]; then
            _st5b_cleared="${CLEARED_SHA_MAP[$_ST5B_SHA]}"
            if [ "$_st5b_cgnat" -gt 0 ] || [ "$_st5b_tailnet" -gt 0 ]; then
              _st5b_subset=1
              if [ "$_st5b_cgnat" -gt 0 ] && ! echo "$_st5b_cleared" | grep -qE '(^|,)cgnat(,|$)'; then _st5b_subset=0; fi
              if [ "$_st5b_tailnet" -gt 0 ] && ! echo "$_st5b_cleared" | grep -qE '(^|,)tailnet(,|$)'; then _st5b_subset=0; fi
              if [ "$_st5b_subset" -eq 1 ]; then _st5b_would_exempt=1; fi
            else
              if echo "$_st5b_cleared" | grep -qE '(^|,)reserved(,|$)'; then _st5b_would_exempt=1; fi
            fi
          fi
          unset "CLEARED_SHA_MAP[$_ST5B_SHA]"
          if [ "$_st5b_would_exempt" -eq 0 ]; then
            echo "::error::Self-test 5b FAIL: 'reserved' cleared SHA did not exempt a reserved-term-only match. Scanner is broken."
            exit 1
          fi
          echo "Self-test 5b passed: cleared SHA with 'reserved' class correctly exempts a reserved-term-only match."

          # Self-test 6: a knowledge-base document link must match, and must
          # survive doc-strip. This is the class a tree scan cannot see: the
          # link is in the message, not in any file.
          _ST6="body: write-up at https://kb.example-internal.test/doc/some-note-AbC123"
          if ! echo "$_ST6" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 6 FAIL: PATTERN does not match a knowledge-base document link. Scanner is broken."
            exit 1
          fi
          echo "Self-test 6 passed: knowledge-base document link matches."

          # Self-test 7: a chat permalink (a message-id citation) must match.
          _ST7="body: agreed at https://chat.example-internal.test/#narrow/stream/7-general/topic/x/near/2467"
          if ! echo "$_ST7" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 7 FAIL: PATTERN does not match a chat permalink. Scanner is broken."
            exit 1
          fi
          echo "Self-test 7 passed: chat permalink matches."

          # Self-test 8: a home directory path must match.
          _ST8="body: ran /home/exampleuser/scripts/thing.sh before merging"
          if ! echo "$_ST8" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 8 FAIL: PATTERN does not match a home directory path. Scanner is broken."
            exit 1
          fi
          echo "Self-test 8 passed: home directory path matches."

          # Self-test 9 is NEGATIVE and it is the one that keeps this check
          # alive. An ordinary commit message, including an ordinary public
          # documentation link, must NOT match. A scanner that fires on
          # everything gets switched off within a week, so a pattern that got
          # too broad has to fail here rather than in everyone's pull request.
          _ST9="Read the OHLC result key by shape (see https://docs.example.com/api/reference)"
          if echo "$_ST9" | grep -qEi "$PATTERN"; then
            echo "::error::Self-test 9 FAIL: PATTERN matches an ordinary commit message. Scanner is too broad and would block every pull request."
            exit 1
          fi
          echo "Self-test 9 passed: an ordinary commit message does not match."

          # Self-test 10: the commit counter must read an EMPTY log as zero.
          # Zero is the value the refusal below fires on, so this is the proof
          # that "I could not look" is loud rather than quietly green.
          _ST10_FILE="$(mktemp)"
          : > "$_ST10_FILE"
          _st10_count=$(grep -cE '^[0-9a-f]{40} AUTHOR ' "$_ST10_FILE" || true)
          rm -f "$_ST10_FILE"
          if [ "$_st10_count" -ne 0 ]; then
            echo "::error::Self-test 10 FAIL: the commit counter reported $_st10_count for an empty log. The empty-set refusal below could never fire."
            exit 1
          fi
          echo "Self-test 10 passed: an empty commit set counts 0, which is what the refusal below fires on."

          # Capture the log FIRST. Feeding git log into the loop through a
          # process substitution hides two failures: a failing git log does not
          # fail the script, because the status belongs to the substitution and
          # not to the loop, and a range with no commits runs the loop zero
          # times and reports a clean scan it never performed.
          LOG_FILE="$(mktemp)"
          if ! git log "$RANGE" --format='%H AUTHOR %an <%ae> COMMITTER %cn <%ce>%n%B%n--END--' > "$LOG_FILE"; then
            echo "::error::git log failed for range $RANGE. This check could not look, so it fails rather than reporting a clean scan."
            exit 1
          fi
          COMMIT_COUNT=$(grep -cE '^[0-9a-f]{40} AUTHOR ' "$LOG_FILE" || true)
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "::error::Range $RANGE produced ZERO commits. An empty set is not a clean scan: either the range is wrong or the history was not fetched. Refusing rather than passing."
            exit 1
          fi
          echo "Commits in range: $COMMIT_COUNT"

          MATCHES=0
          CURRENT_SHA="(unknown)"
          while IFS= read -r line; do
            if [[ "$line" == "--END--" ]]; then
              CURRENT_SHA="(unknown)"
              continue
            fi
            if [[ "$line" =~ ^([0-9a-f]{40})\ AUTHOR\  ]]; then
              CURRENT_SHA="${BASH_REMATCH[1]}"
            fi
            if echo "$line" | grep -qEi "$PATTERN"; then
              cleaned=$(echo "$line" | sed -E "s|${DOC_STRIP_CGNAT}|[CGNAT-BLOCK]|g; s|${DOC_STRIP_REGEX_ALT}|[REGEX-ALT]|g")
              if ! echo "$cleaned" | grep -qEi "$PATTERN"; then
                echo "::notice::Allowlisted documentation line (CGNAT block or regex syntax)."
                continue
              fi
              # Cleared-list check: exempts structural match classes on known SHAs,
              # and reserved-term matches when the cleared entry carries the 'reserved' class.
              if [[ -n "${CLEARED_SHA_MAP[$CURRENT_SHA]+set}" ]]; then
                _cleared="${CLEARED_SHA_MAP[$CURRENT_SHA]}"
                _is_cgnat=$(echo "$cleaned" | grep -cEi "$_CGNAT_BARE" || true)
                _is_tailnet=$(echo "$cleaned" | grep -cEi "$_TAILNET_PAT" || true)
                if [ "$_is_cgnat" -gt 0 ] || [ "$_is_tailnet" -gt 0 ]; then
                  # Structural match: all triggered structural classes must be in the cleared entry.
                  _subset=1
                  if [ "$_is_cgnat" -gt 0 ] && ! echo "$_cleared" | grep -qE '(^|,)cgnat(,|$)'; then _subset=0; fi
                  if [ "$_is_tailnet" -gt 0 ] && ! echo "$_cleared" | grep -qE '(^|,)tailnet(,|$)'; then _subset=0; fi
                  if [ "$_subset" -eq 1 ]; then
                    echo "::notice::SHA $CURRENT_SHA cleared for structural classes ($_cleared); match exempted."
                    continue
                  fi
                else
                  # Reserved-term-only match: exempt only when the cleared entry carries 'reserved'.
                  if echo "$_cleared" | grep -qE '(^|,)reserved(,|$)'; then
                    echo "::notice::SHA $CURRENT_SHA cleared for reserved class; reserved-term match exempted."
                    continue
                  fi
                fi
              fi
              # Do NOT echo the matched content: Actions logs are world-readable
              # on a public repo.
              echo "::error::Non-public reference in commit ${CURRENT_SHA}'s metadata. Add to .github/commit-metadata-cleared.txt with class 'cgnat', 'tailnet', or 'reserved' ('reserved' when the commit message quotes a term to describe its own removal). (Matched text withheld.)"
              MATCHES=$((MATCHES + 1))
            fi
          done < "$LOG_FILE"
          rm -f "$LOG_FILE"

          if [ "$MATCHES" -gt 0 ]; then
            echo "::error::PR metadata scan failed: $MATCHES line(s) carry non-public references. The merge is blocked."
            exit 1
          fi
          echo "PR metadata scan clean: 0 lines carry non-public references across $COMMIT_COUNT commit(s) in range $RANGE."
          echo "Scope note: structural classes and the reserved-term list only. Prose is not checked."
