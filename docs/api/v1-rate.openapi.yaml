openapi: "3.1.0"
info:
  title: ORBI Point-in-Time Rate API
  version: "1.0.0"
  description: >
    Returns the ORBI-verified exchange rate for a given asset, fiat, and UTC timestamp.
    Replaces CoinGecko historical-price lookups. Multi-consumer, keyed, metered.

servers:
  - url: https://<orbi-prod-project-ref>.supabase.co/functions/v1
    description: ORBI production (flag-gated; replace project ref)

security:
  - BearerAuth: []

paths:
  /v1-rate:
    get:
      summary: Single rate lookup
      operationId: getSingleRate
      parameters:
        - name: asset
          in: query
          required: true
          schema: { type: string, example: BTC }
        - name: fiat
          in: query
          required: true
          schema: { type: string, example: USD }
        - name: at
          in: query
          required: true
          description: UTC timestamp, ISO-8601
          schema: { type: string, format: date-time, example: "2024-03-15T14:32:00Z" }
      responses:
        "200":
          description: Resolved rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

    post:
      summary: Batch rate lookup (up to 50 items)
      operationId: batchRates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/RateRequest"
                - type: array
                  items: { $ref: "#/components/schemas/RateRequest" }
                  maxItems: 50
      responses:
        "200":
          description: Resolved rate(s)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RateResult"
                  - $ref: "#/components/schemas/BatchResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    RateRequest:
      type: object
      required: [asset, fiat, at]
      properties:
        asset: { type: string, example: BTC }
        fiat: { type: string, example: USD }
        at: { type: string, format: date-time, example: "2024-03-15T14:32:00Z" }

    RateResult:
      type: object
      required: [asset, fiat, requested_at, resolved_at, fill_type]
      properties:
        asset: { type: string }
        fiat: { type: string }
        requested_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        rate: { type: number, nullable: true }
        provenance: { type: string, nullable: true }
        tier: { type: string, nullable: true }
        source_authority: { type: string, nullable: true }
        fill_type:
          type: string
          enum: [exact, forward_fill, gap]
          description: >
            exact: a rate existed at this exact UTC minute.
            forward_fill: nearest prior minute used; resolved_at shows which.
            gap: no data for this pair before this timestamp; rate is null.

    BatchResult:
      type: object
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/RateResult" }
        count: { type: integer }

    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }

  responses:
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Internal error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
