# Shared import map: pins all esm.sh CDN specifiers to immutable npm: versions
# so edge functions never resolve live CDN bytes at deploy time. (DL-0506)
[functions]
import_map = "./functions/import_map.json"

# Functions deployed with verify_jwt = false do their OWN auth at the
# function-code level (X-Platform-API-Key via _shared/platform-auth.ts,
# widget_token validation against pending_widget_sessions, or Ed25519
# signature verification). The Supabase Gateway must pass requests
# through to them; otherwise the gateway returns 401 with
# UNAUTHORIZED_NO_AUTH_HEADER before the function code can run and apply
# its own auth check. See full audit at
#
# Functions NOT listed here (e.g. sync-blink) intentionally require a real
# Supabase / shadow-user JWT and benefit from the gateway pre-check
# (verify_jwt = true default).

# --- Public, no auth --------------------------------------------------
[functions.or-providers]
verify_jwt = false

[functions.or-platform-display]
verify_jwt = false

# --- Platform API key auth via X-Platform-API-Key header --------------
[functions.or-link-mint-token]
verify_jwt = false

[functions.or-connection-create]
verify_jwt = false

[functions.or-connection-delete]
verify_jwt = false

[functions.or-connection-confirm]
verify_jwt = false

[functions.or-connection-cancel]
verify_jwt = false

[functions.or-connection-list]
verify_jwt = false

[functions.or-discover-wallets]
verify_jwt = false

[functions.or-provision]
verify_jwt = false

[functions.or-source-wallets-set]
verify_jwt = false

[functions.or-stealth-connection-create]
verify_jwt = false

[functions.or-stealth-connection-delete]
verify_jwt = false

[functions.or-stealth-connection-list]
verify_jwt = false

[functions.or-stealth-envelope-fetch]
verify_jwt = false

[functions.or-stealth-envelope-update]
verify_jwt = false

[functions.or-stealth-transactions-store]
verify_jwt = false

[functions.or-strike-webhook]
verify_jwt = false

[functions.or-sync]
verify_jwt = false

[functions.or-transactions-list]
verify_jwt = false

# --- Widget-session token auth via body.widget_token ------------------
[functions.or-link-complete]
verify_jwt = false

# --- Quiltt Phase 1: HMAC, platform API key, widget token, internal token ---
# or-quiltt-webhook verifies a Quiltt HMAC signature header.
# or-quiltt-session uses platform-mode auth (X-Platform-API-Key).
# or-quiltt-link-complete uses widget_token (same pattern as or-link-complete).
# or-sync-key-register uses platform-mode auth.
# or-quiltt-sync uses an internal worker token (never exposed to integrators).
[functions.or-quiltt-webhook]
verify_jwt = false

[functions.or-quiltt-session]
verify_jwt = false

[functions.or-quiltt-link-complete]
verify_jwt = false

[functions.or-sync-key-register]
verify_jwt = false

[functions.or-quiltt-sync]
verify_jwt = false

[functions.or-quiltt-disconnect]
verify_jwt = false

[functions.or-quiltt-accounts]
verify_jwt = false

[functions.or-institutions-catalog]
verify_jwt = false

[functions.or-quiltt-session-via-widget]
verify_jwt = false

# Public bootstrap handshake , authentication is by X-OR-Api-Key, no JWT yet.
# This endpoint is what every consumer calls before it has any other OR context.
[functions.or-platform-bootstrap]
verify_jwt = false

# or-quiltt-session-revoke uses widget_token only (no headers). Same shape
# as or-quiltt-session-via-widget. Public so consumers can release a Quiltt
# session that was never bound to a successful bank link, freeing the
# per-Profile rate-limit quota.
[functions.or-quiltt-session-revoke]
verify_jwt = false

# --- ORBI API key auth (orbi_api_keys table, SHA-256 hash check) ------
# v1-rate authenticates against orbi_api_keys, not the platform key table.
# Gateway must pass through so the function's own auth block can run.
[functions.v1-rate]
verify_jwt = false
